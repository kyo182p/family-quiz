<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家庭題庫練習｜植物小學堂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F7EA; --grid:#DCEBD2; --ink:#1E3A2B; --muted:#5A7464;
  --card:#FFFFFF; --leaf:#3D8B4F; --leaf-soft:#D6EBCF; --sun:#F2B23A; --sun-soft:#FFF1CC;
  --coral:#E25D44; --coral-soft:#FBE0DA; --soil:#8B5E3C; --line:#C9DDBF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#13201A; --grid:#1B2C23; --ink:#E4F0E4; --muted:#9DB8A6;
    --card:#1C2C23; --leaf:#6CC17F; --leaf-soft:#25412E; --sun:#F5BE4E; --sun-soft:#3D3318;
    --coral:#FF7A63; --coral-soft:#4A2620; --soil:#C49470; --line:#2E4637;
  }
}
:root[data-theme="dark"]{
  --paper:#13201A; --grid:#1B2C23; --ink:#E4F0E4; --muted:#9DB8A6;
  --card:#1C2C23; --leaf:#6CC17F; --leaf-soft:#25412E; --sun:#F5BE4E; --sun-soft:#3D3318;
  --coral:#FF7A63; --coral-soft:#4A2620; --soil:#C49470; --line:#2E4637;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; color:var(--ink);
  font-family:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-tap-highlight-color:transparent;
}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
h1{font-size:2.4rem;margin:8px 0 4px;letter-spacing:.04em}
.lead{color:var(--muted);font-size:1.1rem;margin:0 0 20px;line-height:1.6}
.hero{display:flex;align-items:center;gap:16px}
.hero svg{flex:0 0 96px;width:96px;height:96px}
.section-title{font-size:1.15rem;margin:22px 0 10px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  border:2px solid var(--line);background:var(--card);border-radius:999px;
  padding:10px 18px;font-size:1.15rem;min-height:48px;
}
.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.chip small{opacity:.75;margin-left:4px}
.big{
  display:block;width:100%;margin-top:26px;border:none;border-radius:20px;
  background:var(--leaf);color:#fff;font-size:1.5rem;padding:18px;min-height:64px;
  box-shadow:0 5px 0 #2a6438;
}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #2a6438}
.ghost{
  display:block;width:100%;margin-top:12px;border:2px dashed var(--line);background:transparent;
  border-radius:16px;padding:14px;font-size:1.15rem;min-height:56px;color:var(--ink)
}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.iconbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px;font-size:1rem;min-height:44px}
.vine{width:100%;height:auto;display:block;margin:6px 0 4px}
.counter{color:var(--muted);font-size:1rem}
.card{
  background:var(--card);border:2px solid var(--line);border-radius:22px;
  padding:20px 18px;margin-top:10px;
}
.tag{display:inline-block;font-size:.95rem;background:var(--leaf-soft);color:var(--ink);border-radius:8px;padding:3px 10px}
.retry-tag{background:var(--sun-soft)}
.qrow{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.qtext{font-size:1.6rem;line-height:1.55;margin:0;flex:1}
.speak{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-size:1.5rem}
.opts{display:grid;gap:12px;margin-top:20px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{
  display:flex;align-items:center;gap:12px;text-align:left;
  border:3px solid var(--line);background:var(--card);border-radius:18px;
  padding:14px 16px;font-size:1.35rem;min-height:66px;line-height:1.4;
}
.opt .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--leaf-soft);display:grid;place-items:center;font-size:1.05rem}
.opts.tf .opt{justify-content:center;flex-direction:column;font-size:1.4rem;min-height:120px}
.opts.tf .sym{font-size:3rem;line-height:1}
.opt.correct{border-color:var(--leaf);background:var(--leaf-soft)}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft)}
.opt:disabled{cursor:default}
.opt:disabled:not(.correct):not(.wrong){opacity:.5}
.feedback{margin-top:18px;border-radius:18px;padding:16px;border:3px solid var(--leaf);background:var(--leaf-soft)}
.feedback.bad{border-color:var(--coral);background:var(--coral-soft)}
.fb-head{font-size:1.5rem;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.fb-why{font-size:1.25rem;line-height:1.7;margin:0}
.pic{margin-top:14px;background:#FAFDF7;border-radius:14px;padding:10px;color:#1E3A2B;overflow-x:auto}
.pic svg{display:block;width:100%;height:auto;max-height:280px}
.rows{display:grid;gap:8px}
.r{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;font-size:1.15rem;line-height:1.5}
.r .e{font-size:2rem;flex:0 0 44px;text-align:center}
.r b{flex:0 0 auto;min-width:4.5em}
.r.hl{background:#FFF1CC;outline:2px solid #F2B23A}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.leaf-in{transform-box:fill-box;transform-origin:50% 100%;animation:grow .5s ease-out}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
.score{font-size:3.2rem;margin:6px 0}
.list{margin:10px 0 0;padding:0;list-style:none}
.list li{padding:12px 4px;border-bottom:1px dashed var(--line);font-size:1.1rem;line-height:1.5;display:flex;justify-content:space-between;gap:12px}
.list .cnt{flex:0 0 auto;color:var(--coral)}
.toggle{display:flex;align-items:center;gap:10px;font-size:1.1rem;margin-top:18px}
.toggle input{width:24px;height:24px}
.footer{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
.footer button{flex:1}

.beta-btn{display:inline-flex;align-items:center;gap:6px}
.bankcard{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin-top:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px}
.bk-title{font-size:1.3rem}.bk-meta{color:var(--muted);font-size:1rem}
.form label{display:flex;flex-direction:column;gap:6px;font-size:1.05rem;margin-top:12px}
.form input:not([type=radio]):not([type=checkbox]):not([type=file]),.form select,.form textarea{font:inherit;font-size:1.1rem;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
.form input[type=file]{font:inherit;font-size:1rem;max-width:100%}
.optrow{flex-direction:row!important;align-items:center}
.optrow input[type=radio]{width:24px;height:24px;flex:0 0 auto}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumb{position:relative}.thumb img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
.thumb button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:none;background:var(--coral);color:#fff}
.tag.warn{background:var(--coral-soft)}
.pickbtn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 16px;font-size:1.1rem;cursor:pointer;min-height:52px}
.pickbtn:focus-within{outline:3px solid var(--sun)}
.tipbox{margin-top:10px;background:var(--sun-soft);border-radius:14px;padding:12px 14px;font-size:1.05rem;line-height:1.6}.tipbox p{margin:2px 0}
.bpic{text-align:center}.bicon{font-size:4rem;line-height:1.2}.bpic p{font-size:1.15rem;margin:6px 0 0;text-align:left}
.chip:disabled{opacity:.45;cursor:default}
.ghost:disabled{opacity:.5;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px;font-size:1.05rem;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:30;padding:20px}
.modal-card{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;max-width:420px;width:100%;font-size:1.15rem;line-height:1.6}
.iconbtn.danger{background:var(--coral);border-color:var(--coral);color:#fff}
@media (max-width:480px){
  h1{font-size:1.9rem}
  .qtext{font-size:1.35rem}
  .opt{font-size:1.2rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ===== 題庫：依安親班解題錄音整理（三上自然・植物） ===== */
const UNITS = {leaf:'葉子', stem:'莖', root:'根', flower:'花、果實、種子', life:'觀察和生活'};

const Q = [
 // 葉子
 {id:'L1',u:'leaf',t:'tf',q:'植物的葉子都是綠色的。',a:'X',why:'不一定喔！有些葉子是紅色、黃色、粉紅色。例如聖誕紅的葉子就是紅色的。',pic:'colors'},
 {id:'L2',u:'leaf',t:'mc',q:'哪一種植物的葉子長得很像愛心？',o:['菩提樹','榕樹','椰子樹','青江菜'],a:'菩提樹',why:'菩提樹的葉子形狀像一顆愛心。',pic:'heart'},
 {id:'L3',u:'leaf',t:'tf',q:'榕樹的葉子是網狀脈。',a:'O',why:'對！榕樹葉子上的紋路像一張網，叫做網狀脈。',pic:'net'},
 {id:'L4',u:'leaf',t:'tf',q:'葉子的邊緣叫做葉緣，葉緣都是平滑的。',a:'X',why:'葉子的邊緣叫葉緣沒錯，但不是都平滑的，還有波浪狀和鋸齒狀。',pic:'margins'},
 {id:'L5',u:'leaf',t:'tf',q:'葉子在莖上生長的方式，叫做「葉節」。',a:'X',why:'葉子生長的方式叫做「葉序」，不是葉節喔！',pic:'arr'},
 {id:'L6',u:'leaf',t:'tf',q:'青江菜的葉子會集中長在一起，這叫做叢生。',a:'O',why:'對！青江菜的葉子集中生長，是叢生。',pic:'arr:叢生'},
 {id:'L7',u:'leaf',t:'mc',q:'一個節長出三片葉子，這種葉序叫做什麼？',o:['輪生','對生','互生','叢生'],a:'輪生',why:'輪生是一個節長三片葉子。',pic:'arr:輪生'},
 {id:'L8',u:'leaf',t:'mc',q:'一個節長出兩片葉子，長在對面，叫做什麼？',o:['對生','輪生','互生','叢生'],a:'對生',why:'一個節長兩片，長在對面，叫做對生。',pic:'arr:對生'},
 {id:'L9',u:'leaf',t:'mc',q:'互生是一個節長幾片葉子？',o:['一片','兩片','三片'],a:'一片',why:'互生是一個節只長一片葉子，例如榕樹。',pic:'arr:互生'},
 {id:'L10',u:'leaf',t:'mc',q:'葉子上的紋路叫做什麼？',o:['葉脈','葉緣','葉序'],a:'葉脈',why:'葉子上的紋路叫做葉脈；葉子的邊緣才叫葉緣。',pic:'net'},
 {id:'L11',u:'leaf',t:'mc',q:'哪一種植物在秋冬的時候，葉子不會變成紅褐色？',o:['椰子樹','台灣欒樹','楓樹','落羽松'],a:'椰子樹',why:'椰子樹的葉子秋冬也不會變成紅褐色，要背起來！',pic:'autumn'},
 {id:'L12',u:'leaf',t:'tf',q:'到了秋天，台灣欒樹的葉子會變成粉紅色。',a:'X',why:'老師說：秋天的台灣欒樹應該是橘紅色，粉紅色是錯的。',pic:'autumn'},
 // 莖
 {id:'S1',u:'stem',t:'tf',q:'植物的莖都是高大直立的。',a:'X',why:'小草的莖矮矮的，是草本莖；牽牛花、葡萄的莖彎彎曲曲，是藤本莖；樹的莖才高大直立，是木本莖。',pic:'stems'},
 {id:'S2',u:'stem',t:'tf',q:'植物的莖上有節，節上只會長葉子。',a:'X',why:'節上除了長葉子，還會長花和果實。',pic:'node'},
 {id:'S3',u:'stem',t:'tf',q:'榕樹小時候是草本莖，長大後才變成木本莖。',a:'X',why:'榕樹小時候就是木本莖，長大後還是木本莖。沒有植物會從草本莖變成木本莖。',pic:'stems:木本莖'},
 {id:'S4',u:'stem',t:'mc',q:'哪一種植物是草本莖？',o:['咸豐草','榕樹','菩提樹','牽牛花'],a:'咸豐草',why:'咸豐草是小草，是草本莖。榕樹、菩提樹有「樹」，是木本莖；牽牛花是藤本莖。',pic:'stems:草本莖'},
 {id:'S5',u:'stem',t:'mc',q:'牽牛花是哪一種莖？',o:['藤本莖','草本莖','木本莖'],a:'藤本莖',why:'牽牛花和葡萄的莖彎彎曲曲，是藤本莖。',pic:'stems:藤本莖'},
 {id:'S6',u:'stem',t:'mc',q:'植物的名字裡看到哪一個字，就知道它是木本莖？',o:['樹','草','花','菜'],a:'樹',why:'看到「樹」，它就是木本莖！',pic:'stems:木本莖'},
 {id:'S7',u:'stem',t:'mc',q:'哪一個「不是」莖的功能？',o:['吸收陽光','運送養分','長出葉子','長出花和果實'],a:'吸收陽光',why:'吸收陽光是葉子的功能。莖負責運送，節上會長葉子、花和果實。',pic:'transport'},
 {id:'S8',u:'stem',t:'mc',q:'根吸收土裡的養分後，是誰把養分運送到植物全身？',o:['莖','葉','花','果實'],a:'莖',why:'根負責吸收，莖負責運送。',pic:'transport'},
 {id:'S9',u:'stem',t:'mc',q:'哪一種植物的莖適合做家具？',o:['大樹','小草','牽牛花','青江菜'],a:'大樹',why:'大樹是木本莖，又粗又硬，適合做家具。',pic:'furniture'},
 {id:'S10',u:'stem',t:'tf',q:'每一種植物的莖都可以拿來做家具。',a:'X',why:'不是每一種都可以！只有木本莖（看到「樹」）才可以做家具。',pic:'furniture'},
 // 根
 {id:'R1',u:'root',t:'tf',q:'植物的根可以把植物固定在生長的地方。',a:'O',why:'對！根可以固定植物、抓住土壤。',pic:'roots'},
 {id:'R2',u:'root',t:'mc',q:'根的外觀可以分成哪兩種？',o:['軸根和鬚根','草本和木本','雄蕊和雌蕊','互生和對生'],a:'軸根和鬚根',why:'根在外觀上分成軸根和鬚根。',pic:'roots'},
 {id:'R3',u:'root',t:'tf',q:'龍葵的根是鬚根。',a:'X',why:'龍葵是軸根，不是鬚根。',pic:'roots'},
 {id:'R4',u:'root',t:'tf',q:'蒜的根是鬚根。',a:'O',why:'對！蒜是鬚根，要背起來。',pic:'roots'},
 {id:'R5',u:'root',t:'mc',q:'哪一個部位負責吸收土裡的水分和養分？',o:['根','莖','葉','花'],a:'根',why:'根吸收土裡的養分，再由莖運送。',pic:'transport'},
 {id:'R6',u:'root',t:'mc',q:'下面哪一種食物是吃植物的根？',o:['番薯','紅豆','蔥','米飯'],a:'番薯',why:'番薯就是地瓜，吃它的根。紅豆吃種子，蔥吃莖，米是果實。',pic:'food:根'},
 {id:'R7',u:'root',t:'mc',q:'蘿蔔是吃它的哪一個部位？',o:['根','莖','葉','種子'],a:'根',why:'蘿蔔和地瓜都是吃根。',pic:'food:根'},
 // 花、果實、種子
 {id:'F1',u:'flower',t:'tf',q:'植物的花都有花萼、花瓣、雄蕊、雌蕊四個部分。',a:'X',why:'絲瓜是例外！絲瓜的雄花只有花萼、花瓣、雄蕊；雌花只有花萼、花瓣、雌蕊。',pic:'loofah'},
 {id:'F2',u:'flower',t:'mc',q:'絲瓜的花少了雄蕊，只有花萼、花瓣和雌蕊，叫做什麼花？',o:['雌花','雄花'],a:'雌花',why:'有雌蕊的是雌花；有雄蕊的是雄花。',pic:'loofah'},
 {id:'F3',u:'flower',t:'mc',q:'關於絲瓜的花，哪一個是「錯」的？',o:['一朵花同時有雄蕊和雌蕊','有雄花','有雌花','都有花萼和花瓣'],a:'一朵花同時有雄蕊和雌蕊',why:'絲瓜的一朵花不會同時有雄蕊和雌蕊，只會有其中一個，但一定都有花萼和花瓣。',pic:'loofah'},
 {id:'F4',u:'flower',t:'tf',q:'雌蕊上有細細的花粉。',a:'X',why:'花粉在雄蕊上，不是雌蕊。',pic:'flower'},
 {id:'F5',u:'flower',t:'mc',q:'哪一種花的花瓣超過五片，一層一層很多片？',o:['玫瑰花','牽牛花','絲瓜花'],a:'玫瑰花',why:'玫瑰花的花瓣一層一層，有很多片。',pic:'rose'},
 {id:'F6',u:'flower',t:'tf',q:'蘋果、桃子、李子都只有一粒種子。',a:'X',why:'蘋果裡面有很多個種子。',pic:'apple'},
 {id:'F7',u:'flower',t:'tf',q:'植物的種子沒有什麼用處。',a:'X',why:'種子種到土裡，可以繁殖下一代。',pic:'seed'},
 {id:'F8',u:'flower',t:'mc',q:'水蜜桃香甜多汁的部分，是植物的什麼？',o:['果實','種子','莖','根'],a:'果實',why:'我們吃水蜜桃是吃果肉，是果實。水果通常都是吃果實。',pic:'food:果實'},

const C={leaf:'#3D8B4F',leaf2:'#6DB36F',dark:'#1E3A2B',soil:'#8B5E3C',sun:'#F2B23A',red:'#D7322B',pink:'#F28DB2',hl:'#FFF1CC'};
const svg=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="Huninn,PingFang TC,Noto Sans TC,sans-serif">${inner}</svg>`;
const T=(x,y,t,s=16,c=C.dark,a='middle')=>`<text x="${x}" y="${y}" font-size="${s}" fill="${c}" text-anchor="${a}">${t}</text>`;
const leafAt=(x,y,len,wid,ang,fill=C.leaf)=>`<g transform="translate(${x},${y}) rotate(${ang})"><path d="M0,0 C${wid},${-len*.3} ${wid*.6},${-len*.9} 0,${-len} C${-wid*.6},${-len*.9} ${-wid},${-len*.3} 0,0Z" fill="${fill}" stroke="${C.dark}" stroke-width="1.2"/><line x1="0" y1="0" x2="0" y2="${-len*.9}" stroke="#ffffff" stroke-opacity=".5"/></g>`;

function leafPath(w,h,kind){
  const N=kind==='saw'?160:80, pts=[];
  for(let i=0;i<=N;i++){
    const s=i/N, y=-h+2*h*s, base=w*Math.pow(Math.sin(Math.PI*s),.8);
    let d=0;
    if(kind==='wave') d=5*Math.sin(s*Math.PI*10)*Math.sin(Math.PI*s);
    if(kind==='saw'){const k=(s*14)%1; d=7*(1-k)*Math.sin(Math.PI*s);}
    pts.push([base+d,y]);
  }
  const left=pts.slice().reverse().map(([x,y])=>[-x,y]);
  return 'M'+pts.concat(left).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')+'Z';
}

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},

};

function bump(id,correct){const r=rec[id]||{seen:0,wrong:0};r.seen++;if(!correct)r.wrong++;rec[id]=r;store.set('g3plants-rec',rec)}

/* ===== 聲音 ===== */
let ac=null;
function tone(seq){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    let t=ac.currentTime;
    seq.forEach(([f,d,type])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);t+=d*.85;});
  }catch(e){}
}
const sndOK=()=>tone([[660,.14],[880,.14],[1175,.22]]);
const sndNO=()=>tone([[300,.18,'triangle'],[220,.3,'triangle']]);
const sndBloom=()=>tone([[523,.15],[659,.15],[784,.15],[1047,.35]]);
let zhVoice=null;
function pickVoice(){ if(!('speechSynthesis' in window))return; const v=speechSynthesis.getVoices(); zhVoice=v.find(x=>/zh[-_]TW/i.test(x.lang))||v.find(x=>/zh/i.test(x.lang))||null; }
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/[⭕❌❤️✅✖➜🪑]/g,''));
  u.lang='zh-TW'; if(zhVoice)u.voice=zhVoice; u.rate=.9;
  speechSynthesis.speak(u);
}
const NUMS=['一','二','三','四'];
function readQuestion(q,opts){
  if(q.t==='tf') speak(q.q+'。對，還是錯？');
  else speak(q.q+'。'+opts.map((o,i)=>NUMS[i]+'，'+o).join('。'));
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function start(qs){
  if(!qs||!qs.length)return;
  S={queue:qs.map(q=>({q,kind:'main'})),total:qs.length,pos:0,leaves:[],
     used:new Set(qs.map(q=>q.id)),cs:{},missed:[]};
  ask();
}

// 選同觀念、這一輪還沒出現過的問法
function pickVariant(c,prevId){
  const fam=CTX.all().filter(q=>q.c===c);
  let cand=fam.filter(q=>!S.used.has(q.id));
  if(!cand.length)cand=fam.filter(q=>q.id!==prevId);
  if(!cand.length)cand=fam;
  cand=shuffle(cand).sort((a,b)=>(b.review?1:0)-(a.review?1:0));
  return cand[0];
}
function schedule(c,stage,gap,prevId){
  const st=S.cs[c]||(S.cs[c]={reviews:0,mastered:false});
  if(st.reviews>=MAX_REVIEW)return false;
  const q=pickVariant(c,prevId);
  st.reviews++; S.used.add(q.id);
  const at=Math.min(S.pos+1+gap,S.queue.length);
  S.queue.splice(at,0,{q,kind:'review',stage});
  return true;
}

function vine(){
  const n=S.total,W=600,H=70,step=(W-70)/Math.max(n,1);
  let d='M10,40';for(let x=10;x<=W-40;x+=10)d+=` L${x},${40+Math.sin(x/28)*7}`;
  const leaves=S.leaves.map((ok,i)=>{const x=24+i*step,y=40+Math.sin(x/28)*7,up=i%2===0;
    return `<g class="${i===S.leaves.length-1&&S.justAdded?'leaf-in':''}">${leafAt(x,y,Math.min(22,step*1.6),Math.min(8,step*.6),up?-35:215,ok?C.leaf:C.sun)}</g>`}).join('');
  const done=S.pos>=S.queue.length;
  const fl=done?`<g class="leaf-in">${[0,72,144,216,288].map(a=>`<ellipse cx="${W-25}" cy="28" rx="7" ry="12" fill="${C.pink}" transform="rotate(${a} ${W-25} 40)"/>`).join('')}<circle cx="${W-25}" cy="40" r="6" fill="${C.sun}"/></g>`:`<circle cx="${W-25}" cy="40" r="5" fill="#B9D7AE"/>`;
  return `<svg class="vine" viewBox="0 0 ${W} ${H}" aria-label="進度：已完成 ${S.leaves.length} / ${n} 題"><path d="${d}" stroke="${C.leaf}" stroke-width="3" fill="none"/>${leaves}${fl}</svg>`;
}

function ask(){
  if(S.pos>=S.queue.length)return finish();
  const item=S.queue[S.pos], q=item.q, rv=item.kind==='review';
  const opts=q.t==='mc'?(q.o.includes('以上皆是')?shuffle(q.o.filter(x=>x!=='以上皆是')).concat('以上皆是'):shuffle(q.o)):null;

  app.innerHTML=`
   <div class="toprow"><button class="iconbtn" id="hm">🏠 回首頁</button><span class="counter">${rv?'🔁 複習剛剛錯的觀念':`第 ${Math.min(mainDone+1,S.total)} / ${S.total} 題`}</span></div>
   ${vine()}
   <section class="card pop">
     <span class="tag">${esc(CTX.label(q))}</span> <span class="tag">${q.t==='tf'?'是非題':'選擇題'}</span>${q.ai?' <span class="tag">🤖 AI 新題</span>':''}${rv?` <span class="tag retry-tag">複習${item.stage===2?'第二次':''}</span>`:''}
     <div class="qrow"><p class="qtext">${esc(q.q)}</p><button class="speak" id="sp" aria-label="念題目">🔊</button></div>

      ${q.t==='tf'?`<button class="opt" data-v="O"><span class="sym">⭕</span>對</button><button class="opt" data-v="X"><span class="sym">❌</span>錯</button>`
        :opts.map((o,i)=>`<button class="opt" data-v="${esc(o)}"><span class="n">${i+1}</span>${esc(o)}</button>`).join('')}

   </section>`;
  S.justAdded=false;
  document.getElementById('hm').onclick=()=>CTX.home();
  document.getElementById('sp').onclick=()=>readQuestion(q,opts||[]);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));

  window.scrollTo(0,0);
}

function answer(btn){
  const {q,kind,stage}=S.cur, v=btn.dataset.v, ok=v===q.a, c=q.c;
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===q.a)b.classList.add('correct')});
  if(!ok)btn.classList.add('wrong','shake'); else btn.classList.add('pop');
  CTX.bump(q.id,ok);
  let note='';
  if(kind==='main'){
    S.leaves.push(ok);S.justAdded=true;
    if(!ok){ if(!S.missed.includes(c))S.missed.push(c); schedule(c,1,GAP_FIRST,q.id); note='過幾題會換個問法再考你一次喔！'; }
  }else{
    const st=S.cs[c];
    if(ok&&stage===1){ if(schedule(c,2,GAP_SECOND,q.id))note='記得越來越清楚了，等一下還會再考一次！'; else st.mastered=true; }
    else if(ok){ st.mastered=true; note='🌟 這個觀念記住了！'; }
    else { if(schedule(c,stage,GAP_AGAIN,q.id))note='沒關係，等一下再試一次。'; }
  }
  ok?sndOK():sndNO();
  const ansText=q.t==='tf'?(q.a==='O'?'⭕ 對':'❌ 錯'):q.a;
  const last=S.pos+1>=S.queue.length;
  const fb=document.getElementById('fb');
  fb.innerHTML=`<div class="feedback ${ok?'':'bad'} pop">
     <p class="fb-head">${ok?'🎉 答對了！':'🤔 再想想！正確答案是：'+esc(ansText)}</p>
     <p class="fb-why">${esc(q.why)}</p>
     ${note?`<p class="fb-why" style="margin-top:8px;color:var(--muted)">${note}</p>`:''}
     ${(()=>{const ph=CTX.pic(q);return ph?`<div class="pic">${ph}</div>`:''})()}
     <div class="footer"><button class="iconbtn" id="rw">🔊 再聽一次</button></div>
     <button class="big" id="nx">${last?'看結果':'下一題'}</button>
   </div>`;
  const vineEl=app.querySelector('.vine'); if(vineEl&&S.justAdded)vineEl.outerHTML=vine();
  const say=()=>speak((ok?'答對了！':'正確答案是'+ansText.replace(/[⭕❌]/g,'')+'。')+q.why+(note?note.replace('🌟',''):''));
  document.getElementById('rw').onclick=say;
  if(prefs.autoRead)setTimeout(say,ok?450:600);
  document.getElementById('nx').onclick=()=>{S.pos++;ask()};
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function finish(){

let AIQ=[];
const AI_KEY='g3plants-ai', PENDING_KEY='g3plants-ai-pending';
function normAI(r,seen){
  if(!r||typeof r!=='object')return null;
  const origin=ORIGIN[r.c]; if(!origin)return null;
  const q=String(r.q||'').trim(), why=String(r.why||'').trim();
  if(!q||q.length>80||!why||why.length>120)return null;
  if(seen&&seen.has(q))return null;
  const base={u:origin.u,c:r.c,q,why,pic:origin.pic,ai:true};
  if(r.t==='tf'){ if(r.a!=='O'&&r.a!=='X')return null; return {...base,t:'tf',a:r.a}; }
  if(r.t==='mc'){
    if(!Array.isArray(r.o))return null;
    const o=[...new Set(r.o.map(x=>String(x).trim()).filter(Boolean))];
    if(o.length<2||o.length>4||o.length!==r.o.length)return null;
    if(o.some(x=>x.length>24||/以上皆/.test(x)))return null;
    const a=String(r.a||'').trim(); if(!o.includes(a))return null;
    return {...base,t:'mc',o,a};
  }
  return null;
}
function loadAI(){
  AIQ=store.get(AI_KEY,[]).map(r=>{const n=normAI(r);return n&&r.id?{...n,id:r.id}:null}).filter(Boolean);
  AIQ.forEach(q=>{ALL.push(q);BYID[q.id]=q});
}
function saveAI(){store.set(AI_KEY,AIQ.map(({id,c,t,q,o,a,why})=>({id,c,t,q,o,a,why})))}
function addAI(n){const q={...n,id:'A'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};AIQ.push(q);ALL.push(q);BYID[q.id]=q;saveAI();}
function removeAI(id){AIQ=AIQ.filter(q=>q.id!==id);const i=ALL.findIndex(q=>q.id===id);if(i>=0)ALL.splice(i,1);delete BYID[id];saveAI();}

async function api(action,data,signal){
  if(!CONFIG.API_URL)throw {code:'not_configured',message:'網站尚未設定後端網址'};
  let res;
  try{
    res=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,code:FAMILY.code,...(data||{})}),signal,redirect:'follow'});
  }catch(e){
    if(e&&e.name==='AbortError')throw {code:'cancelled'};
    throw {code:'network',message:'連不上後端'};
  }
  let j; try{j=await res.json()}catch(e){throw {code:'server_error',message:'後端回應格式錯誤'}}
  if(!j.ok)throw {code:j.code||'server_error',message:j.message||''};
  return j;
}
function parseJSONLoose(t){
  t=String(t||'').replace(/```json|```/g,'').trim();
  try{return JSON.parse(t)}catch(e){}
  const i=Math.min(...['{','['].map(c=>{const k=t.indexOf(c);return k<0?Infinity:k}));
  if(i===Infinity)return undefined;
  const body=t.slice(i);
  const j=Math.max(body.lastIndexOf('}'),body.lastIndexOf(']'));
  if(j>0){try{return JSON.parse(body.slice(0,j+1))}catch(e){}}
  return repairJSON(body);
}
// 回應太長被截斷時：退回到最後一個完整的物件，補上缺少的括號
function repairJSON(t){
  const stack=[];let inStr=false,esc=false,lastGood=-1,lastStack=null;
  for(let k=0;k<t.length;k++){
    const ch=t[k];
    if(inStr){if(esc)esc=false;else if(ch==='\\')esc=true;else if(ch==='"')inStr=false;continue}
    if(ch==='"'){inStr=true;continue}
    if(ch==='{'||ch==='[')stack.push(ch);
    else if(ch==='}'||ch===']'){stack.pop();if(ch==='}'&&stack.length){lastGood=k;lastStack=stack.slice()}}
  }
  if(lastGood<0)return undefined;
  const close=lastStack.slice().reverse().map(c=>c==='{'?'}':']').join('');
  try{const v=JSON.parse(t.slice(0,lastGood+1)+close);if(v&&typeof v==='object'){v.__repaired=true;return v}}catch(e){}
  return undefined;
}
// 介面和原本 Claude 網站版的 sample 相同，其他程式不用改
function makeSample(){
  const call=async(prompt,opts={})=>{
    const images=[];
    for(const b of [].concat(opts.images||[]))images.push((await readDataURL(b)).split(',')[1]);
    const j=await api('ai',{prompt,images,tier:opts.modelTier==='quick'?'quick':'default'},opts.signal);
    if(opts.onText)opts.onText({text:j.text,delta:j.text});
    if(j.remaining!=null)FAMILY.remaining=j.remaining;
    return {text:j.text,truncated:!!j.truncated};
  };
  call.json=async(p,o)=>{const {text,truncated}=await call(p,o);const v=parseJSONLoose(text);if(v===undefined)throw {code:'invalid_json',message:truncated?'回應太長被截斷':''};return v};
  call.limits=async()=>({maxPromptBytes:200000,images:{maxCount:5,maxInputBytes:20e6,mediaTypes:['image/jpeg','image/png','image/webp']}});
  return call;
}

function buildPrompt(unit,count){
  const concepts=Object.values(ORIGIN).filter(q=>unit==='all'||q.u===unit);
  const facts=concepts.map(q=>`【${q.c}】${UNITS[q.u]}｜原題：${q.q}｜答案：${q.t==='tf'?(q.a==='O'?'對':'錯'):q.a}｜老師說：${q.why}`).join('\n');
  const cset=new Set(concepts.map(q=>q.c));
  const existing=ALL.filter(q=>cset.has(q.c)).map(q=>'- '+q.q).join('\n');
  return `你是台灣國小三年級自然科的出題老師。請「只根據」下面觀念清單裡的事實出新題目，不可以加入清單以外的植物、名詞、顏色或知識。

規則：
1. 出 ${count} 題，使用繁體中文（台灣用語），句子簡短，三年級小朋友看得懂。
2. 每題用 c 標出對應的觀念代號，必須是清單裡的代號；盡量分散在不同觀念。
3. t 是題型："tf"（是非題）或 "mc"（選擇題），兩種都要有。
4. 是非題的 a 是 "O"（對）或 "X"（錯）。錯的敘述要根據清單明確是錯的。
5. 選擇題的 o 是 3 到 4 個選項，只能有一個正確；a 必須和 o 裡的某個選項一字不差。錯誤選項必須根據清單明確是錯的，不能有兩個都說得通的選項。不要使用「以上皆是」「以上皆非」。
6. why 是一兩句解說，口氣像老師，不超過 50 字。
7. 不要和「已經有的題目」重複，要換問法、換角度，或把兩個相近觀念做比較。

只回傳 JSON 陣列，不要任何其他文字。格式範例：
[{"c":"L7","t":"mc","q":"一個節長三片葉子的是哪一種？","o":["輪生","對生","互生"],"a":"輪生","why":"輪生是一個節長三片葉子。"},{"c":"L1","t":"tf","q":"所有葉子都是綠色的。","a":"X","why":"有些葉子是紅色，例如聖誕紅。"}]

觀念清單：
${facts}

已經有的題目：
${existing}`;
}

async function runAI(){
  aiState.phase='working';aiState.msg='';aiPage();
  const ctl=new AbortController(); aiState.ctl=ctl;
  try{
    const data=await SAMPLE.json(buildPrompt(aiState.unit,aiState.count),{signal:ctl.signal,cache:false,modelTier:'quick',
      onText:()=>{const s=document.getElementById('ai-prog'); if(s)s.textContent='Claude 正在寫題目……';}});
    const seen=new Set(ALL.map(q=>q.q));
    const pending=store.get(PENDING_KEY,[]); pending.forEach(p=>seen.add(p.q));
    const ok=[]; (Array.isArray(data)?data:[]).forEach(r=>{const n=normAI(r,seen); if(n){seen.add(n.q);ok.push(n)}});
    const dropped=(Array.isArray(data)?data.length:0)-ok.length;
    store.set(PENDING_KEY,pending.concat(ok.map(({c,t,q,o,a,why})=>({c,t,q,o,a,why}))));
    aiState.phase='idle';
    aiState.msg=ok.length?`產生了 ${ok.length} 題，請一題一題確認。`+(dropped>0?`（有 ${dropped} 題格式不合格，已自動略過）`:''):'這次產生的題目都不合格，請再試一次。';
  }catch(e){
    aiState.phase='idle';
    if(e&&e.code==='cancelled')aiState.msg='已停止。';
    else if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)){aiState.msg=AI_ERR[e.code]||'這個畫面無法使用 AI 出題。';aiState.blocked=true;aiState.code=e.code;}
    else aiState.msg=AI_ERR[e&&e.code]||'發生問題，這次沒有完成，請再試一次。';
  }
  aiPage();
}

function normQ(r,conceptIds){
  if(!r||typeof r!=='object')return null;
  const c=String(r.c||''); if(conceptIds&&!conceptIds.has(c))return null;
  const q=String(r.q||'').trim(), why=String(r.why||'').trim();
  if(!q||q.length>160||why.length>200)return null;
  const lv=[1,2,3].includes(+r.lv)?+r.lv:1;
  const src=['原題','改寫','AI'].includes(r.src)?r.src:'AI';
  const icon=typeof r.icon==='string'?[...r.icon.trim()].slice(0,4).join(''):'';
  const base={c,q,why:why||'',lv,src,ansByAI:!!r.ansByAI,icon};
  if(r.t==='tf'){ if(r.a!=='O'&&r.a!=='X')return null; return {...base,t:'tf',a:r.a}; }
  if(r.t==='mc'){
    if(!Array.isArray(r.o))return null;
    const o=r.o.map(x=>String(x).trim()).filter(Boolean);
    if(o.length<2||o.length>4||new Set(o).size!==o.length||o.some(x=>x.length>40))return null;
    const a=String(r.a||'').trim(); if(!o.includes(a))return null;
    return {...base,t:'mc',o,a};
  }
  return null;
}
const newId=(bank,p)=>p+(++bank.seq).toString(36)+Math.random().toString(36).slice(2,5);

function mergeResult(bank,res,defaultSrc){
  const idMap={};
  (Array.isArray(res&&res.concepts)?res.concepts:[]).forEach(con=>{
    const id=String(con&&con.id||''), text=String(con&&con.text||'').trim().slice(0,120);
    if(!id)return;
    if(bank.concepts.some(x=>x.id===id)){idMap[id]=id;return}
    if(!text)return;
    const nid=newId(bank,'k'); idMap[id]=nid; bank.concepts.push({id:nid,text});
  });
  const ids=new Set(bank.concepts.map(x=>x.id));
  const seen=new Set(bank.questions.concat(bank.pending).map(q=>q.q));
  let added=0,dropped=0;
  const qs=Array.isArray(res)?res:(Array.isArray(res&&res.questions)?res.questions:[]);
  qs.forEach(r=>{
    const rr={...r,c:idMap[r&&r.c]||(r&&r.c),src:(r&&r.src)||defaultSrc};
    const n=normQ(rr,ids);
    if(!n||seen.has(n.q)){dropped++;return}
    seen.add(n.q); bank.pending.push({...n,id:newId(bank,'q')}); added++;
  });
  const sk=Array.isArray(res&&res.skipped)?res.skipped:[];
  sk.forEach(x=>{const q=String(x&&x.q||'').trim().slice(0,160);if(q)bank.skipped.push({q,reason:String(x.reason||'').slice(0,80)})});
  return {added,dropped,skipped:sk.length};
}

function genPrompt(bank,lv,count){
  const cons=bank.concepts.map(x=>{

/* --- 練習：沿用植物小學堂的引擎（間隔複習、朗讀、音效） --- */
function bankCtx(bank){return {
  all:()=>bank.questions,
  origin:c=>bank.questions.find(q=>q.c===c&&q.src==='原題')||bank.questions.find(q=>q.c===c),
  label:q=>LV[q.lv]||'基礎',
  bump:(id,ok)=>{const r=bank.rec[id]||{seen:0,wrong:0};r.seen++;if(!ok)r.wrong++;bank.rec[id]=r;scheduleSave(bank)},
  rec:()=>bank.rec,
  pic:q=>{const con=(bank.concepts.find(x=>x.id===q.c)||{}).text;
    return (q.icon||con)?`<div class="bpic">${q.icon?`<div class="bicon">${esc(q.icon)}</div>`:''}${con?`<p>📌 觀念：${esc(con)}</p>`:''}</div>`:''},
  home:()=>{bsSave(bank);bankHome(bank)},
  restart:()=>startBank(bank),
}}
// 常錯的觀念：該觀念所有題目累計答錯次數，多的排前面
function weakConcepts(bank){
  const w={};bank.questions.forEach(q=>{const r=bank.rec[q.id];if(r&&r.wrong)w[q.c]=(w[q.c]||0)+r.wrong});
  return Object.keys(w).sort((a,b)=>w[b]-w[a]);
}
// 每個常錯觀念出一題，優先用孩子練得最少的問法
function startWeak(bank){
  const qs=weakConcepts(bank).slice(0,10).map(c=>bank.questions.filter(q=>q.c===c).sort((a,b)=>((bank.rec[a.id]||{}).seen||0)-((bank.rec[b.id]||{}).seen||0))[0]).filter(Boolean);
  if(!qs.length)return;
  CTX=bankCtx(bank);start(shuffle(qs));
}
function startBank(bank){
  const pool=bank.questions.filter(q=>!bprefs.lv||q.lv===bprefs.lv);
  if(!pool.length){toast('這個難度還沒有題目');return}
  CTX=bankCtx(bank);
  start(pickRound(pool,bprefs.count,bank.rec));
}

/* --- 照片統一轉成 JPG（含 HEIC），並縮小以節省額度 --- */
function readDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function toJpeg(file){
  try{
    const src=await readDataURL(file);
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=src});
    const max=1600,w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)return null;
    const k=Math.min(1,max/Math.max(w,h));
    const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));if(!blob)return null;
    const t=document.createElement('canvas');const tk=Math.min(1,168/Math.max(w,h));t.width=Math.round(w*tk);t.height=Math.round(h*tk);
    t.getContext('2d').drawImage(img,0,0,t.width,t.height);
    blob.thumb=t.toDataURL('image/jpeg',0.7);
    return blob;
  }catch(e){return null}
}

    act.innerHTML=quotaNote+'<button class="big" id="u-go">我知道了，開始分析</button><button class="ghost" id="u-cancel">取消</button>';
    $('u-go').onclick=()=>{sync();runAnalyze(bank,maxN)}; $('u-cancel').onclick=()=>{sync();upState.phase='idle';uploadPage(bank,true)};
  }else if(busy){
    act.innerHTML=`<div class="feedback"><p class="fb-head" id="u-prog">${esc(upState.msg||'Claude 正在看資料……')}</p><p class="fb-why">大約要等 10～60 秒，請不要關掉畫面。</p><button class="ghost" id="u-stop">停止</button></div>`;
    $('u-stop').onclick=()=>upState.ctl&&upState.ctl.abort();
  }else{
    act.innerHTML=`<button class="big" id="u-start">🤖 開始分析</button>${upState.msg?`<p class="lead" style="margin-top:12px">${esc(upState.msg)}</p>`:''}`;
    $('u-start').onclick=()=>{sync();if(!upState.files.length&&!upState.text.trim()){toast('請先放照片或貼上文字');return}upState.phase='confirm';upState.msg='';uploadPage(bank,true)};
  }
  window.scrollTo(0,0);
}
async function runAnalyze(bank,maxN){
  upState.phase='working';upState.msg='Claude 正在看資料……';uploadPage(bank,true);
  const files=upState.files.slice(), text=upState.text.trim().slice(0,60000), note=upState.note.trim().slice(0,300);
  const per=Math.min(maxN||2,2);
  const batches=[]; if(files.length){for(let i=0;i<files.length;i+=per)batches.push(files.slice(i,i+per))} else batches.push([]);
  let tot={added:0,dropped:0,skipped:0},err=null;
  for(let i=0;i<batches.length;i++){
    const ctl=new AbortController();upState.ctl=ctl;
    const label=batches.length>1?`第 ${i+1} / ${batches.length} 批：`:'';
    const pr=document.getElementById('u-prog'); if(pr)pr.textContent=label+'Claude 正在看資料……';
    try{
      const opts={signal:ctl.signal,cache:false,modelTier:'default',onText:()=>{const p=document.getElementById('u-prog');if(p)p.textContent=label+'Claude 正在整理題目……'}};
      if(batches[i].length)opts.images=batches[i];
      const res=await SAMPLE.json(analyzePrompt(bank,i===0?text:'',note,batches[i].length,upLv),opts);
      if(res&&res.__repaired)tot.cut=(tot.cut||0)+1;
      if(upLv&&res&&Array.isArray(res.questions))res.questions.forEach(q=>{if(q&&q.src==='AI')q.lv=upLv});
      const r=mergeResult(bank,res,'原題'); tot.added+=r.added;tot.dropped+=r.dropped;tot.skipped+=r.skipped;
      await bsSave(bank);
    }catch(e){
      if(e&&e.code==='cancelled'){err=e;break}
      if(e&&['bad_code','daily_limit','no_credit','not_configured'].includes(e.code)){err=e;break}
      err=e;tot.failed=(tot.failed||[]).concat(i+1);
    }
  }
  upState.ctl=null;upState.phase='idle';
  if(tot.added||tot.skipped){
    upState.files=[];upState.text='';upState.note='';
    toast(`整理出 ${tot.added} 題，請到「待確認」檢查`);
    reviewPage(bank,`整理出 ${tot.added} 題${tot.skipped?`，另有 ${tot.skipped} 題不適合點選作答`:''}${tot.dropped?`（${tot.dropped} 題格式不合格或重複，已略過）`:''}${tot.cut?`。有 ${tot.cut} 批內容太多，後段題目可能沒整理到，可以把那幾張照片再分析一次`:''}${tot.failed?`。第 ${tot.failed.join('、')} 批沒有成功（${aiErrMsg(err)}），可以把那幾張照片再上傳一次`:''}`);
    return;
  }
  upState.msg=err?aiErrMsg(err):'這次沒有整理出可以用的題目，請換清楚一點的照片，或補充說明再試一次。';
  uploadPage(bank,true);
}

  app.querySelectorAll('[data-glv]').forEach(b=>b.onclick=()=>{if(genState.phase==='working')return;genState.lv=+b.dataset.glv;genPage(bank)});
  app.querySelectorAll('[data-gc]').forEach(b=>b.onclick=()=>{if(genState.phase==='working')return;genState.count=+b.dataset.gc;genPage(bank)});

  }else if(genState.phase==='working'){
    act.innerHTML=`<div class="feedback"><p class="fb-head" id="g-prog">Claude 正在思考題目……</p><p class="fb-why">大約要等 10～60 秒，請不要關掉畫面。</p><button class="ghost" id="g-stop">停止</button></div>`;

    $('g-start').onclick=()=>{genState.phase='confirm';genState.msg='';genPage(bank)};

async function runGen(bank){
  genState.phase='working';genPage(bank);
  const ctl=new AbortController();genState.ctl=ctl;
  try{
    const res=await SAMPLE.json(genPrompt(bank,genState.lv,genState.count),{signal:ctl.signal,cache:false,modelTier:'quick',
      onText:()=>{const p=document.getElementById('g-prog');if(p)p.textContent='Claude 正在寫題目……'}});
    const arr=(Array.isArray(res)?res:[]).map(r=>({...r,src:'AI',ansByAI:false,lv:genState.lv||r.lv}));
    const r=mergeResult(bank,{questions:arr},'AI');
    await bsSave(bank);
    genState.phase='idle';genState.ctl=null;
    if(r.added){genState.msg='';reviewPage(bank,`產生了 ${r.added} 題${r.dropped?`（${r.dropped} 題格式不合格或重複，已略過）`:''}`);return}
    genState.msg='這次產生的題目都不合格，請再試一次。';
  }catch(e){genState.phase='idle';genState.ctl=null;genState.msg=aiErrMsg(e);}
  genPage(bank);
}

/* --- 頁面：待確認（可修改） --- */
let editIdx=-1;
function qView(q){
  const tags=`<span class="tag">${LV[q.lv]}</span> <span class="tag">${q.t==='tf'?'是非題':'選擇題'}</span> <span class="tag">${q.src==='原題'?'原題':q.src==='改寫'?'由填空等改寫':'AI 新題'}</span>${q.ansByAI?' <span class="tag warn">⚠️ 答案由 AI 判斷，請確認</span>':''}`;
  const ans=q.t==='tf'?`答案：${q.a==='O'?'⭕ 對':'❌ 錯'}`:q.o.map(o=>o===q.a?`<b style="color:var(--leaf)">✔ ${esc(o)}</b>`:esc(o)).join('　');
  return `${tags}<br><span style="font-size:1.15rem">${q.icon?esc(q.icon)+' ':''}${esc(q.q)}</span><br><small>${ans}</small><br><small style="color:var(--muted)">解說：${esc(q.why)}</small>`;
}
function qEditor(q){
  return `<div class="form">
    <label>題目<textarea id="e-q" rows="2">${esc(q.q)}</textarea></label>
    ${q.t==='tf'?`<label>答案 <select id="e-a"><option value="O"${q.a==='O'?' selected':''}>⭕ 對</option><option value="X"${q.a==='X'?' selected':''}>❌ 錯</option></select></label>`
      :`<p style="margin:6px 0">選項（點選正確答案；空白的選項會刪掉）</p>${[0,1,2,3].map(i=>`<label class="optrow"><input type="radio" name="e-ok" value="${i}" ${q.o[i]===q.a?'checked':''}><input id="e-o${i}" value="${esc(q.o[i]||'')}"></label>`).join('')}`}
    <label>解說<textarea id="e-why" rows="2">${esc(q.why)}</textarea></label>
    <label>難度 <select id="e-lv">${[1,2,3].map(l=>`<option value="${l}"${q.lv===l?' selected':''}>${LV[l]}</option>`).join('')}</select></label>
    <div class="footer"><button class="iconbtn" id="e-save">💾 儲存修改</button><button class="iconbtn" id="e-cancel">取消</button></div></div>`;
}
function readEditor(q){
  const v=id=>document.getElementById(id).value.trim();
  const out={...q,q:v('e-q'),why:v('e-why'),lv:+v('e-lv'),ansByAI:false};
  if(q.t==='tf')out.a=v('e-a');
  else{
    const raw=[0,1,2,3].map(i=>v('e-o'+i));
    const ck=document.querySelector('input[name="e-ok"]:checked');
    const a=ck?raw[+ck.value]:'';
    out.o=raw.filter(Boolean); out.a=a;
  }
  return normQ(out)?{...out,...normQ(out),id:q.id,c:q.c}:null;
}
function reviewPage(bank,msg){
  const P=bank.pending;
  app.innerHTML=`
   <div class="toprow"><button class="iconbtn" id="bk">← ${esc(bank.title||bankInfo(bank))}</button></div>
   <h1 style="font-size:1.8rem">待確認的題目（${P.length}）</h1>
   ${msg?`<p class="lead">${esc(msg)}</p>`:''}
   <p class="lead" style="font-size:1rem">請確認題目和答案正確，按「收進題庫」才會給孩子練習。有 ⚠️ 的題目特別要檢查。</p>
   ${P.length?`<button class="big" id="all" style="margin-top:0">全部收進題庫</button>`:''}
   <ul class="list">${P.map((q,i)=>`<li style="flex-direction:column;align-items:stretch">
     ${editIdx===i?qEditor(q):`<span>${qView(q)}</span>
     <span class="footer" style="margin-top:8px"><button class="iconbtn" data-acc="${i}">✅ 收進題庫</button><button class="iconbtn" data-edit="${i}">✏️ 修改</button><button class="iconbtn" data-rej="${i}">🗑 刪掉</button></span>`}</li>`).join('')}</ul>
   ${bank.skipped.length?`<section class="card"><p style="margin:0;font-size:1.15rem">不適合點選作答的題目（${bank.skipped.length}）</p>
     <ul class="list">${bank.skipped.map(s=>`<li><span>${esc(s.q)}<br><small style="color:var(--muted)">${esc(s.reason)}</small></span></li>`).join('')}</ul>
     <button class="ghost" id="clrsk">清除這份清單</button></section>`:''}`;
  const $=id=>document.getElementById(id);
  $('bk').onclick=()=>{editIdx=-1;bankHome(bank)};
  const accept=i=>{const q=P.splice(i,1)[0];bank.questions.push(q)};
  if($('all'))$('all').onclick=async()=>{
    const warn=P.filter(q=>q.ansByAI).length;
    if(warn&&!await confirmBox(`有 ${warn} 題的答案是 AI 判斷的，確定都檢查過了嗎？`))return;
    bank.questions.push(...P.splice(0));editIdx=-1;await bsSave(bank);toast('已全部收進題庫');reviewPage(bank)};
  app.querySelectorAll('[data-acc]').forEach(b=>b.onclick=async()=>{accept(+b.dataset.acc);editIdx=-1;await bsSave(bank);reviewPage(bank)});
  app.querySelectorAll('[data-rej]').forEach(b=>b.onclick=async()=>{P.splice(+b.dataset.rej,1);editIdx=-1;await bsSave(bank);reviewPage(bank)});
  app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editIdx=+b.dataset.edit;reviewPage(bank)});
  if($('e-save'))$('e-save').onclick=async()=>{const nq=readEditor(P[editIdx]);if(!nq){toast('有欄位不完整：題目、答案都要有，選擇題至少兩個選項');return}P[editIdx]=nq;editIdx=-1;await bsSave(bank);reviewPage(bank)};
  if($('e-cancel'))$('e-cancel').onclick=()=>{editIdx=-1;reviewPage(bank)};
  if($('clrsk'))$('clrsk').onclick=async()=>{bank.skipped=[];await bsSave(bank);reviewPage(bank)};
}

/* --- 匯出／匯入 --- */
const DL={save:async({filename,data})=>{
  const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith('.csv')?'text/csv;charset=utf-8':'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return {}}};
const safeName=s=>String(s).replace(/[\\/:*?"<>|]/g,'').slice(0,60)||'題庫';
function exportPage(bank){
  app.innerHTML=`
   <div class="toprow"><button class="iconbtn" id="bk">← ${esc(bank.title||bankInfo(bank))}</button></div>
   <h1 style="font-size:1.8rem">匯出題庫</h1>
   <section class="card">
     <p style="margin:0;font-size:1.15rem">📦 題庫檔（.json）</p>
     <p class="lead" style="font-size:1rem">傳給用同一個版本的親友，他們在「自訂題庫 → 匯入題庫檔」就能直接使用，不用再花額度產生。只包含已確認的題目，不含作答紀錄。</p>
     <button class="big" id="xj" style="margin-top:8px">下載題庫檔</button>
   </section>
   <section class="card">
     <p style="margin:0;font-size:1.15rem">📊 表格（.csv）</p>
     <p class="lead" style="font-size:1rem">可以用 Excel 或 Google 試算表打開，方便查看、列印或備份。</p>
     <button class="ghost" id="xc">下載表格</button>
   </section>
   <p class="lead" id="xmsg"></p>`;
  document.getElementById('bk').onclick=()=>bankHome(bank);
  const msg=t=>{document.getElementById('xmsg').textContent=t};
  const save=async(filename,data)=>{
    if(DL===undefined){msg('正在準備下載功能，請再按一次。');return}
    if(!DL){msg('這個畫面不能下載檔案，請改用 Claude app 或電腦開啟。');return}
    try{await DL.save({filename,data});msg('已下載。')}
    catch(e){msg(e&&e.code==='declined'?'已取消下載。':e&&e.code==='rate_limited'?'請稍等一下再按。':'這個畫面不能下載檔案，請改用 Claude app 或電腦開啟。')}
  };
  const name=safeName(bank.title||bankInfo(bank));
  document.getElementById('xj').onclick=()=>{
    const {id,rec,pending,skipped,...meta}=bank;
    save(name+'.json',JSON.stringify({format:'family-quiz-bank',version:1,exportedAt:new Date().toISOString(),bank:{...meta,questions:bank.questions}},null,1));
  };
  document.getElementById('xc').onclick=()=>{
    const cell=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const conText=c=>(bank.concepts.find(x=>x.id===c)||{}).text||'';
    const rows=[['觀念','題型','難度','題目','選項1','選項2','選項3','選項4','答案','解說','來源','作答次數','答錯次數']]
      .concat(bank.questions.map(q=>{const o=q.o||[];const r=bank.rec[q.id]||{};return [conText(q.c),q.t==='tf'?'是非':'選擇',LV[q.lv],q.q,o[0],o[1],o[2],o[3],ansStr(q),q.why,q.src,r.seen||0,r.wrong||0]}));
    save(name+'.csv','\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n'));
  };
}
function importBank(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const j=JSON.parse(String(r.result));
      if(!j||j.format!=='family-quiz-bank'||!j.bank)throw 0;
      const src=j.bank;
      const nb=fixBank({id:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),createdAt:Date.now(),
        grade:String(src.grade||''),term:String(src.term||''),subject:String(src.subject||''),publisher:String(src.publisher||''),unit:String(src.unit||''),title:String(src.title||'')});
      nb.concepts=(Array.isArray(src.concepts)?src.concepts:[]).map(c=>({id:String(c.id||''),text:String(c.text||'').slice(0,120)})).filter(c=>c.id&&c.text&&/^[\w.~:@+-]+$/.test(c.id));
      const ids=new Set(nb.concepts.map(c=>c.id));
      nb.questions=(Array.isArray(src.questions)?src.questions:[]).map(q=>{const n=normQ(q,ids);return n?{...n,id:newId(nb,'q')}:null}).filter(Boolean);
      if(!nb.questions.length)throw 0;
      BANKS.unshift(nb); await bsSave(nb);
      toast(`已匯入 ${nb.questions.length} 題`); bankHome(nb);
    }catch(e){toast('這個檔案不是可以匯入的題庫檔')}
  };
  r.readAsText(file);
}

      const b=BANKS.find(x=>x.id===r.b);

  }
  home();
})();
