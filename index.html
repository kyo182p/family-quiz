<!DOCTYPE html>
<html lang="zh-Hant-TW" data-style="chalk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家庭題庫練習｜植物小學堂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<script>/* 介面風格：在畫面出現前套用，避免閃一下 */
try{var st=localStorage.getItem('ui-style');if(st)document.documentElement.setAttribute('data-style',st)}catch(e){}</script>
<style>
:root{
  --paper:#F1F7EA; --grid:#DCEBD2; --ink:#1E3A2B; --muted:#506A5A;
  --card:#FFFFFF; --leaf:#3D8B4F; --leaf-soft:#D6EBCF; --sun:#F2B23A; --sun-soft:#FFF1CC;
  --coral:#E25D44; --coral-soft:#FBE0DA; --soil:#8B5E3C; --line:#C9DDBF;
  --leaf-strong:#2E7340; --on-leaf:#fff; --coral-strong:#B83D27; --on-coral:#fff;
  --leaf-ink:#2E7340; --sun-ink:#8A5A00; --coral-ink:#A93522; --press:#1F5530;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#13201A; --grid:#1B2C23; --ink:#E4F0E4; --muted:#9DB8A6;
    --card:#1C2C23; --leaf:#6CC17F; --leaf-soft:#25412E; --sun:#F5BE4E; --sun-soft:#3D3318;
    --coral:#FF7A63; --coral-soft:#4A2620; --soil:#C49470; --line:#2E4637;
    --leaf-strong:#6CC17F; --on-leaf:#0F1F15; --coral-strong:#FF8A75; --on-coral:#2A0E08;
  --leaf-ink:#8FD6A0; --sun-ink:#F5BE4E; --coral-ink:#FF8A75; --press:#3E8A50;
  }
}
:root[data-theme="dark"]{
  --paper:#13201A; --grid:#1B2C23; --ink:#E4F0E4; --muted:#9DB8A6;
  --card:#1C2C23; --leaf:#6CC17F; --leaf-soft:#25412E; --sun:#F5BE4E; --sun-soft:#3D3318;
  --coral:#FF7A63; --coral-soft:#4A2620; --soil:#C49470; --line:#2E4637;
  --leaf-strong:#6CC17F; --on-leaf:#0F1F15; --coral-strong:#FF8A75; --on-coral:#2A0E08;
  --leaf-ink:#8FD6A0; --sun-ink:#F5BE4E; --coral-ink:#FF8A75; --press:#3E8A50;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; color:var(--ink);
  font-family:var(--font,"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-tap-highlight-color:transparent;
}
main{max-width:720px;margin:0 auto;padding:16px 16px 96px}
button{font:inherit;color:inherit;cursor:pointer}
.pic svg{font-family:var(--font-svg,"Huninn","PingFang TC","Noto Sans TC",sans-serif)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
h1{font-size:2.4rem;margin:8px 0 4px;letter-spacing:.04em}
h1.pg{font-size:1.85rem}
h2.ct{margin:0;font-size:1.2rem;font-weight:inherit;line-height:1.5}
.lead{color:var(--muted);font-size:1.1rem;margin:0 0 20px;line-height:1.6}
.hero{display:flex;align-items:center;gap:16px}
.hero svg{flex:0 0 96px;width:96px;height:96px}
.section-title{font-size:1.15rem;margin:22px 0 10px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  border:2px solid var(--line);background:var(--card);border-radius:999px;
  padding:10px 18px;font-size:1.15rem;min-height:48px;
}
.chip[aria-pressed="true"]{background:var(--leaf-strong);border-color:var(--leaf-strong);color:var(--on-leaf)}
.chip small{opacity:.9;margin-left:4px}
.big{
  display:block;width:100%;margin-top:26px;border:none;border-radius:20px;
  background:var(--leaf-strong);color:var(--on-leaf);font-size:1.5rem;padding:18px;min-height:64px;
  box-shadow:0 5px 0 var(--press);
}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--press)}
.ghost{
  display:block;width:100%;margin-top:12px;border:2px dashed var(--line);background:transparent;
  border-radius:16px;padding:14px;font-size:1.15rem;min-height:56px;color:var(--ink)
}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.iconbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px;font-size:1rem;min-height:44px}
.vine{width:100%;height:auto;display:block;margin:6px 0 4px}
.counter{color:var(--muted);font-size:1rem}
.card{
  background:var(--card);border:2px solid var(--line);border-radius:22px;
  padding:20px 18px;margin-top:10px;
}
.tag{display:inline-block;font-size:.95rem;background:var(--leaf-soft);color:var(--ink);border-radius:8px;padding:3px 10px}
.retry-tag{background:var(--sun-soft)}
.qrow{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.qtext{font-size:1.6rem;line-height:1.55;margin:0;flex:1}
.speak{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-size:1.5rem}
.opts{display:grid;gap:12px;margin-top:20px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{
  display:flex;align-items:center;gap:12px;text-align:left;
  border:3px solid var(--line);background:var(--card);border-radius:18px;
  padding:14px 16px;font-size:1.35rem;min-height:66px;line-height:1.4;
}
.opt .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--leaf-soft);display:grid;place-items:center;font-size:1.05rem}
.opts.tf .opt{justify-content:center;flex-direction:column;font-size:1.4rem;min-height:120px}
.opts.tf .sym{font-size:3rem;line-height:1}
.opt.correct{border-color:var(--leaf);background:var(--leaf-soft)}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft)}
.opt:disabled{cursor:default}
.opt:disabled:not(.correct):not(.wrong){opacity:.5}
.feedback{margin-top:18px;border-radius:18px;padding:16px;border:3px solid var(--leaf);background:var(--leaf-soft)}
.feedback.bad{border-color:var(--coral);background:var(--coral-soft)}
.fb-head{font-size:1.5rem;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.fb-why{font-size:1.25rem;line-height:1.7;margin:0}
.pic{margin-top:14px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;color:var(--ink);overflow-x:auto}
.pic.illus{background:#FAFDF7;border-color:transparent;color:#1E3A2B}
.pic svg{display:block;width:100%;height:auto;max-height:280px}
.rows{display:grid;gap:8px}
.r{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;font-size:1.15rem;line-height:1.5}
.r .e{font-size:2rem;flex:0 0 44px;text-align:center}
.r b{flex:0 0 auto;min-width:4.5em}
.r.hl{background:#FFF1CC;outline:2px solid #F2B23A}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.leaf-in{transform-box:fill-box;transform-origin:50% 100%;animation:grow .5s ease-out}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
.score{font-size:3.2rem;margin:6px 0}
.list{margin:10px 0 0;padding:0;list-style:none}
.list li{padding:12px 4px;border-bottom:1px dashed var(--line);font-size:1.1rem;line-height:1.5;display:flex;justify-content:space-between;gap:12px}
.list .cnt{flex:0 0 auto;color:var(--coral-ink);white-space:nowrap}
.toggle{display:flex;align-items:center;gap:10px;font-size:1.1rem;margin-top:18px}
.toggle input{width:24px;height:24px}
.footer{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
.footer button{flex:1}

.beta-btn{display:inline-flex;align-items:center;gap:6px}
.bankcard{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin-top:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px}
.bk-title{font-size:1.3rem}.bk-meta{color:var(--muted);font-size:1rem}
.form label{display:flex;flex-direction:column;gap:6px;font-size:1.05rem;margin-top:12px}
.form input:not([type=radio]):not([type=checkbox]):not([type=file]),.form select,.form textarea{font:inherit;font-size:1.1rem;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
.form input[type=file]{font:inherit;font-size:1rem;max-width:100%}
.optrow{flex-direction:row!important;align-items:center}
.optrow input[type=radio]{width:24px;height:24px;flex:0 0 auto}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumb{position:relative}.thumb img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
.thumb button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:none;background:var(--coral-strong);color:var(--on-coral)}
.tag.warn{background:var(--coral-soft)}
.pickbtn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 16px;font-size:1.1rem;cursor:pointer;min-height:52px}
.pickbtn:focus-within{outline:3px solid var(--sun)}

.detail{margin-top:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.detail summary{cursor:pointer;font-size:1.15rem;min-height:32px}
.detail p{font-size:1.15rem;line-height:1.7;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats b{display:block;font-size:1.8rem}.stats span{color:var(--muted);font-size:.95rem}
.srow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 3.2em;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:1.05rem}
.sval{text-align:right}
.bar{display:block;height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar span{display:block;height:100%;border-radius:6px}
.daychart{display:flex;gap:4px;align-items:flex-end;height:140px;margin-top:12px;overflow-x:auto}
.day{flex:1;min-width:26px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.day .col{width:70%;border-radius:4px 4px 0 0;min-height:2px}
.day small{font-size:.75rem;color:var(--muted);margin-top:4px}

.tour-block{position:fixed;inset:0;z-index:39}
.tour-hole{position:fixed;z-index:40;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);outline:3px solid var(--sun);pointer-events:none;transition:left .2s,top .2s,width .2s,height .2s}
.tour-tip{position:fixed;z-index:41;background:var(--card);color:var(--ink);border:2px solid var(--sun);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tour-step{margin:0;color:var(--muted);font-size:.9rem}
.tour-title{margin:2px 0 6px;font-size:1.25rem}
.tour-text{margin:0;font-size:1.08rem;line-height:1.6}
.tour-chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:1rem;color:var(--muted)}
.tour-chk input{width:20px;height:20px}
.tour-btns{display:flex;gap:8px;margin-top:10px;align-items:center}
.iconbtn.tour-next{background:var(--leaf-strong);border-color:var(--leaf-strong);color:var(--on-leaf)}
.qbtns{display:flex;flex-direction:column;gap:8px}.speak.rp:disabled{opacity:.4}
.tour-help{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;width:44px;height:44px;opacity:.85;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.4rem;box-shadow:0 4px 12px rgba(0,0,0,.15)}
@media (prefers-reduced-motion:reduce){.tour-hole{transition:none}}

.ghost.needfix{border-color:var(--coral);border-style:solid;background:var(--coral-soft);line-height:1.5}
.ghost.needfix b{color:var(--coral-ink);font-size:1rem}
.fixbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--coral-soft);border:2px solid var(--coral);border-radius:14px;padding:10px 14px;margin:8px 0;font-size:1.05rem}
.filters .frow{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.filters .flabel{flex:0 0 3em;color:var(--muted);padding-top:12px;font-size:.95rem}
.filters .chip{font-size:1rem;padding:6px 12px;min-height:44px}
.chip.chip-warn{border-color:var(--coral)}
.chip.chip-warn[aria-pressed="true"]{background:var(--coral-strong);border-color:var(--coral-strong);color:var(--on-coral)}
.list li.qissue{background:var(--coral-soft);border-radius:12px;padding-left:10px;padding-right:10px}
.list li.qreported{background:var(--sun-soft);border-radius:12px;padding-left:10px;padding-right:10px}
.tipbox{margin-top:10px;background:var(--sun-soft);border-radius:14px;padding:12px 14px;font-size:1.05rem;line-height:1.6}.tipbox p{margin:2px 0}
.bpic{text-align:center}.bicon{font-size:4rem;line-height:1.2}.bpic p{font-size:1.15rem;margin:6px 0 0;text-align:left}
.chip:disabled{opacity:.45;cursor:default}
.ghost:disabled{opacity:.5;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px;font-size:1.05rem;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:30;padding:20px}
.modal-card{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;max-width:420px;width:100%;font-size:1.15rem;line-height:1.6}
.iconbtn.danger{background:var(--coral-strong);border-color:var(--coral-strong);color:var(--on-coral)}
@media (max-width:480px){
  h1{font-size:1.9rem}
  h1.pg{font-size:1.7rem}
  .qtext{font-size:1.35rem}
  .opt{font-size:1.2rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
/* --- 風格切換按鈕 --- */
.style-btn{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:15;width:44px;height:44px;opacity:.85;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.3rem;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.style-list{display:grid;gap:10px;margin:10px 0}
.style-list button{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--card);min-height:56px}
.style-list button[aria-pressed="true"]{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun) inset}
.style-list .sw{flex:0 0 auto;width:40px;height:40px;border-radius:10px;border:2px solid rgba(0,0,0,.25)}
.style-list small{display:block;color:var(--muted);font-size:.9rem}

/* ===== 風格：教室黑板（預設） =====
   要新增風格：在 STYLES 加一筆，並寫一段 :root[data-style="名稱"] 的變數與覆寫 */
:root[data-style="chalk"]{
  --paper:#24352D; --grid:#2C4036; --ink:#ECEEE4; --muted:#B9C4B6;
  --card:#2A3D34; --leaf:#9BE3A5; --leaf-soft:#2F4B3B; --sun:#F2D65F; --sun-soft:#45432A;
  --coral:#F3A7B6; --coral-soft:#4A3038; --soil:#7A5434; --line:#6F8277;
  --leaf-strong:#F2D65F; --on-leaf:#1E2B24; --coral-strong:#F3A7B6; --on-coral:#1E2B24;
  --leaf-ink:#A8E6B1; --sun-ink:#F2D65F; --coral-ink:#F7B9C5; --press:#A8902F;
  --chalk-r:255px 15px 225px 15px/15px 225px 15px 255px;
  --chalk-r2:15px 225px 15px 255px/255px 15px 225px 15px;
  --font:"LXGW WenKai TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --font-svg:"LXGW WenKai TC","PingFang TC","Noto Sans TC",sans-serif;
  color-scheme:dark;
  background:var(--soil);
}
[data-style="chalk"] body{
  min-height:100vh;
  background-color:var(--paper);
  background-image:radial-gradient(ellipse at 18% 22%,rgba(255,255,255,.07),transparent 55%),radial-gradient(ellipse at 82% 70%,rgba(255,255,255,.05),transparent 50%),radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.04),transparent 40%);
  background-size:auto;
  background-attachment:fixed;
}
[data-style="chalk"] body::after{content:"";position:fixed;inset:0;border:8px solid var(--soil);box-shadow:inset 0 0 0 2px #5E402A;pointer-events:none;z-index:60}
[data-style="chalk"] .tour-help,[data-style="chalk"] .style-btn{right:calc(16px + env(safe-area-inset-right,0px))}
[data-style="chalk"] .tour-help{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
[data-style="chalk"] .style-btn{bottom:calc(68px + env(safe-area-inset-bottom,0px))}
[data-style="chalk"] .r.hl{background:var(--sun-soft);outline:2px solid var(--sun)}
[data-style="chalk"] :is(.chip,.iconbtn,.ghost,.pickbtn){border-radius:var(--chalk-r)}
[data-style="chalk"] :is(.card,.bankcard,.detail,.feedback){border-radius:var(--chalk-r2)}
[data-style="chalk"] .opt{border-radius:var(--chalk-r)}
[data-style="chalk"] .opt:nth-child(even){border-radius:var(--chalk-r2)}
[data-style="chalk"] .big{border-radius:var(--chalk-r2);font-weight:700}
[data-style="chalk"] :is(h1,.score){text-shadow:0 0 1px rgba(255,255,255,.5);letter-spacing:.06em}
[data-style="chalk"] .opt.correct{color:var(--ink)}
[data-style="chalk"] .toast{background:var(--ink);color:var(--paper)}
[data-style="chalk"] .pic.illus{border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
[data-style="chalk"] .pic.illus .r.hl{background:#FFF1CC;outline:2px solid #F2B23A}
/* --- 觀念複選 --- */
.cp-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 6px}
.cp-n{color:var(--muted);font-size:1rem}
.cpick{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;margin:8px 0;border:2px solid var(--line);border-radius:14px;background:var(--card);min-height:48px;font-size:1.1rem;line-height:1.5;cursor:pointer}
.cpick input{width:22px;height:22px;margin-top:2px;flex:0 0 auto;accent-color:var(--leaf-strong)}
.cpick small{display:block;color:var(--coral-ink);font-size:.95rem}
.cpick:has(input:checked){border-color:var(--sun)}
[data-style="chalk"] .cpick{border-radius:var(--chalk-r)}
/* ===== 重點講義（白紙版面，不跟著介面風格變色；列印成 A4） ===== */
.ho-pill{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:16;max-width:calc(100vw - 90px);
  padding:10px 16px;min-height:44px;border-radius:22px;border:2px solid var(--sun);background:var(--card);color:var(--ink);font-size:1rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ho-pill.done{background:var(--sun);color:var(--on-leaf);border-color:var(--sun)}
[data-style="chalk"] .ho-pill{left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.ho-status{margin:8px 0 14px;padding:12px 14px;border-radius:14px;border:2px solid var(--leaf);background:var(--leaf-soft);font-size:1.05rem;line-height:1.6}
.ho-status.pending{border-color:var(--sun);background:var(--sun-soft)}
.ho{background:#fff;color:#2b2b2b;border-radius:6px;padding:22px 20px;box-shadow:0 2px 0 rgba(0,0,0,.25);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:1.02rem;line-height:1.75;overflow-wrap:anywhere}
.ho h1{color:#1a4d8f;font-size:1.6rem;border-bottom:3px solid #1a4d8f;padding-bottom:6px;margin:0 0 2px;text-shadow:none;letter-spacing:normal}
.ho .sub{color:#666;font-size:.9rem;margin-bottom:14px}
.ho h2{color:#fff;background:#1a4d8f;font-size:1.15rem;padding:5px 12px;border-radius:4px;margin:20px 0 10px;break-after:avoid;page-break-after:avoid}
.ho h3{color:#1a4d8f;font-size:1.05rem;margin:14px 0 6px;break-after:avoid;page-break-after:avoid}
.ho p{margin:6px 0}
.ho .lead{background:#eef3fa;border-left:4px solid #1a4d8f;padding:10px 14px;border-radius:0 6px 6px 0;color:#2b2b2b;font-size:inherit}
.ho .box,.ho .ex,.ho .warn,.ho .ans{border-radius:8px;padding:10px 14px;margin:10px 0}
.ho .box{background:#fff8e8;border:1.5px solid #f0a500}.ho .box .tag{color:#8a5a00;font-weight:bold;background:none;padding:0}
.ho .box ul{margin:4px 0;padding-left:1.3em}
.ho .ex{background:#f2f9f2;border:1.5px solid #3f8f3f}.ho .ex .tag{display:inline-block;background:#2f7a2f;color:#fff;font-size:.85rem;padding:1px 10px;border-radius:10px;margin-bottom:4px}
.ho .warn{background:#fdf2f2;border:1.5px solid #d9534f}.ho .warn .tag{color:#b52b27;font-weight:bold;background:none;padding:0}
.ho .red{color:#b52b27;font-weight:bold}
.ho table{border-collapse:collapse;width:100%;margin:8px 0}
.ho th,.ho td{border:1px solid #b8c6dc;padding:5px 10px;text-align:left;font-size:.95rem}
.ho th{background:#eef3fa;color:#1a4d8f}
.ho td:last-child,.ho th:last-child{white-space:nowrap;width:1%}
@media (max-width:480px){.ho{padding:16px 14px}.ho h1{font-size:1.35rem}}
.ho ol.probs{padding-left:0;list-style:none}.ho ol.probs li{margin:9px 0}
.ho .hint{color:#666;font-size:.9rem}
.ho .ans{background:#f7f7f7;border:1.5px dashed #999}
.ho .enc{background:#eef3fa;border-radius:8px;padding:10px 14px;margin-top:14px}
.ho .lead,.ho .box,.ho .ex,.ho .warn,.ho .ans,.ho table,.ho .enc{break-inside:avoid;page-break-inside:avoid}
.ho p,.ho li{orphans:3;widows:3}
@media print{

}

const C={leaf:'#3D8B4F',leaf2:'#6DB36F',dark:'#1E3A2B',soil:'#8B5E3C',sun:'#F2B23A',red:'#D7322B',pink:'#F28DB2',hl:'#FFF1CC'};
const svg=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="Huninn,PingFang TC,Noto Sans TC,sans-serif">${inner}</svg>`;
const T=(x,y,t,s=16,c=C.dark,a='middle')=>`<text x="${x}" y="${y}" font-size="${s}" fill="${c}" text-anchor="${a}">${t}</text>`;
const leafAt=(x,y,len,wid,ang,fill=C.leaf)=>`<g transform="translate(${x},${y}) rotate(${ang})"><path d="M0,0 C${wid},${-len*.3} ${wid*.6},${-len*.9} 0,${-len} C${-wid*.6},${-len*.9} ${-wid},${-len*.3} 0,0Z" fill="${fill}" stroke="${C.dark}" stroke-width="1.2"/><line x1="0" y1="0" x2="0" y2="${-len*.9}" stroke="#ffffff" stroke-opacity=".5"/></g>`;

function leafPath(w,h,kind){
  const N=kind==='saw'?160:80, pts=[];
  for(let i=0;i<=N;i++){
    const s=i/N, y=-h+2*h*s, base=w*Math.pow(Math.sin(Math.PI*s),.8);
    let d=0;
    if(kind==='wave') d=5*Math.sin(s*Math.PI*10)*Math.sin(Math.PI*s);
    if(kind==='saw'){const k=(s*14)%1; d=7*(1-k)*Math.sin(Math.PI*s);}
    pts.push([base+d,y]);
  }
  const left=pts.slice().reverse().map(([x,y])=>[-x,y]);
  return 'M'+pts.concat(left).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')+'Z';
}

function tone(seq){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    let t=ac.currentTime;
    seq.forEach(([f,d,type])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);t+=d*.85;});
  }catch(e){}
}

// 出題權重：沒練過的新題最高；答錯比例高的較高；連續答對多次的題目大幅降低
// st＝連續答對次數；舊紀錄沒有 st，從沒錯過就把作答次數當成連續答對
function qWeight(v){
  if(!v||!v.seen)return 4;
  const st=v.st!=null?v.st:(v.wrong?0:v.seen);
  if(st>=3)return 0.15;
  if(st>=2)return 0.4;
  return 1+2*(v.wrong||0)/v.seen;
}
// 依權重不重複抽題（權重越高越容易被抽到、排在前面）
const pickRound=(qs,n,r)=>{r=r||rec;
  const s=qs.map(q=>({q,k:Math.pow(Math.random(),1/qWeight(r[q.id]))})).sort((a,b)=>b.k-a.k).map(x=>x.q);
  return spreadShuffle(n?s.slice(0,n):s)};
// 常錯的觀念：該觀念（原題＋複習題）累計答錯次數
const conceptWrong=c=>ALL.filter(q=>q.c===c).reduce((s,q)=>s+((rec[q.id]||{}).wrong||0),0);
const wrongConcepts=()=>Object.keys(ORIGIN).filter(c=>conceptWrong(c)>0).sort((a,b)=>conceptWrong(b)-conceptWrong(a));

// 複習間隔加入隨機，避免孩子記住「錯題後第幾題一定是複習」
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const GAP_FIRST=()=>rint(2,3), GAP_SECOND=()=>rint(3,5), GAP_AGAIN=()=>rint(2,3), MAX_REVIEW=4;
// 依權重隨機挑一個
function weightedPick(arr,wf){const ws=arr.map(wf),sum=ws.reduce((a,b)=>a+b,0);let r=Math.random()*sum;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i]}return arr[arr.length-1]}
// 打亂順序，並盡量避免同一個觀念的題目相鄰
function spreadShuffle(qs){
  const adj=a=>a.reduce((n,x,i)=>n+(i&&x.c===a[i-1].c?1:0),0);
  let best=shuffle(qs),bs=adj(best);
  for(let t=0;t<30&&bs>0;t++){const a=shuffle(qs),v=adj(a);if(v<bs){best=a;bs=v}}
  return best;
}
// 常錯觀念練習：每個觀念隨機挑 1～2 題，答錯多、練得少的問法比較容易被選到
function buildWeakRound(concepts,all,r){
  const out=[];
  concepts.forEach(c=>{
    let fam=all.filter(q=>q.c===c);
    const take=Math.min(fam.length,concepts.length<=4?2:1);
    for(let k=0;k<take;k++){
      const q=weightedPick(fam,x=>{const v=r[x.id]||{};return (1+2*(v.wrong||0))/(1+(v.seen||0))});
      out.push(q);fam=fam.filter(x=>x!==q);
    }
  });
  return spreadShuffle(out);
}

/* --- 練習進度：每答一題存一次，中途離開可以接著做 --- */
const progKey=ctx=>'progress-'+(ctx.pkey||ctx.key);
function saveProgress(){
  if(!S||!CTX)return;
  store.set(progKey(CTX),{queue:S.queue.slice(S.pos+1).map(x=>({id:x.q.id,kind:x.kind,stage:x.stage||0})),
    total:S.total,leaves:S.leaves,used:[...S.used],cs:S.cs,missed:S.missed,t:Date.now()});
}
function clearProgress(ctx){try{localStorage.removeItem(progKey(ctx))}catch(e){}}
function getProgress(ctx){
  const p=store.get(progKey(ctx),null);
  if(!p||!Array.isArray(p.queue))return null;
  const byId={};ctx.all().forEach(q=>byId[q.id]=q);
  const queue=p.queue.map(x=>byId[x.id]&&!isBlocked(byId[x.id])?{q:byId[x.id],kind:x.kind,stage:x.stage||undefined}:null).filter(Boolean);
  if(!queue.length){clearProgress(ctx);return null}
  return {...p,queue};
}
function resumeHTML(ctx){
  const p=getProgress(ctx);if(!p)return '';
  return `<button class="big" id="resume">▶ 繼續上次的練習（已完成 ${p.leaves.length} / ${p.total} 題）</button>`;
}
function resumeRound(ctx){
  const p=getProgress(ctx);if(!p)return;
  CTX=ctx;
  S={queue:p.queue,total:p.total,pos:0,leaves:p.leaves||[],used:new Set(p.used||[]),cs:p.cs||{},missed:p.missed||[]};
  ask();
}
function start(qs){
  clearProgress(CTX);
  qs=(qs||[]).filter(q=>!isBlocked(q));
  if(!qs.length){toast('目前沒有可以練習的題目');return}
  S={queue:qs.map(q=>({q,kind:'main'})),total:qs.length,pos:0,leaves:[],
     used:new Set(qs.map(q=>q.id)),cs:{},missed:[]};
  ask();
}

// 選同觀念、這一輪還沒出現過的問法
function pickVariant(c,prevId){
  const fam=CTX.all().filter(q=>q.c===c&&!isBlocked(q));
  let cand=fam.filter(q=>!S.used.has(q.id));
  if(!cand.length)cand=fam.filter(q=>q.id!==prevId);
  if(!cand.length)cand=fam;
  cand=shuffle(cand).sort((a,b)=>(b.review?1:0)-(a.review?1:0));
  return cand[0];
}
function schedule(c,stage,gap,prevId){
  const st=S.cs[c]||(S.cs[c]={reviews:0,mastered:false});
  if(st.reviews>=MAX_REVIEW)return false;
  const q=pickVariant(c,prevId);
  st.reviews++; S.used.add(q.id);
  const at=Math.min(S.pos+1+gap,S.queue.length);
  S.queue.splice(at,0,{q,kind:'review',stage});
  return true;
}

function vine(){
  const n=S.total,W=600,H=70,step=(W-70)/Math.max(n,1);
  let d='M10,40';for(let x=10;x<=W-40;x+=10)d+=` L${x},${40+Math.sin(x/28)*7}`;
  const leaves=S.leaves.map((ok,i)=>{const x=24+i*step,y=40+Math.sin(x/28)*7,up=i%2===0;
    return `<g class="${i===S.leaves.length-1&&S.justAdded?'leaf-in':''}">${leafAt(x,y,Math.min(22,step*1.6),Math.min(8,step*.6),up?-35:215,ok?C.leaf:C.sun)}</g>`}).join('');
  const done=S.pos>=S.queue.length;
  const fl=done?`<g class="leaf-in">${[0,72,144,216,288].map(a=>`<ellipse cx="${W-25}" cy="28" rx="7" ry="12" fill="${C.pink}" transform="rotate(${a} ${W-25} 40)"/>`).join('')}<circle cx="${W-25}" cy="40" r="6" fill="${C.sun}"/></g>`:`<circle cx="${W-25}" cy="40" r="5" fill="#B9D7AE"/>`;
  return `<svg class="vine" viewBox="0 0 ${W} ${H}" aria-label="進度：已完成 ${S.leaves.length} / ${n} 題"><path d="${d}" stroke="${C.leaf}" stroke-width="3" fill="none"/>${leaves}${fl}</svg>`;
}

function ask(){
  if(S.pos>=S.queue.length)return finish();
  const item=S.queue[S.pos], q=item.q, rv=item.kind==='review';
  const opts=q.t==='mc'?(q.o.includes('以上皆是')?shuffle(q.o.filter(x=>x!=='以上皆是')).concat('以上皆是'):shuffle(q.o)):null;
  S.cur={...item,opts};

let AIQ=[];
const AI_KEY='g3plants-ai', PENDING_KEY='g3plants-ai-pending';
function normAI(r,seen){
  if(!r||typeof r!=='object')return null;
  const origin=ORIGIN[r.c]; if(!origin)return null;
  const q=String(r.q||'').trim(), why=String(r.why||'').trim();
  if(!q||q.length>80||!why||why.length>120)return null;
  if(seen&&seen.has(q))return null;
  const base={u:origin.u,c:r.c,q,why,pic:origin.pic,ai:true};
  if(r.t==='tf'){ if(r.a!=='O'&&r.a!=='X')return null; return {...base,t:'tf',a:r.a}; }
  if(r.t==='mc'){
    if(!Array.isArray(r.o))return null;
    const o=[...new Set(r.o.map(x=>String(x).trim()).filter(Boolean))];
    if(o.length<2||o.length>4||o.length!==r.o.length)return null;
    if(o.some(x=>x.length>24||/以上皆/.test(x)))return null;
    const a=String(r.a||'').trim(); if(!o.includes(a))return null;
    return {...base,t:'mc',o,a};
  }
  return null;
}
function loadAI(){
  AIQ=store.get(AI_KEY,[]).map(r=>{const n=normAI(r);return n&&r.id?{...n,id:r.id}:null}).filter(Boolean);
  AIQ.forEach(q=>{ALL.push(q);BYID[q.id]=q});
}
function saveAI(){store.set(AI_KEY,AIQ.map(({id,c,t,q,o,a,why})=>({id,c,t,q,o,a,why})))}
function addAI(n){const q={...n,id:'A'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};AIQ.push(q);ALL.push(q);BYID[q.id]=q;saveAI();}

async function api(action,data,signal){
  if(!CONFIG.API_URL)throw {code:'not_configured',message:'網站尚未設定後端網址'};
  let res;
  try{
    res=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,code:FAMILY.code,...(data||{})}),signal,redirect:'follow'});
  }catch(e){
    if(e&&e.name==='AbortError')throw {code:'cancelled'};
    throw {code:'network',message:'連不上後端'};
  }
  let j; try{j=await res.json()}catch(e){throw {code:'server_error',message:'後端回應格式錯誤'}}
  if(!j.ok)throw {code:j.code||'server_error',message:j.message||''};
  return j;
}
function parseJSONLoose(t){
  t=String(t||'').replace(/```json|```/g,'').trim();
  try{return JSON.parse(t)}catch(e){}
  const i=Math.min(...['{','['].map(c=>{const k=t.indexOf(c);return k<0?Infinity:k}));
  if(i===Infinity)return undefined;
  const body=t.slice(i);
  const j=Math.max(body.lastIndexOf('}'),body.lastIndexOf(']'));
  if(j>0){try{return JSON.parse(body.slice(0,j+1))}catch(e){}}
  return repairJSON(body);
}
// 回應太長被截斷時：退回到最後一個完整的物件，補上缺少的括號
function repairJSON(t){
  const stack=[];let inStr=false,esc=false,lastGood=-1,lastStack=null;
  for(let k=0;k<t.length;k++){
    const ch=t[k];
    if(inStr){if(esc)esc=false;else if(ch==='\\')esc=true;else if(ch==='"')inStr=false;continue}
    if(ch==='"'){inStr=true;continue}
    if(ch==='{'||ch==='[')stack.push(ch);
    else if(ch==='}'||ch===']'){stack.pop();if(ch==='}'&&stack.length){lastGood=k;lastStack=stack.slice()}}
  }
  if(lastGood<0)return undefined;
  const close=lastStack.slice().reverse().map(c=>c==='{'?'}':']').join('');
  try{const v=JSON.parse(t.slice(0,lastGood+1)+close);if(v&&typeof v==='object'){v.__repaired=true;return v}}catch(e){}
  return undefined;
}
// 介面和原本 Claude 網站版的 sample 相同，其他程式不用改
function makeSample(){
  const call=async(prompt,opts={})=>{

    for(const b of [].concat(opts.images||[]))images.push((await readDataURL(b)).split(',')[1]);
    const j=await api('ai',{prompt,images,tier:opts.modelTier==='quick'?'quick':'default'},opts.signal);

  };
  call.json=async(p,o)=>{const {text,truncated}=await call(p,o);const v=parseJSONLoose(text);if(v===undefined)throw {code:'invalid_json',message:truncated?'回應太長被截斷':''};return v};
  call.limits=async()=>({maxPromptBytes:200000,images:{maxCount:5,maxInputBytes:20e6,mediaTypes:['image/jpeg','image/png','image/webp']}});
  return call;
}

function buildPrompt(unit,count){
  const concepts=Object.values(ORIGIN).filter(q=>unit==='all'||q.u===unit);
  const facts=concepts.map(q=>`【${q.c}】${UNITS[q.u]}｜原題：${q.q}｜答案：${q.t==='tf'?(q.a==='O'?'對':'錯'):q.a}｜老師說：${q.why}`).join('\n');
  const cset=new Set(concepts.map(q=>q.c));
  const existing=ALL.filter(q=>cset.has(q.c)).map(q=>'- '+q.q).join('\n');
  return `你是台灣國小三年級自然科的出題老師。請「只根據」下面觀念清單裡的事實出新題目，不可以加入清單以外的植物、名詞、顏色或知識。

規則：
1. 出 ${count} 題，使用繁體中文（台灣用語），句子簡短，三年級小朋友看得懂。
2. 每題用 c 標出對應的觀念代號，必須是清單裡的代號；盡量分散在不同觀念。
3. t 是題型："tf"（是非題）或 "mc"（選擇題），兩種都要有。
4. 是非題的 a 是 "O"（對）或 "X"（錯）。錯的敘述要根據清單明確是錯的。

6. why 是一兩句解說，口氣像老師，不超過 50 字。
7. 不要和「已經有的題目」重複，要換問法、換角度，或把兩個相近觀念做比較。

[{"c":"L7","t":"mc","q":"一個節長三片葉子的是哪一種？","o":["輪生","對生","互生"],"a":"輪生","why":"輪生是一個節長三片葉子。"},{"c":"L1","t":"tf","q":"所有葉子都是綠色的。","a":"X","why":"有些葉子是紅色，例如聖誕紅。"}]

觀念清單：
${facts}

已經有的題目：
${existing}`;

/* --- 對話框鍵盤操作：Esc 關閉、Tab 留在對話框內、關閉後焦點回到原本的按鈕 --- */
const MODALS=[];
function modalKeys(root,onEsc){
  const prev=document.activeElement;MODALS.push(root);
  const kd=e=>{
    if(!root.isConnected){done(false);return}
    if(MODALS[MODALS.length-1]!==root)return;
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();onEsc();return}
    if(e.key!=='Tab')return;
    const f=[...root.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>x.getClientRects().length);
    if(!f.length)return;
    const a=f[0],z=f[f.length-1],cur=document.activeElement;
    if(!root.contains(cur)){e.preventDefault();a.focus()}
    else if(e.shiftKey&&cur===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&cur===z){e.preventDefault();a.focus()}
  };
  const done=(refocus=true)=>{document.removeEventListener('keydown',kd,true);const i=MODALS.indexOf(root);if(i>=0)MODALS.splice(i,1);
    if(refocus&&prev&&prev.isConnected&&typeof prev.focus==='function')prev.focus()};
  document.addEventListener('keydown',kd,true);
  return done;
}

  document.body.appendChild(d);
  const close=v=>{d.remove();keys();res(v)};const keys=modalKeys(d,()=>close(false));
  d.querySelectorAll('button').forEach(x=>x.onclick=()=>close(x.dataset.k==='1'));
  d.querySelector('[data-k="0"]').focus();
})}

/* --- 題目驗證 --- */
function normQ(r,conceptIds){
  if(!r||typeof r!=='object')return null;
  const c=String(r.c||''); if(conceptIds&&!conceptIds.has(c))return null;
  const q=String(r.q||'').trim(), why=String(r.why||'').trim();
  if(!q||q.length>160||why.length>200)return null;
  const lv=[1,2,3].includes(+r.lv)?+r.lv:1;
  const src=['原題','改寫','AI'].includes(r.src)?r.src:'AI';
  const icon=typeof r.icon==='string'?[...r.icon.trim()].slice(0,4).join(''):'';
  const detail=typeof r.detail==='string'?r.detail.trim().slice(0,400):'';
  const base={c,q,why:why||'',lv,src,ansByAI:!!r.ansByAI,icon,...(detail?{detail}:{})};
  if(r.t==='tf'){ if(r.a!=='O'&&r.a!=='X')return null; return {...base,t:'tf',a:r.a}; }
  if(r.t==='mc'){
    if(!Array.isArray(r.o))return null;
    const o=r.o.map(x=>String(x).trim()).filter(Boolean);
    if(o.length<2||o.length>4||new Set(o).size!==o.length||o.some(x=>x.length>40))return null;
    const a=String(r.a||'').trim(); if(!o.includes(a))return null;
    return {...base,t:'mc',o,a};
  }
  return null;
}
const newId=(bank,p)=>p+(++bank.seq).toString(36)+Math.random().toString(36).slice(2,5);

function mergeResult(bank,res,defaultSrc){
  const idMap={};
  (Array.isArray(res&&res.concepts)?res.concepts:[]).forEach(con=>{
    const id=String(con&&con.id||''), text=String(con&&con.text||'').trim().slice(0,120);
    if(!id)return;
    if(bank.concepts.some(x=>x.id===id)){idMap[id]=id;return}
    if(!text)return;
    const nid=newId(bank,'k'); idMap[id]=nid; bank.concepts.push({id:nid,text});
  });
  const ids=new Set(bank.concepts.map(x=>x.id));
  const seen=new Set(bank.questions.concat(bank.pending).map(q=>q.q));
  let added=0,dropped=0;
  const qs=Array.isArray(res)?res:(Array.isArray(res&&res.questions)?res.questions:[]);
  qs.forEach(r=>{
    const rr={...r,c:idMap[r&&r.c]||(r&&r.c),src:(r&&r.src)||defaultSrc};
    const n=normQ(rr,ids);
    if(!n||seen.has(n.q)){dropped++;return}
    seen.add(n.q); bank.questions.push({...n,id:newId(bank,'q')}); added++;
  });
  const sk=Array.isArray(res&&res.skipped)?res.skipped:[];
  sk.forEach(x=>{const q=String(x&&x.q||'').trim().slice(0,160);if(q)bank.skipped.push({q,reason:String(x.reason||'').slice(0,80)})});
  return {added,dropped,skipped:sk.length};
}

/* --- 練習：沿用植物小學堂的引擎（間隔複習、朗讀、音效） --- */
function bankCtx(bank){return {
  key:bank.id, pkey:(bank.__lib?'lib-':'')+bank.id, bank,
  all:()=>bank.questions,
  origin:c=>bank.questions.find(q=>q.c===c&&q.src==='原題')||bank.questions.find(q=>q.c===c),
  label:q=>LV[q.lv]||'基礎',
  bump:(id,ok)=>{const r=bank.rec[id]||{seen:0,wrong:0};r.seen++;if(!ok)r.wrong++;r.st=ok?(r.st||0)+1:0;bank.rec[id]=r;logDay(bank,ok);scheduleSave(bank)},
  rec:()=>bank.rec,
  pic:q=>{const con=(bank.concepts.find(x=>x.id===q.c)||{}).text;
    return (q.icon||con)?`<div class="bpic">${q.icon?`<div class="bicon">${esc(q.icon)}</div>`:''}${con?`<p>📌 觀念：${esc(con)}</p>`:''}</div>`:''},
  home:()=>{bsSave(bank);bank.__lib?libBankHome(bank):bankHome(bank)},
  restart:()=>startBank(bank),
}}
// 常錯的觀念：該觀念所有題目累計答錯次數，多的排前面
function weakConcepts(bank){
  const w={};bank.questions.forEach(q=>{const r=bank.rec[q.id];if(r&&r.wrong)w[q.c]=(w[q.c]||0)+r.wrong});
  return Object.keys(w).sort((a,b)=>w[b]-w[a]);
}
// 每個常錯觀念出一題，優先用孩子練得最少的問法
function startWeak(bank){
  const qs=buildWeakRound(shuffle(weakConcepts(bank).slice(0,10)),bank.questions,bank.rec);
  if(!qs.length)return;
  CTX=bankCtx(bank);start(qs);
}
function startBank(bank){
  const pool=bank.questions.filter(q=>!bprefs.lv||q.lv===bprefs.lv);
  if(!pool.length){toast('這個難度還沒有題目');return}
  CTX=bankCtx(bank);
  start(pickRound(pool,bprefs.count,bank.rec));
}

/* --- 照片統一轉成 JPG（含 HEIC），並縮小以節省額度 --- */
function readDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function toJpeg(file){
  try{
    const src=await readDataURL(file);
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=src});
    const max=1600,w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)return null;
    const k=Math.min(1,max/Math.max(w,h));
    const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));if(!blob)return null;
    const t=document.createElement('canvas');const tk=Math.min(1,168/Math.max(w,h));t.width=Math.round(w*tk);t.height=Math.round(h*tk);
    t.getContext('2d').drawImage(img,0,0,t.width,t.height);
    blob.thumb=t.toDataURL('image/jpeg',0.7);
    return blob;
  }catch(e){return null}
}

async function runAnalyze(bank,maxN){
  upState.phase='working';upState.msg='Claude 正在看資料……';uploadPage(bank,true);
  const files=upState.files.slice(), text=upState.text.trim().slice(0,60000), note=upState.note.trim().slice(0,300);
  const per=Math.min(maxN||2,2);
  const batches=[]; if(files.length){for(let i=0;i<files.length;i+=per)batches.push(files.slice(i,i+per))} else batches.push([]);
  let tot={added:0,dropped:0,skipped:0},err=null;
  for(let i=0;i<batches.length;i++){
    const ctl=new AbortController();upState.ctl=ctl;
    const label=batches.length>1?`第 ${i+1} / ${batches.length} 批：`:'';
    const pr=document.getElementById('u-prog'); if(pr)pr.textContent=label+'Claude 正在看資料……';
    try{
      const opts={signal:ctl.signal,cache:false,modelTier:'default',onText:()=>{const p=document.getElementById('u-prog');if(p)p.textContent=label+'Claude 正在整理題目……'}};
      if(batches[i].length)opts.images=batches[i];
      const res=await SAMPLE.json(analyzePrompt(bank,i===0?text:'',note,batches[i].length,upLv),opts);
      if(res&&res.__repaired)tot.cut=(tot.cut||0)+1;
      if(upLv&&res&&Array.isArray(res.questions))res.questions.forEach(q=>{if(q&&q.src==='AI')q.lv=upLv});
      const r=mergeResult(bank,res,'原題'); tot.added+=r.added;tot.dropped+=r.dropped;tot.skipped+=r.skipped;
      await bsSave(bank);
    }catch(e){
      if(e&&e.code==='cancelled'){err=e;break}
      if(e&&['bad_code','daily_limit','no_credit','not_configured'].includes(e.code)){err=e;break}
      err=e;tot.failed=(tot.failed||[]).concat(i+1);
    }
  }
  // 原題不夠目標題數時，用整理出的觀念補題
  let extra=0;
  const stopped=err&&['cancelled','bad_code','daily_limit','no_credit','not_configured'].includes(err.code);
  if(tot.added&&tot.added<upCount&&!stopped&&bank.concepts.length){
    const ctl=new AbortController();upState.ctl=ctl;
    const r=await genBatches(bank,upLv,upCount-tot.added,ctl,(a,t)=>{const p=document.getElementById('u-prog');if(p)p.textContent=`原題 ${tot.added} 題，AI 正在補題目……（${a} / ${t} 題）`});
    extra=r.added;if(r.err)err=r.err;
  }
  upState.ctl=null;upState.phase='idle';
  if(tot.added||tot.skipped){
    upState.files=[];upState.text='';upState.note='';
    const all=tot.added+extra;
    bankHome(bank,`新增 ${all} 題，已收進題庫（資料原題 ${tot.added} 題${extra?`、AI 補題 ${extra} 題`:''}）${tot.skipped?`；另有 ${tot.skipped} 題不適合點選作答`:''}${tot.dropped?`；${tot.dropped} 題格式不合格或重複，已略過`:''}${tot.cut?`。有 ${tot.cut} 批內容太多，後段題目可能沒整理到，可以把那幾張照片再上傳一次`:''}${tot.failed?`。第 ${tot.failed.join('、')} 批沒有成功（${aiErrMsg(err)}），可以把那幾張照片再上傳一次`:''}${extra+tot.added<upCount&&err&&!tot.failed?`。補題沒有完成（${aiErrMsg(err)}）`:''}。詳細解題會在每天的排程自動補上。`);
    return;
  }
  upState.msg=err?aiErrMsg(err):'這次沒有整理出可以用的題目，請換清楚一點的照片，或補充說明再試一次。';
  uploadPage(bank,true);
}

/* --- 每次最多請 AI 出幾題（受單次輸出長度限制），題數多時分批 --- */
const GEN_PER_CALL=15;
const QCOUNTS=[20,30,50];
const callsFor=n=>Math.ceil(n/GEN_PER_CALL);
async function genBatches(bank,lv,target,ctl,onProg,only){
  let added=0,dropped=0,rounds=0,err=null;
  const maxRounds=callsFor(target)+1;
  while(added<target&&rounds<maxRounds){
    rounds++;
    const want=Math.min(GEN_PER_CALL,target-added);
    onProg&&onProg(added,target);
    try{
      const res=await SAMPLE.json(genPrompt(bank,lv,want,only),{signal:ctl.signal,cache:false,modelTier:'quick'});
      const arr=(Array.isArray(res)?res:[]).map(r=>({...r,src:'AI',ansByAI:false,lv:lv||r.lv}));
      const r=mergeResult(bank,{questions:arr},'AI');
      added+=r.added;dropped+=r.dropped;
      await bsSave(bank);
      if(!r.added)break;
    }catch(e){err=e;break}
  }
  return {added,dropped,err};
}

/* --- 觀念複選：答錯過的觀念排前面並預設勾選，也可以選其他觀念或整個題庫 --- */
function conceptWrongCount(bank){const w={};bank.questions.forEach(q=>{const r=bank.rec[q.id];if(r&&r.wrong)w[q.c]=(w[q.c]||0)+r.wrong});return w}
function defaultConcepts(bank,extra){
  const w=conceptWrongCount(bank);
  const s=new Set([...(extra||[]),...Object.keys(w)].filter(id=>bank.concepts.some(c=>c.id===id)));
  return s.size?s:new Set(bank.concepts.map(c=>c.id));
}
function conceptPickerHTML(bank,sel){
  const w=conceptWrongCount(bank);
  const weak=bank.concepts.filter(c=>w[c.id]).sort((a,b)=>w[b.id]-w[a.id]);
  const rest=bank.concepts.filter(c=>!w[c.id]);
  const row=c=>`<label class="cpick"><input type="checkbox" data-cp="${esc(c.id)}" ${sel.has(c.id)?'checked':''}><span>${esc(c.text)}${w[c.id]?`<small>答錯 ${w[c.id]} 次</small>`:''}</span></label>`;
  return `<div class="cpicker">
    <div class="cp-tools"><button class="iconbtn" data-cpall="1">全選（整個題庫）</button><button class="iconbtn" data-cpall="0">全部取消</button><span class="cp-n" aria-live="polite">已選 ${sel.size} 個</span></div>
    ${weak.length?`<div class="section-title">答錯過的觀念（建議）</div>${weak.map(row).join('')}`:''}
    ${rest.length?`<div class="section-title">${weak.length?'其他觀念':'觀念'}</div>${rest.map(row).join('')}`:''}
  </div>`;
}
function bindConceptPicker(root,sel,onChange){
  const upd=()=>{const n=root.querySelector('.cp-n');if(n)n.textContent=`已選 ${sel.size} 個`;onChange&&onChange()};
  root.querySelectorAll('[data-cp]').forEach(i=>i.onchange=()=>{i.checked?sel.add(i.dataset.cp):sel.delete(i.dataset.cp);upd()});
  root.querySelectorAll('[data-cpall]').forEach(b=>b.onclick=()=>{const on=b.dataset.cpall==='1';
    root.querySelectorAll('[data-cp]').forEach(i=>{i.checked=on;on?sel.add(i.dataset.cp):sel.delete(i.dataset.cp)});upd()});
}

async function runGen(bank){
  genState.phase='working';genPage(bank);

    genState.cons.size<bank.concepts.length?genState.cons:null);
  genState.phase='idle';genState.ctl=null;
  if(r.added){genState.msg='';
    bankHome(bank,`新增 ${r.added} 題，已收進題庫${r.added<genState.count&&r.err?`（${aiErrMsg(r.err)}）`:''}。詳細解題會在每天的排程自動補上。`);return}
  genState.msg=r.err?aiErrMsg(r.err):'這次產生的題目都不合格，請再試一次。';
  genPage(bank);
}

let listEdit='',listDraft=null;
let LF={st:'',lv:0,t:'',src:'',rec:''};   // 題目清單的篩選
// 題目的狀態：需要修正（AI 判讀有問題或回報成立）／有人回報／通過／未判斷
// AI 判讀通過就等於答案已經驗算過，不再顯示「答案由 AI 判斷」的警示
const needAnsCheck=q=>!!q.ansByAI&&!(q.check&&q.check.s==='pass');
function qStatus(q,key){
  const f=(FLAGS[key]&&FLAGS[key].f[q.id])||'';
  if(f==='issue'||(q.check&&q.check.s==='issue'))return 'issue';
  if(f==='reported')return 'reported';
  return q.check&&q.check.s==='pass'?'pass':'none';
}
function issueCounts(bank){
  const c={issue:0,reported:0};
  bank.questions.forEach(q=>{const s=qStatus(q,bank.id);if(s in c)c[s]++});
  return c;
}
function listBtnHTML(bank){
  const n=bank.questions.length,c=issueCounts(bank);
  const extra=[c.issue?`⚠️ ${c.issue} 題需要修正`:'',c.reported?`🚩 ${c.reported} 題被回報`:''].filter(Boolean).join('・');
  return extra?`<button class="ghost needfix" id="ls">📋 題目清單與作答紀錄（${n}）<br><b>${extra}</b></button>`:`<button class="ghost" id="ls">📋 題目清單與作答紀錄（${n}）</button>`;
}
// 從外層進入：有需要修正的題目時，預設只顯示那些題目

  const $=id=>document.getElementById(id);
  $('bk').onclick=()=>{listEdit='';listDraft=null;bankHome(bank)};
  app.querySelectorAll('[data-lf]').forEach(b=>b.onclick=()=>{const k=b.dataset.lf;LF[k]=k==='lv'?+b.dataset.v:b.dataset.v;listPage(bank)});

    Q[i]=nq;listEdit='';listDraft=null;await bsSave(bank);delete FLAGS[bank.id];await loadFlags(bank.id);toast('已修改，會在下次掃題重新判讀');listPage(bank)};
  if($('e-cancel'))$('e-cancel').onclick=()=>{listEdit='';listDraft=null;listPage(bank)};
  app.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{const q=Q[idx(b.dataset.fix)],f=q.check.fix;

    listDraft=d;listEdit=q.id;listPage(bank);toast('已帶入建議內容，請確認後按「儲存修改」')});
  app.querySelectorAll('[data-qdel]').forEach(b=>b.onclick=async()=>{if(!await confirmBox('確定要刪除這題嗎？'))return;bank.questions=bank.questions.filter(q=>q.id!==b.dataset.qdel);await bsSave(bank);listPage(bank)});
  if($('clr'))$('clr').onclick=async()=>{if(await confirmBox('確定要清除作答紀錄嗎？')){bank.rec={};await bsSave(bank);listPage(bank)}};

function importBank(file){

      const src=j.bank;
      const nb=fixBank({id:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),createdAt:Date.now(),
        grade:String(src.grade||''),term:String(src.term||''),subject:String(src.subject||''),publisher:String(src.publisher||''),unit:String(src.unit||''),title:String(src.title||'')});
      nb.concepts=(Array.isArray(src.concepts)?src.concepts:[]).map(c=>({id:String(c.id||''),text:String(c.text||'').slice(0,120)})).filter(c=>c.id&&c.text&&/^[\w.~:@+-]+$/.test(c.id));
      const ids=new Set(nb.concepts.map(c=>c.id));
      nb.questions=(Array.isArray(src.questions)?src.questions:[]).map(q=>{const n=normQ(q,ids);return n?{...n,id:newId(nb,'q')}:null}).filter(Boolean);

}

/* ===== 詳細解題（建立題庫時由 AI 一次產生，練習時不再呼叫 AI） ===== */
const DETAIL_BATCH=12;
let detState={phase:'idle',msg:'',ctl:null,done:0,total:0};
const needDetail=bank=>bank.questions.concat(bank.pending).filter(q=>!q.detail);

function detailPrompt(bank,qs){
  const con=c=>(bank.concepts.find(x=>x.id===c)||{}).text||'';
  const list=qs.map(q=>JSON.stringify({id:q.id,觀念:con(q.c),題型:q.t==='tf'?'是非':'選擇',題目:q.q,選項:q.o||undefined,答案:ansStr(q),原本解說:q.why}));
  return `你是台灣的國小老師。請幫下面每一題寫「詳細解題」，給${bank.grade||'國小'}的小朋友看。題庫：${bankInfo(bank)}。

規則：
1. 每題 2 到 4 句，150 字以內，用小朋友聽得懂的話。
2. 先說怎麼想出答案；選擇題要簡單說明其他選項為什麼不對；是非題是「錯」的，要說出正確的說法。
3. 有容易搞混的地方，最後提醒一句。
4. 只能根據題目、答案、觀念和原本解說，不要加入其他知識，也不可以改答案。

只回傳 JSON 陣列，不要其他文字，格式：
[{"id":"題目代號","detail":"詳細解題"}]

題目：
${list.join('\n')}`;
}

function detailPage(bank){
  const left=needDetail(bank).length;
  const busy=detState.phase==='working';
  app.innerHTML=`
   <div class="toprow"><button class="iconbtn" id="bk">← ${esc(bank.title||bankInfo(bank))}</button></div>
   <h1 class="pg">📝 補上詳細解題</h1>
   <p class="lead">AI 會幫每一題寫 2～4 句詳細解題：怎麼想出答案、其他選項為什麼不對、容易搞混的地方。寫好後存進題庫，孩子答題後可以點「📖 看詳細解題」，練習時不會再花費。</p>
   <p class="lead" style="font-size:1rem">還沒有詳解的題目：<b>${left}</b> 題（包含待確認的題目）。每 ${DETAIL_BATCH} 題一批，約 ${Math.max(1,Math.ceil(left/DETAIL_BATCH))} 次 AI 呼叫。</p>
   ${sampleBlocked()?aiUnavailableHTML():`<div id="d-act"></div>`}`;
  const $=id=>document.getElementById(id);
  $('bk').onclick=()=>{if(detState.ctl)detState.ctl.abort();bankHome(bank)};
  bindFamilyBtn(()=>detailPage(bank));
  if(sampleBlocked())return;
  const act=$('d-act');
  if(detState.phase==='confirm'){
    act.innerHTML=quotaNote+`<button class="big" id="d-go">我知道了，開始補詳解</button><button class="ghost" id="d-cancel">取消</button>`;
    $('d-go').onclick=()=>runDetail(bank); $('d-cancel').onclick=()=>{detState.phase='idle';detailPage(bank)};
  }else if(busy){
    act.innerHTML=`<div class="feedback"><p class="fb-head">Claude 正在寫詳解……（${detState.done} / ${detState.total} 題）</p><p class="fb-why">請不要關掉畫面。中途停止的話，已完成的詳解會保留。</p><button class="ghost" id="d-stop">停止</button></div>`;
    $('d-stop').onclick=()=>detState.ctl&&detState.ctl.abort();
  }else{
    act.innerHTML=`${left?'<button class="big" id="d-start">📝 開始補詳解</button>':'<p class="lead">所有題目都已經有詳解了。</p>'}${detState.msg?`<p class="lead" style="margin-top:12px">${esc(detState.msg)}</p>`:''}`;
    if($('d-start'))$('d-start').onclick=()=>{detState.phase='confirm';detState.msg='';detailPage(bank)};
  }
}
async function runDetail(bank){
  const todo=needDetail(bank);
  detState={phase:'working',msg:'',ctl:null,done:0,total:todo.length};
  detailPage(bank);
  let err=null,fail=0;
  for(let i=0;i<todo.length;i+=DETAIL_BATCH){
    const part=todo.slice(i,i+DETAIL_BATCH);
    const ctl=new AbortController();detState.ctl=ctl;
    try{
      const res=await SAMPLE.json(detailPrompt(bank,part),{signal:ctl.signal,cache:false,modelTier:'quick'});
      const map={};(Array.isArray(res)?res:[]).forEach(r=>{if(r&&r.id&&r.detail)map[String(r.id)]=String(r.detail).trim().slice(0,400)});
      part.forEach(q=>{if(map[q.id])q.detail=map[q.id]});
      await bsSave(bank);
    }catch(e){
      err=e;
      if(e&&['cancelled','bad_code','daily_limit','no_credit','not_configured'].includes(e.code))break;
      fail++;
    }
    detState.done=Math.min(todo.length,i+DETAIL_BATCH);
    if(detState.phase==='working')detailPage(bank);
  }
  const got=todo.filter(q=>q.detail).length;
  detState.phase='idle';detState.ctl=null;
  detState.msg=`完成 ${got} 題的詳解。`+(err?(fail?`有 ${fail} 批沒有成功，可以再按一次補上。`:aiErrMsg(err)):'');
  detailPage(bank);
}

/* ===== 學習分析（用作答紀錄統計，不需要 AI；家長摘要為選配） ===== */
const dayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function logDay(bank,ok){
  bank.days=bank.days||{};
  const k=dayKey(),x=bank.days[k]||(bank.days[k]={s:0,w:0});x.s++;if(!ok)x.w++;
  const keys=Object.keys(bank.days).sort();while(keys.length>60)delete bank.days[keys.shift()];
}
function bankStats(bank){
  const sum=qs=>qs.reduce((a,q)=>{const r=bank.rec[q.id]||{};a.s+=r.seen||0;a.w+=r.wrong||0;return a},{s:0,w:0});
  const acc=x=>x.s?(x.s-x.w)/x.s:null;
  const all=sum(bank.questions);
  const practiced=bank.questions.filter(q=>(bank.rec[q.id]||{}).seen).length;
  const levels=[1,2,3].map(l=>{const qs=bank.questions.filter(q=>q.lv===l);const x=sum(qs);return {l,n:qs.length,...x,acc:acc(x)}}).filter(x=>x.n);
  const concepts=bank.concepts.map(c=>{const qs=bank.questions.filter(q=>q.c===c.id);const x=sum(qs);const a=acc(x);
    const status=!x.s?'還沒練':(a>=.8&&x.s>=3?'已熟練':a<.6?'需要加強':'練習中');
    return {id:c.id,text:c.text,n:qs.length,...x,acc:a,status}}).filter(c=>c.n);
  const order={'需要加強':0,'練習中':1,'還沒練':2,'已熟練':3};
  concepts.sort((a,b)=>order[a.status]-order[b.status]||(a.acc??1)-(b.acc??1));
  const wrongQs=bank.questions.filter(q=>(bank.rec[q.id]||{}).wrong).sort((a,b)=>bank.rec[b.id].wrong-bank.rec[a.id].wrong).slice(0,10);
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dayKey(d);const x=(bank.days||{})[k]||{s:0,w:0};days.push({k,label:`${d.getMonth()+1}/${d.getDate()}`,...x})}
  return {all:{...all,acc:acc(all)},practiced,total:bank.questions.length,levels,concepts,wrongQs,days};
}

async function runSummary(bank,st){
  sumState={phase:'working',msg:'',ctl:new AbortController()};analysisPage(bank);
  const lines=[
    `題庫：${bankInfo(bank)}`,
    `累計作答 ${st.all.s} 次，整體答對率 ${pct(st.all.acc)}，練過 ${st.practiced}/${st.total} 題。`,
    '各難度：'+st.levels.map(x=>`${LV[x.l]} ${pct(x.acc)}（作答 ${x.s} 次）`).join('、'),
    '觀念：',...st.concepts.map(c=>`- ${c.text}：${c.status}，答對率 ${pct(c.acc)}，作答 ${c.s} 次`),
    '最常答錯：',...st.wrongQs.slice(0,5).map(q=>`- ${q.q}（答案：${ansStr(q)}，錯 ${bank.rec[q.id].wrong} 次）`),
    '最近 14 天每日作答次數：'+st.days.map(d=>d.s).join(','),
  ].join('\n');
  try{
    const {text}=await SAMPLE(`你是台灣的國小老師，請根據下面的練習統計，寫一段給家長看的學習摘要。
規則：
1. 用繁體中文，口氣溫和、具體，總共 4 到 6 句，不要用條列符號以外的格式標記。
2. 先說整體表現，再點出最需要加強的 1 到 3 個觀念，最後給 1 到 2 個具體的練習建議（例如先練哪個難度、用「練常錯的觀念」複習哪些內容）。
3. 只能根據統計內容，不要猜測孩子的個性或家庭狀況。作答次數太少的地方要說明資料還不夠。

統計：
${lines}`,{signal:sumState.ctl.signal,modelTier:'quick'});
    bank.summary={text:String(text||'').trim().slice(0,1200),at:Date.now()};
    await bsSave(bank);
    sumState={phase:'idle',msg:'',ctl:null};
  }catch(e){sumState={phase:'idle',msg:aiErrMsg(e),ctl:null}}
  analysisPage(bank);
}

const hoApi=(bank,action,data)=>bank.__lib?libApi(action,data):api(action,data);
function hjSave(){if(!HJ){try{localStorage.removeItem(HJ_KEY)}catch(e){}return}const {ctl,...x}=HJ;store.set(HJ_KEY,x)}
const hoStr=(v,n)=>String(v==null?'':v).trim().slice(0,n||600);
const hoArr=(v,n,m)=>(Array.isArray(v)?v:[]).map(x=>hoStr(x,m)).filter(Boolean).slice(0,n);

function hoRules(bank){
  return `寫作規則：
- 對象是${bank.grade||'國小'}的孩子。口語、親切，像老師在旁邊講，用「你」稱呼；多用生活裡的比喻。
- 台灣用語、繁體中文，名詞用台灣課本的說法；不要用孩子看不懂的術語，用到就順便解釋。
- 只能根據提供的觀念和題目範圍，不要加入超出年級或範圍的內容。
- 自己設計的題目要和題庫題目同型、同難度，但數字或情境至少換一項，不可以照抄原題。
${isMathBank(bank)?'- 數學：數字要挑得乾淨，答案盡量是整數或一位小數；圓周率用 3.14。每一題寫完都要自己重算一次確認答案正確。\n':''}- 不要使用 Markdown 符號（*、#、|），只寫純文字。`;
}
function hoQs(bank,ids){
  return bank.questions.filter(q=>!ids||ids.includes(q.c)).slice(0,30)
    .map(q=>`- ${q.q}${q.t==='mc'?`（選項：${q.o.join('／')}）`:''}（答案：${ansStr(q)}）`).join('\n')||'（沒有題目）';
}
function hoBlockPrompt(bank,con){
  return `你是台灣的國小老師，要為「${bankInfo(bank)}」寫一份給孩子看的重點講義。這一次只寫其中一個觀念的段落。

觀念：${con.text}

這個觀念在題庫裡的題目（讓你了解考法，不可以照抄）：
${hoQs(bank,[con.id])}

這一段要寫：
1. title：白話標題，一句話說出這個觀念在做什麼（不超過 20 字）。
2. why：一兩句說明「為什麼」，不要只丟結論。
3. rules：重點 2～4 條（招式、口訣或公式），每條一句。
4. example：自己設計一題例題，分步驟寫（最多 6 步，每步寫成「第一步（做什麼）：內容」），最後給答案。
5. mistake：這個觀念最常錯的地方，一兩句。

${hoRules(bank)}

只回傳一個 JSON 物件，不要其他文字：
{"title":"…","why":"…","rules":["…"],"example":{"q":"…","steps":["第一步（…）：…"],"answer":"…"},"mistake":"…"}`;
}
function hoOutline(blocks){return blocks.map((b,i)=>`觀念${CN_NUM[i]}：${b.title}｜重點：${b.rules.join('；')}`).join('\n')}
function hoPracticePrompt(bank,blocks,ids,lv){
  return `你是台灣的國小老師，正在為「${bankInfo(bank)}」寫重點講義。觀念段落已經寫好：
${hoOutline(blocks)}

題庫題目（讓你了解考法，不可以照抄）：
${hoQs(bank,ids)}

請寫：
1. intro：導讀，3～4 句，用一段話串起上面所有觀念，並給學習建議。
2. index：卡題索引 3～8 列。left 寫「題目表面看起來的樣子」（孩子眼睛看得到的字眼或句式，例如「…哪一個不是…？」），不可以寫觀念名稱；block 寫對應的觀念編號（數字，從 1 開始）。
3. practice：分層練習，題目旁不可以寫是哪個觀念（判斷用哪一招是孩子的練習）。
   - basic：${lv[0]} 題，只用一個觀念就能回答。
   - advanced：${lv[1]} 題，要多想一步或反過來想。
   - challenge：${lv[2]} 題，要結合兩個觀念或多步推理，每題附一句 hint 提示。
   題目可以是填空、簡答或選擇，讓孩子寫在紙上；不要和例題重複。
4. encourage：結尾一兩句鼓勵，提醒可以回去練習題庫。

${hoRules(bank)}

只回傳一個 JSON 物件，不要其他文字：
{"intro":"…","index":[{"left":"…","block":1}],"practice":{"basic":["…"],"advanced":["…"],"challenge":[{"q":"…","hint":"…"}]},"encourage":"…"}`;
}
function hoAnswerPrompt(bank,blocks,practice){
  let n=0;
  const list=[...practice.basic.map(q=>`${++n}. ${q}`),...practice.advanced.map(q=>`${++n}. ${q}`),...practice.challenge.map(c=>`${++n}. ${c.q}`)].join('\n');
  return `你是台灣的國小老師，正在為「${bankInfo(bank)}」寫重點講義的詳解。講義的觀念：
${hoOutline(blocks)}

練習題：
${list}

請為每一題寫完整詳解：steps 分步驟寫出過程（孩子看得懂每一步），answer 寫最後答案。適時補一句「驗證」或「提醒」。
${isMathBank(bank)?'每一題都要自己重新計算一次，確認答案正確。':''}
不要使用 Markdown 符號，只寫純文字。

只回傳一個 JSON 陣列，題號要和上面一致：
[{"no":1,"steps":["…"],"answer":"…"}]`;
}
function hoNormBlock(r,con){
  if(!r||typeof r!=='object')return null;
  const ex=r.example||{};
  const b={cid:con.id,title:hoStr(r.title,60)||con.text,why:hoStr(r.why,400),rules:hoArr(r.rules,6,200),
    example:{q:hoStr(ex.q,400),steps:hoArr(ex.steps,8,300),answer:hoStr(ex.answer,200)},mistake:hoStr(r.mistake,400)};
  return b.why||b.rules.length?b:null;
}
function hoNormPractice(r){
  if(!r||typeof r!=='object')return null;
  const p=r.practice||{};
  const out={intro:hoStr(r.intro,800),encourage:hoStr(r.encourage,300),
    index:(Array.isArray(r.index)?r.index:[]).map(x=>({left:hoStr(x&&x.left,120),block:Math.max(1,parseInt(x&&x.block)||1)})).filter(x=>x.left).slice(0,10),
    practice:{basic:hoArr(p.basic,8,400),advanced:hoArr(p.advanced,8,400),
      challenge:(Array.isArray(p.challenge)?p.challenge:[]).map(c=>typeof c==='string'?{q:hoStr(c,400),hint:''}:{q:hoStr(c&&c.q,400),hint:hoStr(c&&c.hint,200)}).filter(c=>c.q).slice(0,5)}};
  return out.practice.basic.length+out.practice.advanced.length+out.practice.challenge.length?out:null;
}
function hoNormAnswers(r){
  return (Array.isArray(r)?r:[]).map(a=>({no:parseInt(a&&a.no)||0,steps:hoArr(a&&a.steps,10,300),answer:hoStr(a&&a.answer,200)})).filter(a=>a.no);
}

/* --- 背景執行講義工作 --- */
function hoStart(bank,ids){
  if(HJ&&HJ.phase==='running'){toast('另一份講義還在產生中，請等它完成');return}
  const cons=bank.concepts.filter(c=>ids.has(c.id));
  HJ={bankId:bank.id,bankTitle:bank.title||bankInfo(bank),cids:cons.map(c=>c.id),blocks:[],extra:null,answers:null,
      step:0,total:hoCalls(cons.length),phase:'running',msg:'',all:cons.length===bank.concepts.length,t:Date.now()};
  hjSave();hoRun(bank);
}
async function hoRun(bank){
  if(!HJ)return;
  HJ.phase='running';HJ.msg='';hjSave();hoPill();
  const ctl=new AbortController();HJ_CTL=ctl;
  const cons=HJ.cids.map(id=>bank.concepts.find(c=>c.id===id)).filter(Boolean);
  const opt={signal:ctl.signal,cache:false,modelTier:'default'};
  try{
    while(HJ.blocks.length<cons.length){
      const con=cons[HJ.blocks.length];
      const b=hoNormBlock(await SAMPLE.json(hoBlockPrompt(bank,con),opt),con);
      if(!b)throw {code:'invalid_json'};
      HJ.blocks.push(b);HJ.step=HJ.blocks.length;hjSave();hoPill();hoRefresh(bank);
    }
    if(!HJ.extra){
      const x=hoNormPractice(await SAMPLE.json(hoPracticePrompt(bank,HJ.blocks,HJ.cids,hoLevels(cons.length)),opt));
      if(!x)throw {code:'invalid_json'};
      HJ.extra=x;HJ.step=cons.length+1;hjSave();hoPill();hoRefresh(bank);
    }
    if(!HJ.answers){
      HJ.answers=hoNormAnswers(await SAMPLE.json(hoAnswerPrompt(bank,HJ.blocks,HJ.extra.practice),opt));
      HJ.step=cons.length+2;hjSave();
    }
    const conTexts=cons.map(c=>c.text);
    const h={id:'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),bankId:bank.id,
      title:HJ.all&&cons.length>1?'整個題庫':cons.length===1?conTexts[0].slice(0,30):`${cons.length} 個觀念`,
      conceptIds:HJ.cids,conceptTexts:conTexts,createdAt:Date.now(),bankInfo:bankInfo(bank),bankTitle:bank.title||'',
      blocks:HJ.blocks,...HJ.extra,answers:HJ.answers};
    await api('handoutSave',{handout:h});
    delete hoList[bank.id];
    HJ.phase='done';HJ.hid=h.id;HJ.h={...h,status:'待驗算'};hjSave();
    toast('📘 重點講義完成了！');
  }catch(e){
    HJ.phase=e&&e.code==='cancelled'?'paused':'error';
    HJ.msg=e&&e.code==='cancelled'?'已暫停':aiErrMsg(e);hjSave();
  }
  HJ_CTL=null;hoPill();hoRefresh(bank);
}
function hoRefresh(bank){const el=document.getElementById('ho-gen');if(el&&el.dataset.bank===bank.id)handoutHome(bank,null,true)}
async function hoFindBank(id){
  let b=BANKS.find(x=>x.id===id);
  if(!b&&hasBackend()){try{await bsLoad()}catch(e){}b=BANKS.find(x=>x.id===id)}
  return b;
}
// 左下角的講義進度提示
function hoPill(){
  let p=document.getElementById('ho-pill');
  if(!HJ){if(p)p.remove();return}
  if(!p){p=document.createElement('button');p.id='ho-pill';p.className='ho-pill';document.body.appendChild(p)}
  p.setAttribute('role','status');p.setAttribute('aria-live','polite');
  const txt={running:`📘 講義產生中 ${HJ.step} / ${HJ.total}…`,done:'📘 講義完成了！點這裡看',
    error:`📘 講義沒有完成・點這裡繼續`,paused:`📘 講義暫停在 ${HJ.step} / ${HJ.total}・點這裡繼續`}[HJ.phase]||'';
  p.textContent=txt;p.classList.toggle('done',HJ.phase==='done');
  p.onclick=async()=>{
    const b=await hoFindBank(HJ.bankId);
    if(!b){toast('找不到這個題庫，可能已經刪除');HJ=null;hjSave();hoPill();return}
    if(HJ.phase==='done'){const h=HJ.h;HJ=null;hjSave();hoPill();handoutView(b,h);return}
    handoutHome(b);
  };
}
// 重新整理後：上次跑到一半的講義改成「暫停」，讓家長決定要不要繼續
if(HJ&&HJ.phase==='running'){HJ.phase='paused';hjSave()}
setTimeout(hoPill,0);

/* --- 頁面：重點講義（清單＋產生新講義） --- */
let hoSel=null;
async function handoutHome(bank,preset,keep){
  const own=!bank.__lib, canGen=own&&hasBackend();
  if(!keep||!hoSel||hoSel.bid!==bank.id){hoSel=defaultConcepts(bank,preset||[]);hoSel.bid=bank.id}
  const job=HJ&&HJ.bankId===bank.id&&HJ.phase!=='done'?HJ:null;
  const list=hoList[bank.id];
  const back=()=>own?bankHome(bank):libBankHome(bank);
  const stTag=s=>s==='已驗算'?'<span class="tag">✅ 已驗算</span>':s==='已修正'?'<span class="tag">🛠 已驗算並修正</span>':'<span class="tag warn">⏳ 等待驗算</span>';
  app.innerHTML=`
   <div class="toprow"><button class="iconbtn" id="bk">← ${esc(bank.title||bankInfo(bank))}</button></div>
   <h1 class="pg">📘 重點講義</h1>
   <p class="lead">把觀念整理成可以列印的講義：重點、例題、最常錯的地方、分層練習和詳解。</p>
   <section class="card"><h2 class="ct">已經做好的講義</h2>
     ${list?(list.length?`<ul class="list">${list.map(h=>`<li><span>${esc(h.title)}<br><small style="color:var(--muted)">${new Date(h.createdAt).toLocaleDateString('zh-TW')}・${esc(h.concepts||'')}</small><br>${stTag(h.status)}</span>
       <span style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><button class="iconbtn" data-hopen="${esc(h.id)}">打開</button>${own?`<button class="iconbtn" data-hdel="${esc(h.id)}" aria-label="刪除講義">🗑</button>`:''}</span></li>`).join('')}</ul>`
       :'<p class="lead" style="margin:8px 0 0">還沒有講義。</p>'):'<p class="lead" style="margin:8px 0 0">讀取中……</p>'}
   </section>
   ${canGen?`<section class="card" id="ho-gen" data-bank="${esc(bank.id)}"><h2 class="ct">產生新的重點講義</h2>
     ${job?`<div class="feedback"><p class="fb-head">${job.phase==='running'?`講義產生中（${job.step} / ${job.total}）`:job.phase==='paused'?`講義暫停在 ${job.step} / ${job.total}`:'講義沒有完成'}</p>
        <p class="fb-why">${job.phase==='running'?'可以先去練習或做別的事，完成後左下角會出現提示。':esc(job.msg||'')}</p>
        <div class="footer">${job.phase==='running'?'<button class="ghost" id="ho-stop">暫停</button>':'<button class="big" id="ho-cont" style="margin-top:0">繼續產生</button><button class="ghost" id="ho-drop">放棄這份</button>'}</div></div>`
     :sampleBlocked()||SAMPLE===undefined?aiUnavailableHTML():`
     <p class="lead" style="font-size:1rem;margin:6px 0">選一個觀念做單一觀念講義，或選多個、全選做整個題庫的講義。</p>
     <div id="ho-cp">${conceptPickerHTML(bank,hoSel)}</div>
     <p class="lead" style="font-size:1rem" id="ho-est"></p>
     ${quotaNote}
     <button class="big" id="ho-go">📘 產生講義</button>`}
   </section>`:''}`;
  const $=id=>document.getElementById(id);
  $('bk').onclick=back;
  app.querySelectorAll('[data-hopen]').forEach(b=>b.onclick=()=>hoOpen(bank,b.dataset.hopen));
  app.querySelectorAll('[data-hdel]').forEach(b=>b.onclick=async()=>{
    if(!await confirmBox('確定要刪除這份講義嗎？'))return;
    try{await api('handoutDelete',{id:b.dataset.hdel});hoList[bank.id]=(hoList[bank.id]||[]).filter(h=>h.id!==b.dataset.hdel);handoutHome(bank,null,true)}catch(e){toast(aiErrMsg(e))}});
  const est=()=>{const e=$('ho-est');if(e)e.textContent=hoSel.size?`已選 ${hoSel.size} 個觀念，大約使用 ${hoCalls(hoSel.size)} 次 AI，需要 1～3 分鐘。`:'請至少選一個觀念。'};
  if($('ho-cp')){bindConceptPicker($('ho-cp'),hoSel,est);est()}
  if($('ho-go'))$('ho-go').onclick=()=>{if(!hoSel.size){toast('請至少選一個觀念');return}hoStart(bank,hoSel);handoutHome(bank,null,true);toast('已送出，講義產生中，完成後會通知你')};
  if($('ho-stop'))$('ho-stop').onclick=()=>{if(HJ_CTL)HJ_CTL.abort()};
  if($('ho-cont'))$('ho-cont').onclick=()=>{hoRun(bank);handoutHome(bank,null,true)};
  if($('ho-drop'))$('ho-drop').onclick=async()=>{if(await confirmBox('放棄這份還沒完成的講義嗎？已經用掉的 AI 次數不會退回。')){HJ=null;hjSave();hoPill();handoutHome(bank,null,true)}};
  if(!keep)window.scrollTo(0,0);
  if(!list){
    try{const j=await hoApi(bank,bank.__lib?'libHandouts':'handoutList',{bankId:bank.id});hoList[bank.id]=j.handouts||[]}
    catch(e){hoList[bank.id]=[]}
    if(document.getElementById('bk')&&app.querySelector('h1.pg')&&app.querySelector('h1.pg').textContent.includes('重點講義'))handoutHome(bank,null,true);
  }
}
async function hoOpen(bank,id){
  toast('正在打開講義……');
  if(HJ&&HJ.phase==='done'&&HJ.hid===id){HJ=null;hjSave();hoPill()}
  try{const j=await hoApi(bank,bank.__lib?'libHandoutGet':'handoutGet',{id});handoutView(bank,j.handout)}
  catch(e){toast(e&&e.code==='not_found'?'找不到這份講義':'打不開講義，請稍後再試')}
}

/* --- 頁面：看講義（可列印、存成 PDF） --- */
function hoStep(t){const i=t.indexOf('：');return i>0&&i<24?`<b>${esc(t.slice(0,i))}</b>：${esc(t.slice(i+1))}`:esc(t)}
function hoHTML(h){
  const n=h.practice||{basic:[],advanced:[],challenge:[]};
  let k=0;
  const li=q=>`<li><b>${++k}.</b>　${esc(q)}</li>`;
  const b1=n.basic.map(li).join(''),b2=n.advanced.map(li).join('');
  const b3=n.challenge.map(c=>`<li><b>${++k}.</b>　${esc(c.q)}${c.hint?`<br><span class="hint">提示：${esc(c.hint)}</span>`:''}</li>`).join('');
  return `<article class="ho">
    <h1>${esc(h.bankTitle||'')}　重點講義</h1>
    <div class="sub">${esc(h.bankInfo||'')}・${esc(h.title||'')}</div>
    ${h.intro?`<div class="lead">${esc(h.intro)}</div>`:''}
    ${h.index&&h.index.length?`<h2>卡題索引</h2><p class="hint">寫題目卡住時，看看題目長得像哪一列，再去看那個觀念。</p>
      <table><tr><th>題目長這樣</th><th>去看</th></tr>${h.index.map(x=>`<tr><td>${esc(x.left)}</td><td>觀念${CN_NUM[x.block-1]||x.block}</td></tr>`).join('')}</table>`:''}
    ${(h.blocks||[]).map((b,i)=>`<h2>觀念${CN_NUM[i]}　${esc(b.title)}</h2>
      ${b.why?`<p>${esc(b.why)}</p>`:''}
      ${b.rules.length?`<div class="box"><span class="tag">🔑 重點</span><ul>${b.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>`:''}
      ${b.example&&b.example.q?`<div class="ex"><span class="tag">例題</span><p>${esc(b.example.q)}</p>${b.example.steps.map(s=>`<p>${hoStep(s)}</p>`).join('')}${b.example.answer?`<p><b>答案：<span class="red">${esc(b.example.answer)}</span></b></p>`:''}</div>`:''}
      ${b.mistake?`<div class="warn"><span class="tag">⚠️ 最常錯</span>　${esc(b.mistake)}</div>`:''}`).join('')}
    <h2>分層練習</h2>
    ${b1?`<h3>Level 1　基礎</h3><ol class="probs">${b1}</ol>`:''}
    ${b2?`<h3>Level 2　進階</h3><ol class="probs">${b2}</ol>`:''}
    ${b3?`<h3>挑戰題</h3><ol class="probs">${b3}</ol>`:''}
    ${h.answers&&h.answers.length?`<h2>詳解</h2>${h.answers.map(a=>`<div class="ans"><b>${a.no}.</b>　${a.steps.map(hoStep).join('<br>')}${a.answer?`<br><b>答案：<span class="red">${esc(a.answer)}</span></b>`:''}</div>`).join('')}`:''}
    ${h.encourage?`<div class="enc">${esc(h.encourage)}</div>`:''}
  </article>`;

function handoutView(bank,h){
  if(!h){toast('打不開講義');return}
  if('speechSynthesis' in window)speechSynthesis.cancel();
  const own=!bank.__lib;
  const st=h.status||'待驗算';
  // 列印時的頁尾：題庫名稱與頁碼（Chrome 支援；Safari 可能不顯示）
  let ps=document.getElementById('ho-page');if(!ps){ps=document.createElement('style');ps.id='ho-page';document.head.appendChild(ps)}
  const foot=String((h.bankTitle||'')+' 重點講義').replace(/[\\"]/g,'');
  ps.textContent=`@page{size:A4;margin:16mm 15mm 18mm 15mm;@bottom-center{content:"${foot} ・ 第 " counter(page) " 頁";font-size:8.5pt;color:#999}}`;
  app.innerHTML=`
   <div class="toprow noprint"><button class="iconbtn" id="bk">← 講義清單</button><button class="iconbtn" id="pr">🖨 列印／存成 PDF</button></div>

let tourDone=store.get('tour-done',{});
const tourShown=new Set();   // 這次開啟網頁已經自動顯示過的導覽
let CUR_TOUR=null;           // 目前頁面可以重看的導覽
let tourState=null;

function tourSteps(key){
  return (TOURS[key]||[]).map(s=>({...s,node:typeof s.el==='function'?s.el():$q(s.el)}))
    .filter(s=>s.node&&s.node.getClientRects().length);
}
function runTour(key,force){
  CUR_TOUR=key;helpBtn();
  if(!force&&(tourDone[key]||tourShown.has(key)))return;
  setTimeout(()=>{
    if(CUR_TOUR!==key)return;
    const steps=tourSteps(key);if(!steps.length)return;
    tourShown.add(key);endTour();
    tourState={key,steps,i:0};drawTour();
  },350);
}
function endTour(){
  if(!tourState)return;
  const chk=document.getElementById('tour-skip');
  if(chk&&chk.checked){tourDone[tourState.key]=true;store.set('tour-done',tourDone)}
  ['tour-block','tour-hole','tour-tip'].forEach(id=>{const e=document.getElementById(id);if(e)e.remove()});
  if(tourState.keys)tourState.keys();
  window.removeEventListener('resize',placeTour);window.removeEventListener('scroll',placeTour,true);
  tourState=null;
}
function drawTour(){
  const {steps,i,key}=tourState,s=steps[i];
  let block=document.getElementById('tour-block'),hole=document.getElementById('tour-hole'),tip=document.getElementById('tour-tip');
  const wasChecked=tip?document.getElementById('tour-skip').checked:!!tourDone[key];
  if(!block){
    block=document.createElement('div');block.id='tour-block';block.className='tour-block';
    hole=document.createElement('div');hole.id='tour-hole';hole.className='tour-hole';
    tip=document.createElement('div');tip.id='tour-tip';tip.className='tour-tip';tip.setAttribute('role','dialog');tip.setAttribute('aria-modal','true');tip.setAttribute('aria-label','使用說明');
    document.body.append(block,hole,tip);
    tourState.keys=modalKeys(tip,endTour);
    window.addEventListener('resize',placeTour);window.addEventListener('scroll',placeTour,true);
  }
  tip.innerHTML=`<p class="tour-step">${i+1} / ${steps.length}</p><p class="tour-title">${esc(s.title)}</p><p class="tour-text">${esc(s.text)}</p>
    <label class="tour-chk"><input type="checkbox" id="tour-skip" ${wasChecked?'checked':''}> 不再顯示這個介紹</label>
    <div class="tour-btns"><button class="iconbtn" id="tour-close">略過</button><span style="flex:1"></span>
      ${i?'<button class="iconbtn" id="tour-prev">上一步</button>':''}<button class="iconbtn tour-next" id="tour-next">${i===steps.length-1?'完成':'下一步'}</button></div>`;
  document.getElementById('tour-close').onclick=endTour;
  document.getElementById('tour-next').onclick=()=>{if(tourState.i>=steps.length-1)return endTour();tourState.i++;drawTour()};
  const pv=document.getElementById('tour-prev');if(pv)pv.onclick=()=>{tourState.i--;drawTour()};
  block.onclick=()=>document.getElementById('tour-next').focus();
  if(s.node.scrollIntoView)s.node.scrollIntoView({block:'center',behavior:'smooth'});
  placeTour();setTimeout(placeTour,350);
  document.getElementById('tour-next').focus();
}
function placeTour(){
  if(!tourState)return;
  const s=tourState.steps[tourState.i],hole=document.getElementById('tour-hole'),tip=document.getElementById('tour-tip');
  if(!s||!hole||!s.node.isConnected){endTour();return}
  const r=s.node.getBoundingClientRect(),pad=6,vw=window.innerWidth,vh=window.innerHeight;
  Object.assign(hole.style,{left:r.left-pad+'px',top:r.top-pad+'px',width:r.width+pad*2+'px',height:r.height+pad*2+'px'});
  const tw=Math.min(360,vw-24);tip.style.width=tw+'px';
  const th=tip.offsetHeight;
  let top=r.bottom+pad+12;
  if(top+th>vh-12)top=r.top-pad-12-th;
  if(top<12)top=Math.min(vh-th-12,Math.max(12,r.bottom+pad+12));
  const left=Math.min(vw-tw-12,Math.max(12,r.left+r.width/2-tw/2));
  Object.assign(tip.style,{top:top+'px',left:left+'px'});
}

  {id:'notebook',name:'綠格子作業簿',desc:'原本的風格，跟著裝置切換淺色／深色',sw:'linear-gradient(135deg,#F1F7EA 60%,#3D8B4F 60%)'},
];
function curStyle(){const v=document.documentElement.getAttribute('data-style');return STYLES.some(x=>x.id===v)?v:STYLES[0].id}
function setStyle(id){document.documentElement.setAttribute('data-style',id);try{localStorage.setItem('ui-style',id)}catch(e){}}
function styleBox(){
  const d=document.createElement('div');d.className='modal';
  const draw=()=>{d.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true" aria-label="切換介面風格">
    <p style="margin:0;font-size:1.25rem">🎨 介面風格</p>
    <div class="style-list">${STYLES.map(x=>`<button data-st="${x.id}" aria-pressed="${curStyle()===x.id}"><span class="sw" style="background:${x.sw}"></span><span>${esc(x.name)}<small>${esc(x.desc)}</small></span></button>`).join('')}</div>
    <div class="footer"><button class="iconbtn tour-next" data-k="1">完成</button></div></div>`;
    d.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{setStyle(b.dataset.st);draw();d.querySelector(`[data-st="${b.dataset.st}"]`).focus()});
    d.querySelector('[data-k="1"]').onclick=close;};
  document.body.appendChild(d);
  const close=()=>{d.remove();keys()};const keys=modalKeys(d,close);
  draw();d.querySelector('[aria-pressed="true"]').focus();
}
(function styleBtn(){
  const b=document.createElement('button');b.className='style-btn';b.id='style-btn';b.setAttribute('aria-label','切換介面風格');b.textContent='🎨';
  b.onclick=styleBox;document.body.appendChild(b);
})();
function helpBtn(){
  let b=document.getElementById('tour-help');
  if(!b){b=document.createElement('button');b.id='tour-help';b.className='tour-help';b.setAttribute('aria-label','看這一頁的使用說明');b.textContent='❔';document.body.appendChild(b);
    b.onclick=()=>{if(CUR_TOUR)runTour(CUR_TOUR,true)}}
  b.style.display=CUR_TOUR?'':'none';
}

// 每個頁面畫完後自動檢查是否要顯示導覽
(function hookTours(){
  const wrap=(name,key)=>{const f=window[name];if(typeof f!=='function')return;
    window[name]=function(...a){CUR_TOUR=null;helpBtn();const r=f.apply(this,a);
      const go=()=>{const k=typeof key==='function'?key(...a):key;if(k)runTour(k)};
      if(r&&typeof r.then==='function')r.then(go);else go();return r}};
  wrap('libHome','lib');wrap('home','plant');wrap('betaHome',()=>FAMILY.code?'mine':null);wrap('bankHome','bank');
  wrap('uploadPage','upload');wrap('reviewPage',()=>tourStepsReady('review'));wrap('libBankHome','libBank');
  wrap('ask','practice');wrap('analysisPage','analysis');
  const ans=window.answer;window.answer=function(...a){const r=ans.apply(this,a);runTour('feedback');return r};
})();
function tourStepsReady(k){return k}

/* --- 重新整理後回到原本的頁面 --- */
(async()=>{
  const r=store.get('resume',null); store.set('resume',null);
  if(r&&Date.now()-r.t<120000){
    if(r.p==='plantai'){aiState.phase='idle';aiPage();return}
    if(r.b){
      app.innerHTML='<p class="lead">載入中……</p>';
      await bsLoad();
      const b=BANKS.find(x=>x.id===r.b);
      if(b){(r.p==='gen'?genPage:uploadPage)(b);return}
    }
  }
  libHome();
})();
</script>
