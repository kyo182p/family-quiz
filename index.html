// 一次只請 AI 寫 5 種題型：回應比較快，手機不容易斷線；某一批失敗時，前面成功的照樣保留
const PARAM_PER_CALL=5;
async function runParam(bank){
  paramState.phase='working';paramPage(bank);
  const ctl=new AbortController();paramState.ctl=ctl;
  const prog=t=>{const p=document.getElementById('p-prog');if(p)p.textContent=t};
  const only=paramState.cons.size<bank.concepts.length?paramState.cons:null,target=paramState.count;
  let added=0,bad=[],ids=[],err=null,v={checked:0,moved:0},rounds=0;
  while(added<target&&rounds<Math.ceil(target/PARAM_PER_CALL)+1){
    rounds++;
    const want=Math.min(PARAM_PER_CALL,target-added);
    prog(`Claude 正在寫題型……（${added} / ${target} 種）`);
    let res=null;
    for(let t=0;t<2&&!res;t++){   // 連線斷掉時自動重試一次
      try{res=await SAMPLE.json(paramPrompt(bank,want,only),{signal:ctl.signal,cache:false,modelTier:'default'});err=null}
      catch(e){err=e;if(e&&(e.code==='cancelled'||!['network','invalid_json','empty_reply'].includes(e.code)))break}
    }
    if(!res)break;
    prog('程式正在試做每一種題型……');
    const r=addTemplates(bank,res);
    added+=r.added;bad.push(...r.bad);ids.push(...r.ids);
    if(r.added)await bsSave(bank);
  }
  if(ids.length&&!(err&&err.code==='cancelled')){prog('AI 正在驗算題意……');v=await verifyNew(bank,ids,ctl.signal)}
  paramState.phase='idle';paramState.ctl=null;
  if(added){paramState.msg='';
    bankHome(bank,`新增 ${added-v.moved} 種換數字題，每次練習都會換數字。${added<target&&err?`（後面幾批沒完成：${aiErrMsg(err)}）`:''}${bad.length?`另有 ${bad.length} 種題型沒通過程式檢查，已經丟掉。`:''}${v.moved?`有 ${v.moved} 種題意可能有問題，放在「待確認的題目」。`:''}`);return}
  paramState.msg=err?aiErrMsg(err)+(err.code==='network'?'（等待時請不要切換到別的 App 或鎖定螢幕）':''):`這次的題型都沒通過程式檢查（${[...new Set(bad)].slice(0,3).join('、')||'格式不對'}），請再試一次。`;
  paramPage(bank);
}

/* ===== 國語閱讀測驗：一篇文章配幾題，題目依 PIRLS 四種提問層次 =====
   文章存在 bank.passages（{id,title,text,genre}），題目的 p 是文章代號、rl 是提問層次（1 提取 2 推論 3 詮釋整合 4 比較評估）。
   觀念就用四種閱讀能力，答錯統計、講義、常錯觀念都能直接用。 */
const RL_NAME={1:'提取訊息',2:'推論',3:'詮釋整合',4:'比較評估'};
const RL_DESC={1:'文章裡直接寫出來的事',2:'文章沒直接寫、要連起兩處線索才知道的事',3:'主旨、人物的想法感受、段落之間的關係',4:'作者為什麼這樣寫、寫法好不好、和自己的經驗比較'};
const isChineseBank=b=>/國語|國文|華語|閱讀/.test(String(b.subject||'')+String(b.title||''));
const canReading=b=>!b.__lib&&isChineseBank(b)&&gradeNum(b)>=3;
const gradeNum=b=>cnNum((String(b.grade||'').match(/[一二三四五六\d]/)||[''])[0])||0;
// 各年級的文章長度、句子、題目層次比例（之後可依雷達結果調整）
// 確保題庫有四種閱讀能力的觀念，回傳 {1:觀念代號,...}
function readingConcepts(bank){
  const map={};
  [1,2,3,4].forEach(l=>{
    const text=`${RL_NAME[l]}：${RL_DESC[l]}`;
    let c=bank.concepts.find(x=>x.text.startsWith(RL_NAME[l]+'：'));
    if(!c){c={id:newId(bank,'k'),text};bank.concepts.push(c)}
    map[l]=c.id;
  });
  return map;
}
// 各年級的文章長度、句子、題目層次比例。比例依 PIRLS 2021（提取 20%、推論 30%、詮釋整合 30%、比較評估 20%），
// 中年級往提取、推論調高；108 課綱「分辨事實與意見」「議論文」到五、六年級才出現
const READ_LEVEL={
  3:{len:[350,500],sent:'句子短（大多 20 字以內），用三年級學過的常用字詞，成語最多 1 個且要常見',mix:[2,2,1,0],eval:''},
  4:{len:[400,550],sent:'句子以 25 字以內為主，可以有少數常見成語',mix:[1,2,1,1],eval:'比較評估題只考「從文中找出支持某個看法的理由」'},
  5:{len:[450,700],sent:'句子長短交錯，可以有較多描寫與常見成語，生難詞要能從上下文猜出意思',mix:[1,2,2,1],eval:'比較評估題可以考作者的寫法與用意，或分辨哪一句是事實、哪一句是意見'},
  6:{len:[750,1000],sent:'可以有轉折、對比、象徵等寫法，詞彙符合六年級程度',mix:[1,2,2,1],eval:'比較評估題可以考作者的寫法、立場與用意，或分辨事實與意見'},
};
const readLevel=b=>READ_LEVEL[Math.min(6,Math.max(3,gradeNum(b)||4))];
const GENRES_ALL=[['混合','說明文為主，搭配故事'],['記敘文','生活故事、人物經歷'],['說明文','介紹動物、科學、地方、物品'],['寓言童話','有寓意的小故事'],['應用文','書信、日記、活動公告'],['議論文','提出看法和理由（五、六年級）']];
const genresFor=b=>GENRES_ALL.filter(([g])=>g!=='議論文'||gradeNum(b)>=5);
// 「混合」：台灣的閱讀評量以說明文為主（例如故事 1 篇、說明文 2 篇），依題庫已有的文章輪流補
function pickGenre(bank,choice){
  if(choice!=='混合')return choice;
  const ps=bank.passages||[],n=g=>ps.filter(p=>p.genre===g).length;
  const story=n('記敘文')+n('寓言童話');
  if(n('說明文')<2*story+1)return '說明文';
  return story%2?'寓言童話':'記敘文';
}
// 依層次比例排出每一題考什麼（依文章順序，先提取、後評估）
function readPlan(bank,nQ){
  const mix=readLevel(bank).mix.slice(),tot=mix.reduce((a,b)=>a+b,0);
  const plan=[];mix.forEach((n,i)=>{for(let k=0;k<Math.round(n*nQ/tot);k++)plan.push(i+1)});
  while(plan.length<nQ)plan.splice(1,0,2);
  return plan.slice(0,nQ).sort((a,b)=>a-b);
}
function readPrompt(bank,genre,topic,nQ){
  const L=readLevel(bank),g=gradeNum(bank)||4,plan=readPlan(bank,nQ);
  const HOW={1:'答案是文中直接寫出來的事（時間、地點、人物做了什麼、說明文的定義或特徵），但選項要換句話說，不能照抄原文',
    2:'要連起文中兩處線索才知道（原因與結果、代名詞指的是誰、人物之間的關係），不能只靠常識或只讀一句',
    3:'要讀完整段或全文才答得出來（主旨、人物的個性或心情變化、段落之間的關係）',
    4:L.eval||'作者為什麼這樣安排、這樣寫的效果'};
  const titles=(bank.passages||[]).map(p=>'- '+p.title).join('\n');
  return `你是台灣的國小國語老師，要幫 ${g} 年級的孩子寫一份「閱讀測驗」：一篇原創短文，加上 ${nQ} 題選擇題。
題庫：${bankInfo(bank)}

文章：
- 文體：${genre}${topic?`；主題：${topic}`:'；主題自己選，貼近孩子生活或課本常見題材'}。
- 全文 ${L.len[0]}～${L.len[1]} 字（不可以少於 ${L.len[0]} 字），分成 3～6 段，段落之間用 \\n 分開。
- ${L.sent}。
- 必須是你自己寫的原創內容，不可以抄課本、繪本或任何已出版的文章；說明文的知識要正確。
- 不要和已經有的文章同題材：
${titles||'（還沒有）'}

題目（依文章順序排列，每一題的層次已經指定，請照做）：
${plan.map((l,i)=>`- 第 ${i+1} 題：${RL_NAME[l]}（rl=${l}）——${HOW[l]}`).join('\n')}

每一題都要符合：
- 一定要讀過這篇文章才答得出來；只靠常識、不看文章就能選對的題目不合格。
- 4 個選項，只有一個正確。錯誤選項要「看起來有道理但文中證據不支持」（只對一半、把兩個人物或兩件事弄混、超出文章的推測）。
- 4 個選項的長度、句型要相近，正確答案不可以特別長或特別詳細；選項之間不可以意思幾乎一樣，也不可以剛好兩兩相反。
- ev：從文章原文「一字不差」複製一句（10～40 字）作為這題答案的依據，孩子答完後網頁會把這句標出來；推論、詮釋題就選最關鍵的那一句。
- 不要問文章沒提到的事，也不要考字音字形。
- lv：提取為 1，推論為 2，詮釋整合與比較評估為 3。
- why：一兩句說明答案在哪一段、怎麼看出來，${g} 年級孩子看得懂。
- hint：一句提示，告訴孩子回去看哪一段或注意什麼，不能說出答案。

只回傳一個 JSON 物件，不要其他文字。文章和題目裡的對話、引用一律用「」，不要用半形引號 "；段落之間寫成 \\n，不要在字串裡直接換行：
{"title":"文章標題","text":"第一段……\\n第二段……","questions":[{"rl":1,"lv":1,"t":"mc","q":"題目","o":["選項一","選項二","選項三","選項四"],"a":"選項一","ev":"文章裡的原句","why":"解說","hint":"提示"}]}`;
}
const normTxt=s=>String(s||'').replace(/[\s　「」『』“”"'‘’]/g,'');
// 程式檢查：依據句真的在文章裡、正確答案沒有特別長
function readQCheck(q,text){
  if(q.ev&&!normTxt(text).includes(normTxt(q.ev)))return '依據句在文章裡找不到';
  if(q.t==='mc'&&q.o.length>=3){
    const others=q.o.filter(x=>x!==q.a).map(x=>[...x].length),la=[...q.a].length,mx=Math.max(...others);
    if(la>=mx*1.5&&la-mx>=6)return '正確答案比其他選項長很多，容易被猜到';
  }
  return '';
}
// 把一份 AI 回傳的文章與題目收進題庫：依據句找不到的題目丟掉，答案特別長的放待確認
function addReading(bank,res,genre){
  const title=String(res&&res.title||'').trim().slice(0,40),text=String(res&&res.text||'').replace(/\r/g,'').replace(/\\n/g,'\n').trim();
  const L=readLevel(bank);
  if(!title||text.length<Math.min(150,L.len[0]*.6)||text.length>2500)return {added:0,ids:[],bad:['文章長度不對']};
  const cmap=readingConcepts(bank);
  bank.passages=bank.passages||[];
  const pid=newId(bank,'p');
  const ids=new Set(bank.concepts.map(c=>c.id));
  const newIds=[],bad=[];let held=0;
  (Array.isArray(res.questions)?res.questions:[]).forEach(r=>{
    const rl=[1,2,3,4].includes(+r.rl)?+r.rl:2;
    const n=normQ({...r,c:cmap[rl],src:'AI',ansByAI:false,lv:rl===1?1:rl===2?2:3},ids);
    if(!n){bad.push('格式不對');return}
    const ev=String(r.ev||'').trim().slice(0,80);
    const q={...n,id:newId(bank,'q'),p:pid,rl,icon:'📖',...(ev?{ev}:{})};
    if(!ev){bad.push('沒有附依據句');return}
    const why=readQCheck(q,text);
    if(why==='依據句在文章裡找不到'){bad.push(why);return}
    if(why){bank.pending.push({...q,vnote:'程式檢查：'+why});held++;return}
    bank.questions.push(q);newIds.push(q.id);
  });
  if(newIds.length||held)bank.passages.push({id:pid,title,text,genre});
  return {added:newIds.length,held,ids:newIds,title,bad,len:text.length};
}
// 不看文章作答：AI 有把握答對的題目，表示靠常識就能答，沒考到閱讀
function guessPrompt(bank,qs){
  return `你是 ${bank.grade||''}的國小學生，正在寫閱讀測驗，但是「文章被遮住了」，你只看得到題目和選項。
請只用常識和題目、選項裡的線索作答。如果不看文章就有把握選出答案，sure 為 true；如果只是猜的，sure 為 false。

${qs.map(q=>`[${q.id}] ${q.q}　選項：${q.o.join('／')}`).join('\n')}

只回傳 JSON 陣列，不要其他文字：
[{"id":"題目代號","a":"選項原文","sure":true}]`;
}
async function guessCheck(bank,ids,signal){
  const qs=bank.questions.filter(q=>ids.includes(q.id)&&q.p&&q.t==='mc');
  if(!qs.length)return {moved:0};
  let res;try{res=await SAMPLE.json(guessPrompt(bank,qs),{signal,cache:false,modelTier:'quick'})}catch(e){return {moved:0,failed:true}}
  let moved=0;
  (Array.isArray(res)?res:[]).forEach(r=>{
    const q=qs.find(x=>x.id===String(r&&r.id));if(!q||r.sure!==true||String(r.a||'').trim()!==q.a)return;
    bank.questions=bank.questions.filter(x=>x.id!==q.id);
    bank.pending.push({...q,vnote:'不看文章也有把握答對，可能只考到常識，請確認或修改'});moved++;
  });
  if(moved)await bsSave(bank);
  return {moved};
}
const passageOf=(bank,q)=>q&&q.p&&bank&&(bank.passages||[]).find(p=>p.id===q.p)||null;
const paraHTML=(t,fmt)=>String(t||'').split(/\n+/).filter(s=>s.trim()).map(s=>`<p>${fmt(s.trim())}</p>`).join('');
// 答完題後在文章裡標出依據句
function markEvidence(pas,ev){
  const box=document.querySelector('#pas .ptext');if(!box||!ev)return false;
  const target=normTxt(ev);let hit=false;
  box.innerHTML=String(pas.text).split(/\n+/).filter(s=>s.trim()).map(s=>{
    s=s.trim();if(hit)return `<p>${esc(s)}</p>`;
    // 依據句可能和原文差在空白、引號：逐字比對（略過這些符號）找出範圍
    const chars=[...s],keep=chars.map((c,i)=>[c,i]).filter(([c])=>normTxt(c)),flat=keep.map(([c])=>c).join('');
    const at=flat.indexOf(target);if(at<0)return `<p>${esc(s)}</p>`;
    hit=true;const a=keep[at][1],b=keep[at+[...target].length-1][1]+1;
    return `<p>${esc(chars.slice(0,a).join(''))}<mark class="ev">${esc(chars.slice(a,b).join(''))}</mark>${esc(chars.slice(b).join(''))}</p>`;
  }).join('');
  if(hit){const d=document.getElementById('pas');if(d)d.open=true;const m=box.querySelector('mark.ev');if(m&&m.scrollIntoView)m.scrollIntoView({block:'nearest'})}
  return hit;
}

let readState={genre:'混合',topic:'',n:1,phase:'idle',msg:'',ctl:null};

   <div class="section-title">文體</div>
   <div class="chips">${genresFor(bank).map(([v,d])=>`<button class="chip" data-gr="${v}" aria-pressed="${readState.genre===v}">${v}<small>${d}</small></button>`).join('')}</div>
   <div class="section-title">主題（可不填）</div>
   <div class="form"><input id="r-topic" maxlength="30" placeholder="例如：第一次搭公車、海龜、颱風天" value="${esc(readState.topic)}"></div>
   <div class="section-title">要幾篇</div>
   <div class="chips">${[1,2,3].map(v=>`<button class="chip" data-rn="${v}" aria-pressed="${readState.n===v}">${v} 篇</button>`).join('')}</div>
   <p class="lead" style="font-size:1rem;margin-top:8px">每篇算 1 次 AI 使用次數，另外檢查題目約 2 次：一次看文章驗算答案，一次「不看文章作答」，靠常識就答得出來的題目會放到「待確認」。</p>

    $('r-stop').onclick=()=>readState.ctl&&readState.ctl.abort();
  }else{
    act.innerHTML=quotaNote+`<button class="big" id="r-start">📖 產生 ${readState.n} 篇閱讀測驗</button>${readState.msg?`<p class="lead" style="margin-top:12px">${esc(readState.msg)}</p>`:''}`;
    $('r-start').onclick=()=>{readState.msg='';runReading(bank,nQ)};

async function runReading(bank,nQ){
  readState.phase='working';readingPage(bank);
  const ctl=new AbortController();readState.ctl=ctl;
  const prog=t=>{const p=document.getElementById('r-prog');if(p)p.textContent=t};
  let titles=[],ids=[],err=null,v={checked:0,moved:0},gu={moved:0},held=0,bad=[];
  for(let i=0;i<readState.n;i++){
    const genre=pickGenre(bank,readState.genre);
    prog(`Claude 正在寫第 ${i+1} / ${readState.n} 篇文章（${genre}）……`);
    let res=null;
    for(let t=0;t<2&&!res;t++){
      try{res=await SAMPLE.json(readPrompt(bank,genre,readState.topic.trim(),nQ),{signal:ctl.signal,cache:false,modelTier:'default'});err=null}
      catch(e){err=e;if(e&&(e.code==='cancelled'||!['network','invalid_json','empty_reply'].includes(e.code)))break}
    }
    if(!res)break;
    const r=addReading(bank,res,genre);bad.push(...r.bad);held+=r.held||0;
    if(r.added||r.held){titles.push(r.title);ids.push(...r.ids);await bsSave(bank)}
  }
  if(ids.length&&!(err&&err.code==='cancelled')){
    prog('AI 正在讀文章、驗算答案……');v=await verifyNew(bank,ids,ctl.signal);
    prog('不看文章再作答一次，找出只靠常識就能答的題目……');gu=await guessCheck(bank,ids.filter(id=>bank.questions.some(q=>q.id===id)),ctl.signal);
  }
  readState.phase='idle';readState.ctl=null;
  if(titles.length){readState.msg='';
    const pend=v.moved+gu.moved+held,dropped=bad.length;
    bankHome(bank,`新增 ${titles.length} 篇閱讀測驗（${titles.map(t=>'「'+t+'」').join('、')}），共 ${ids.length-v.moved-gu.moved} 題收進題庫。${err?`（後面幾篇沒完成：${aiErrMsg(err)}）`:''}${pend?`有 ${pend} 題需要大人看一下，放在「待確認的題目」（${[v.moved?`驗算答案不同 ${v.moved} 題`:'',gu.moved?`不看文章也答得出來 ${gu.moved} 題`:'',held?`正確答案特別長 ${held} 題`:''].filter(Boolean).join('、')}）。`:''}${dropped?`另有 ${dropped} 題沒附上文章裡找得到的依據，已經丟掉。`:''}`);return}
  readState.msg=err?aiErrMsg(err):`這次產生的文章或題目不合格（${[...new Set(bad)].slice(0,3).join('、')||'格式不對'}），請再試一次。`;
  readingPage(bank);
}

function readEditor(q){
  const v=id=>document.getElementById(id).value.trim();
  const out={...q,q:v('e-q'),why:v('e-why'),detail:v('e-detail'),lv:+v('e-lv'),ansByAI:false};
  delete out.check;
  if(!out.detail)delete out.detail;
  if(q.t==='tf')out.a=v('e-a');
  else{
    const raw=[0,1,2,3].map(i=>v('e-o'+i));
    const ck=document.querySelector('input[name="e-ok"]:checked');
    const a=ck?raw[+ck.value]:'';
    out.o=raw.filter(Boolean); out.a=a;
  }
  if(q.tpl&&(out.q!==q.q||out.a!==q.a||JSON.stringify(out.o)!==JSON.stringify(q.o))){delete out.tpl;delete out.kinds}   // 改了題目數字就變成固定題
  return normQ(out)?{...out,...normQ(out),id:q.id,c:q.c}:null;
}

const needAnsCheck=q=>!!q.ansByAI&&!(q.check&&q.check.s==='pass');
function qStatus(q,key){
  const f=(FLAGS[key]&&FLAGS[key].f[q.id])||'';
  if(f==='issue'||(q.check&&q.check.s==='issue'))return 'issue';
  if(f==='reported')return 'reported';
  return q.check&&q.check.s==='pass'?'pass':'none';
}
function issueCounts(bank){
  const c={issue:0,reported:0};
  bank.questions.forEach(q=>{const s=qStatus(q,bank.id);if(s in c)c[s]++});

}

function tplFixPrompt(bank,qs){
  return `你是台灣的國小數學老師。下面是「${bankInfo(bank)}」題庫裡的換數字題題型（程式會依 vars 隨機換數字、用算式算答案），審題老師找到了問題。
請依照判讀意見修正每個題型：可以改變數範圍、加條件（when）、改題目文字、改答案或錯誤選項的算式、改解說。解說和題目不能說出在某些數字下會錯的話（例如「其他位數不變」在會進位時就錯了），寧可說得精確一點。
格式和原本一樣：vars（[最小,最大] 或 [最小,最大,間隔] 隨機整數，上下限可以是算式字串；字串是算式；中文字串陣列是隨機挑一個）、when（條件陣列）、text、ans、wrong、why、hint，{算式} 會換成數字。算式只能用 + - * / % ( ) 和 min max abs floor ceil round gcd lcm，比較用 < <= > >= == != && ||。

${qs.map(q=>`[${q.id}] 觀念：${(bank.concepts.find(c=>c.id===q.c)||{}).text||''}
題型：${JSON.stringify(q.tpl)}
判讀意見：${q.check.note}`).join('\n\n')}

只回傳 JSON 陣列，不要其他文字：
[{"id":"題目代號","tpl":{"vars":{},"when":[],"text":"","ans":"","wrong":[],"why":"","hint":""}}]`;
}
async function fixTemplates(bank,qs){
  qs=qs.filter(Boolean);if(!qs.length)return;
  if(sampleBlocked()||!SAMPLE){toast('目前不能使用 AI，請確認家庭邀請碼');return}
  let res;
  try{res=await busyRun(`AI 正在修正 ${qs.length} 個題型……`,()=>SAMPLE.json(tplFixPrompt(bank,qs),{cache:false,modelTier:'default'}))}
  catch(e){toast(aiErrMsg(e));return}
  let fixed=0;const bad=[];
  (Array.isArray(res)?res:[]).forEach(r=>{
    const q=qs.find(x=>x.id===String(r&&r.id));if(!q||!r.tpl)return;
    const t=r.tpl,tpl={vars:t.vars,when:t.when||[],text:String(t.text||''),ans:String(t.ans||''),wrong:t.wrong||[],why:String(t.why||''),hint:String(t.hint||'').slice(0,60)};
    const ck=tplCheck(tpl);if(!ck.ok){bad.push(ck.why);return}
    const s=ck.sample;
    Object.assign(q,{tpl,kinds:ck.kinds,q:s.q,o:shuffle([s.a,...s.wrong]),a:s.a,why:s.why||q.why,...(s.hint?{hint:s.hint.slice(0,60)}:{})});
    q.fixNote='依判讀意見修正：'+String(q.check.note||'').slice(0,120);
    delete q.check;delete q.detail;fixed++;
  });
  if(fixed)await busyRun('儲存中……',async()=>{await bsSave(bank);delete FLAGS[bank.id];await loadFlags(bank.id)});
  toast(fixed?`已修正 ${fixed} 個題型，恢復出題，下次掃題會再判讀一次${bad.length?`；${bad.length} 個沒通過程式檢查，請再試一次或刪除`:''}`:`修正後的題型沒通過程式檢查（${[...new Set(bad)].slice(0,2).join('、')||'格式不對'}），請再試一次或刪除`);
  listPage(bank);
}

function importBank(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const j=JSON.parse(String(r.result));
      if(!j||j.format!=='family-quiz-bank'||!j.bank)throw 0;
      const src=j.bank;
      const nb=fixBank({id:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),createdAt:Date.now(),
        grade:String(src.grade||''),term:String(src.term||''),subject:String(src.subject||''),publisher:String(src.publisher||''),unit:String(src.unit||''),title:String(src.title||'')});
      nb.concepts=(Array.isArray(src.concepts)?src.concepts:[]).map(c=>({id:String(c.id||''),text:String(c.text||'').slice(0,120)})).filter(c=>c.id&&c.text&&/^[\w.~:@+-]+$/.test(c.id));
      const ids=new Set(nb.concepts.map(c=>c.id));
      nb.questions=(Array.isArray(src.questions)?src.questions:[]).map(q=>{const n=normQ(q,ids);return n?{...n,id:newId(nb,'q')}:null}).filter(Boolean);
      if(!nb.questions.length)throw 0;
      applyView(nb);BANKS.unshift(nb); await bsSave(nb);
      toast(`已匯入 ${nb.questions.length} 題`); bankHome(nb);
    }catch(e){toast('這個檔案不是可以匯入的題庫檔')}
  };
  r.readAsText(file);
}

/* ===== 詳細解題（建立題庫時由 AI 一次產生，練習時不再呼叫 AI） ===== */
const DETAIL_BATCH=12;
let detState={phase:'idle',msg:'',ctl:null,done:0,total:0};
const needDetail=bank=>bank.questions.concat(bank.pending).filter(q=>!q.detail);

function detailPrompt(bank,qs){
  const con=c=>(bank.concepts.find(x=>x.id===c)||{}).text||'';
  const list=qs.map(q=>JSON.stringify({id:q.id,觀念:con(q.c),題型:q.t==='tf'?'是非':'選擇',題目:q.q,選項:q.o||undefined,答案:ansStr(q),原本解說:q.why}));
  return `你是台灣的國小老師。請幫下面每一題寫「詳細解題」，給${bank.grade||'國小'}的小朋友看。題庫：${bankInfo(bank)}。

規則：
1. 每題 2 到 4 句，150 字以內，用小朋友聽得懂的話。
2. 先說怎麼想出答案；選擇題要簡單說明其他選項為什麼不對；是非題是「錯」的，要說出正確的說法。
3. 有容易搞混的地方，最後提醒一句。
4. 只能根據題目、答案、觀念和原本解說，不要加入其他知識，也不可以改答案。

只回傳 JSON 陣列，不要其他文字，格式：
[{"id":"題目代號","detail":"詳細解題"}]

題目：
${list.join('\n')}`;
}

async function runDetail(bank){
  const todo=needDetail(bank);
  detState={phase:'working',msg:'',ctl:null,done:0,total:todo.length};
  detailPage(bank);
  let err=null,fail=0;
  for(let i=0;i<todo.length;i+=DETAIL_BATCH){
    const part=todo.slice(i,i+DETAIL_BATCH);
    const ctl=new AbortController();detState.ctl=ctl;
    try{
      const res=await SAMPLE.json(detailPrompt(bank,part),{signal:ctl.signal,cache:false,modelTier:'quick'});
      const map={};(Array.isArray(res)?res:[]).forEach(r=>{if(r&&r.id&&r.detail)map[String(r.id)]=String(r.detail).trim().slice(0,400)});
      part.forEach(q=>{if(map[q.id])q.detail=map[q.id]});
      await bsSave(bank);
    }catch(e){
      err=e;
      if(e&&['cancelled','bad_code','daily_limit','no_credit','not_configured'].includes(e.code))break;
      fail++;
    }
    detState.done=Math.min(todo.length,i+DETAIL_BATCH);
    if(detState.phase==='working')detailPage(bank);
  }
  const got=todo.filter(q=>q.detail).length;
  detState.phase='idle';detState.ctl=null;
  detState.msg=`完成 ${got} 題的詳解。`+(err?(fail?`有 ${fail} 批沒有成功，可以再按一次補上。`:aiErrMsg(err)):'');
  detailPage(bank);
}

/* ===== 學習分析（用作答紀錄統計，不需要 AI；家長摘要為選配） ===== */
const dayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function logDay(bank,ok){
  bank.days=bank.days||{};
  const k=dayKey(),x=bank.days[k]||(bank.days[k]={s:0,w:0});x.s++;if(!ok)x.w++;
  const keys=Object.keys(bank.days).sort();while(keys.length>60)delete bank.days[keys.shift()];
}
function bankStats(bank){
  const sum=qs=>qs.reduce((a,q)=>{const r=bank.rec[q.id]||{};a.s+=r.seen||0;a.w+=r.wrong||0;return a},{s:0,w:0});
  const acc=x=>x.s?(x.s-x.w)/x.s:null;
  const all=sum(bank.questions);
  const practiced=bank.questions.filter(q=>(bank.rec[q.id]||{}).seen).length;
  const levels=[1,2,3].map(l=>{const qs=bank.questions.filter(q=>q.lv===l);const x=sum(qs);return {l,n:qs.length,...x,acc:acc(x)}}).filter(x=>x.n);
  const concepts=bank.concepts.map(c=>{const qs=bank.questions.filter(q=>q.c===c.id);const x=sum(qs);const a=acc(x);
    const status=!x.s?'還沒練':(a>=.8&&x.s>=3?'已熟練':a<.6?'需要加強':'練習中');
    return {id:c.id,text:c.text,n:qs.length,...x,acc:a,status}}).filter(c=>c.n);
  const order={'需要加強':0,'練習中':1,'還沒練':2,'已熟練':3};
  concepts.sort((a,b)=>order[a.status]-order[b.status]||(a.acc??1)-(b.acc??1));
  const wrongQs=bank.questions.filter(q=>(bank.rec[q.id]||{}).wrong).sort((a,b)=>bank.rec[b.id].wrong-bank.rec[a.id].wrong).slice(0,10);
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dayKey(d);const x=(bank.days||{})[k]||{s:0,w:0};days.push({k,label:`${d.getMonth()+1}/${d.getDate()}`,...x})}
  return {all:{...all,acc:acc(all)},practiced,total:bank.questions.length,levels,concepts,wrongQs,days};
}

function hoNormDiag(r,cons){
  if(!r||typeof r!=='object'||!Array.isArray(r.roots))return null;
  const valid=new Set(cons.map(c=>c.id)),used=new Set();
  const roots=r.roots.slice(0,4).map(x=>({title:hoStr(x&&x.title,40),explain:hoStr(x&&x.explain,300),
    cids:[].concat(x&&x.cids||[]).map(String).filter(id=>valid.has(id)&&!used.has(id)&&used.add(id))})).filter(x=>x.title&&x.cids.length);
  if(!roots.length)return null;
  // 沒被歸到的觀念，放進第一個根本觀念
  cons.forEach(c=>{if(!used.has(c.id))roots[0].cids.push(c.id)});
  return {summary:hoStr(r.summary,500),roots};
}

function hoNormPic(p){
  if(!p||typeof p!=='object')return null;
  if(p.type==='svg'){const k=hoStr(p.key,30);return PICS[k.split(':')[0]]?{type:'svg',key:k}:null}
  if(p.type==='cards'||p.type==='flow'){
    const items=(Array.isArray(p.items)?p.items:[]).map(x=>({icon:hoStr(x&&x.icon,8),label:hoStr(x&&x.label,12),note:hoStr(x&&x.note,24)})).filter(x=>x.label).slice(0,p.type==='flow'?5:4);
    return items.length>=2?{type:p.type,items}:null;
  }
  return null;
}
function hoNormBlock(r,con){ // con：根本觀念 {title,cids}
  if(!r||typeof r!=='object')return null;
  const ex=r.example||{};
  const b={cids:con.cids,title:hoStr(r.title,60)||con.title,link:hoStr(r.link,400),pic:hoNormPic(r.pic),why:hoStr(r.why,400),rules:hoArr(r.rules,6,200),
    example:{q:hoStr(ex.q,400),steps:hoArr(ex.steps,8,300),answer:hoStr(ex.answer,200)},mistake:hoStr(r.mistake,400)};
  return b.why||b.rules.length?b:null;
}
function hoNormPractice(r){
  if(!r||typeof r!=='object')return null;
  const p=r.practice||{};
  const out={intro:hoStr(r.intro,800),encourage:hoStr(r.encourage,300),
    index:(Array.isArray(r.index)?r.index:[]).map(x=>({left:hoStr(x&&x.left,120),block:Math.max(1,parseInt(x&&x.block)||1)})).filter(x=>x.left).slice(0,10),
    practice:{basic:hoArr(p.basic,8,400),advanced:hoArr(p.advanced,8,400),
      challenge:(Array.isArray(p.challenge)?p.challenge:[]).map(c=>typeof c==='string'?{q:hoStr(c,400),hint:''}:{q:hoStr(c&&c.q,400),hint:hoStr(c&&c.hint,200)}).filter(c=>c.q).slice(0,5)}};
  return out.practice.basic.length+out.practice.advanced.length+out.practice.challenge.length?out:null;
}
function hoNormAnswers(r){
  return (Array.isArray(r)?r:[]).map(a=>({no:parseInt(a&&a.no)||0,steps:hoArr(a&&a.steps,10,300),answer:hoStr(a&&a.answer,200)})).filter(a=>a.no);
}

function hoStart(bank,ids){
  if(HJ&&HJ.phase==='running'){toast('另一份講義還在產生中，請等它完成');return}
  const cons=bank.concepts.filter(c=>ids.has(c.id));
  HJ={bankId:bank.id,bankTitle:bank.title||bankInfo(bank),cids:cons.map(c=>c.id),blocks:[],extra:null,answers:null,
      diag:cons.length===1?{summary:'',roots:[{title:cons[0].text,explain:'',cids:[cons[0].id]}]}:null,
      step:0,total:hoCalls(cons.length),phase:'running',msg:'',all:cons.length===bank.concepts.length,t:Date.now()};
  hjSave();hoRun(bank);
}
async function hoRun(bank){
  if(!HJ)return;
  HJ.phase='running';HJ.msg='';hjSave();hoPill();
  const ctl=new AbortController();HJ_CTL=ctl;
  const cons=HJ.cids.map(id=>bank.concepts.find(c=>c.id===id)).filter(Boolean);
  const opt={signal:ctl.signal,cache:false,modelTier:'default'};
  const base=cons.length>1?1:0;   // 有診斷時多一步
  if(!HJ.diag&&HJ.blocks.length){HJ.blocks=[];HJ.extra=null;HJ.answers=null}  // 舊版工作沒有診斷，重新開始
  try{
    if(!HJ.diag){
      const dg=hoNormDiag(await SAMPLE.json(hoDiagPrompt(bank,cons),opt),cons);
      if(!dg)throw {code:'invalid_json'};
      HJ.diag=dg;HJ.step=1;HJ.total=1+dg.roots.length+2;hjSave();hoPill();hoRefresh(bank);
    }
    const roots=HJ.diag.roots;
    while(HJ.blocks.length<roots.length){
      const root=roots[HJ.blocks.length];
      const b=hoNormBlock(await SAMPLE.json(hoBlockPrompt(bank,root),opt),root);
      if(!b)throw {code:'invalid_json'};
      HJ.blocks.push(b);HJ.step=base+HJ.blocks.length;hjSave();hoPill();hoRefresh(bank);
    }
    if(!HJ.extra){
      const x=hoNormPractice(await SAMPLE.json(hoPracticePrompt(bank,HJ.blocks,HJ.cids,hoLevels(cons.length,hoKid(bank)),HJ.diag),opt));
      if(!x)throw {code:'invalid_json'};
      HJ.extra=x;HJ.step=base+roots.length+1;hjSave();hoPill();hoRefresh(bank);
    }
    if(!HJ.answers){
      HJ.answers=hoNormAnswers(await SAMPLE.json(hoAnswerPrompt(bank,HJ.blocks,HJ.extra.practice),opt));
      HJ.step=base+roots.length+2;hjSave();
    }
    const conTexts=cons.map(c=>c.text);
    const h={id:'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),bankId:bank.id,
      title:HJ.all&&cons.length>1?'整個題庫':cons.length===1?conTexts[0].slice(0,30):`${cons.length} 個觀念`,
      conceptIds:HJ.cids,conceptTexts:conTexts,createdAt:Date.now(),bankInfo:bankInfo(bank),bankTitle:bank.title||'',grade:bank.grade||'',kid:hoKid(bank),
      diagnosis:HJ.diag.summary||'',
      blocks:HJ.blocks,...HJ.extra,answers:HJ.answers};
    await api('handoutSave',{handout:h});
    delete hoList[bank.id];
    HJ.phase='done';HJ.hid=h.id;HJ.h={...h,status:'待驗算'};hjSave();
    toast('📘 重點講義完成了！');
  }catch(e){
    HJ.phase=e&&e.code==='cancelled'?'paused':'error';
    HJ.msg=e&&e.code==='cancelled'?'已暫停':aiErrMsg(e);hjSave();
  }
  HJ_CTL=null;hoPill();hoRefresh(bank);
}

function hoPill(){
  let p=document.getElementById('ho-pill');
  if(!HJ){if(p)p.remove();return}
  if(!p){p=document.createElement('button');p.id='ho-pill';p.className='ho-pill';document.body.appendChild(p)}
  p.setAttribute('role','status');p.setAttribute('aria-live','polite');
  const txt={running:`📘 講義產生中 ${HJ.step} / ${HJ.total}…`,done:'📘 講義完成了！點這裡看',
    error:`📘 講義沒有完成・點這裡繼續`,paused:`📘 講義暫停在 ${HJ.step} / ${HJ.total}・點這裡繼續`}[HJ.phase]||'';
  p.textContent=txt;p.classList.toggle('done',HJ.phase==='done');
  p.onclick=async()=>{
    const b=await hoFindBank(HJ.bankId);
    if(!b){toast('找不到這個題庫，可能已經刪除');HJ=null;hjSave();hoPill();return}
    if(HJ.phase==='done'){const h=HJ.h;HJ=null;hjSave();hoPill();handoutView(b,h);return}
    handoutHome(b);
  };
}

// ===== 注音（一、二年級題庫）=====
// 讀音：pinyin-pro 先把繁體轉簡體再判斷（它的詞庫以簡體為主），再用台灣讀音差異表（zhuyin-tw.txt，教育部《重編國語辭典修訂本》，CC BY-ND 3.0 臺灣）蓋過。

const ZY_LIBS=['https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.5/dist/index.js','https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/t2cn.js'];
let ZY=null,ZY_FAIL=false,zyLoading=null,ZYB=null;
const zyGrade=b=>!!b&&/[一二12]\s*年級/.test(String(b.grade||''));
const zyOn=b=>zyGrade(b)&&store.get('zy-'+b.id,true)!==false;
const zySet=(b,v)=>store.set('zy-'+b.id,!!v);

function loadScript(u){return new Promise((ok,no)=>{const x=document.createElement('script');x.src=u;x.onload=ok;x.onerror=()=>no(new Error(u));document.head.appendChild(x)})}
function zyEnsure(){
  if(ZY)return Promise.resolve(ZY);
  if(!zyLoading)zyLoading=busyRun('載入注音……',async()=>{
    try{
      const [tsv]=await Promise.all([fetch('zhuyin-tw.txt').then(r=>r.ok?r.text():'').catch(()=>''),...ZY_LIBS.map(loadScript)]);
      const trie={},chars={};
      tsv.split('\n').forEach(l=>{const f=l.split('\t');if(f.length<3)return;if(f[0]==='w'){let n=trie;for(const c of f[1])n=n[c]||(n[c]={});n['\u0001']=f[2]}else if(f[0]==='c')chars[f[1]]=f[2]});
      ZY={pp:window.pinyinPro,t2s:window.OpenCC.Converter({from:'tw',to:'cn'}),trie,chars,cache:new Map()};
    }catch(e){ZY_FAIL=true;toast('注音載入失敗（可能是網路問題），這次先不顯示注音')}

  });

}
const ZY_INI={b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',g:'ㄍ',k:'ㄎ',h:'ㄏ',j:'ㄐ',q:'ㄑ',x:'ㄒ',zh:'ㄓ',ch:'ㄔ',sh:'ㄕ',r:'ㄖ',z:'ㄗ',c:'ㄘ',s:'ㄙ'};
const ZY_FIN={a:'ㄚ',o:'ㄛ',e:'ㄜ','ê':'ㄝ',er:'ㄦ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',i:'ㄧ',u:'ㄨ','ü':'ㄩ',ong:'ㄨㄥ',
  ia:'ㄧㄚ',io:'ㄧㄛ',ie:'ㄧㄝ',iao:'ㄧㄠ',iou:'ㄧㄡ',iu:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',iong:'ㄩㄥ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',uei:'ㄨㄟ',ui:'ㄨㄟ',
  uan:'ㄨㄢ',uen:'ㄨㄣ',un:'ㄨㄣ',uang:'ㄨㄤ',ueng:'ㄨㄥ','üe':'ㄩㄝ','üan':'ㄩㄢ','ün':'ㄩㄣ',iai:'ㄧㄞ'};
// 帶調拼音 → 注音（依教育部《國語注音符號手冊》：輕聲點在前，一聲不標）。轉寫規則參考 tjsky/pinyin-annotator（MIT）
function py2zy(py){
  if(!py)return '';
  const TONE={'̄':1,'́':2,'̌':3,'̀':4};let tone=5,b='';
  for(const ch of String(py).normalize('NFD')){if(TONE[ch])tone=TONE[ch];else if(ch!=='̇')b+=ch}
  b=b.normalize('NFC').replace(/v/g,'ü').toLowerCase();
  const base=s=>{
    if({m:1,n:1,ng:1}[s])return {m:'ㄇ',n:'ㄣ',ng:'ㄥ'}[s];
    if(s.length>2&&s!=='er'&&s.endsWith('r')){const t=base(s.slice(0,-1));return t?t+'ㄦ':null}
    if(s.startsWith('yu'))s='ü'+s.slice(2);else if(s[0]==='y')s=s[1]==='i'?'i'+s.slice(2):'i'+s.slice(1);
    else if(s.startsWith('wu'))s='u'+s.slice(2);else if(s[0]==='w')s='u'+s.slice(1);
    let ini='',r=s;
    if(/^(zh|ch|sh)/.test(s)){ini=s.slice(0,2);r=s.slice(2)}else if(ZY_INI[s[0]]){ini=s[0];r=s.slice(1)}
    if(/^[jqx]$/.test(ini)&&r[0]==='u')r='ü'+r.slice(1);else if(/^[ln]$/.test(ini)&&r.startsWith('ue'))r='üe'+r.slice(2);
    if(/^(zh|ch|sh|r|z|c|s)$/.test(ini)&&r==='i')r='';
    if(!r)return ini?ZY_INI[ini]:null;
    const f=ZY_FIN[r];if(!f)return null;return (ini?ZY_INI[ini]:'')+f;
  };
  const z=base(b);if(!z)return '';
  return tone===5?'˙'+z:z+['','','ˊ','ˇ','ˋ'][tone];
}
const isHan=c=>/\p{Script=Han}/u.test(c);
// 自動判斷的讀音（不含家長校正），每段文字只算一次
function zyAuto(text){
  if(!ZY)return null;
  if(ZY.cache.has(text))return ZY.cache.get(text);
  const a=[...text];let src=ZY.t2s(text);if([...src].length!==a.length)src=text;
  let pys=ZY.pp.pinyin(src,{type:'array',toneSandhi:false});
  if(pys.length!==a.length)pys=a.map(c=>isHan(c)?ZY.pp.pinyin(ZY.t2s(c),{toneSandhi:false}):'');
  let poly=[];try{poly=ZY.pp.polyphonic(src,{type:'array'})}catch(e){}
  for(let i=0;i<a.length;i++){ // 台灣讀音：詞（最長比對）優先，再看單字
    let n=ZY.trie,best=0,val=null;
    for(let j=i;j<a.length&&n[a[j]];j++){n=n[a[j]];if(n['\u0001']){best=j-i+1;val=n['\u0001']}}
    if(best){const v=val.split(' ');for(let k=0;k<best;k++)pys[i+k]=v[k];i+=best-1}
    else if(ZY.chars[a[i]])pys[i]=ZY.chars[a[i]];
  }
  const r=a.map((c,i)=>isHan(c)?{c,z:py2zy(pys[i]),p:(poly[i]||[]).length>1}:{c});
  ZY.cache.set(text,r);return r;
}
function zyRead(bank,text){
  const r=zyAuto(text);if(!r)return null;

// 選一個字的讀音：列出這個字所有讀音（含輕聲），也可以自己輸入

// ===== 列印練習卷：從題庫抽題排成 A4 題目卷＋答案卷；卷號相同就出一樣的卷，換卷號就是新的一份 =====
const sheetPrefs=store.get('sheet-prefs',{n:20,lv:0,scope:'all',why:false});
function seedRng(seed){let a=(seed>>>0)||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedShuffle(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sheetPool(bank,sp){
  let qs=bank.questions.filter(q=>lvMatch(q,sp.lv));
  if(sp.scope==='wrong')qs=qs.filter(q=>{const r=bank.rec[q.id];return r&&r.wrong});
  return qs;
}
function buildSheet(bank,sp,no){
  const rnd=seedRng(no*2654435761+bank.questions.length);
  const pool=seedShuffle(sheetPool(bank,sp),rnd);
  const pick=(sp.n?pool.slice(0,sp.n):pool).map(q0=>{
    const q=q0.tpl?tplInstance(q0,Math.floor(rnd()*1e9)):q0;   // 換數字題：數字跟著卷號換
    const o=q.t==='mc'?(q.o.includes('以上皆是')?seedShuffle(q.o.filter(x=>x!=='以上皆是'),rnd).concat('以上皆是'):orderOpts(q.o,a=>seedShuffle(a,rnd))):null;
    return {q,o};
  });
  // 是非題放前面、選擇題放後面，比較像學校考卷
  return pick.filter(x=>x.q.t==='tf').concat(pick.filter(x=>x.q.t!=='tf'));
}

let tourDone=store.get('tour-done',{});
const tourShown=new Set();   // 這次開啟網頁已經自動顯示過的導覽
let CUR_TOUR=null;           // 目前頁面可以重看的導覽
let tourState=null;

function tourSteps(key){
  return (TOURS[key]||[]).map(s=>({...s,node:typeof s.el==='function'?s.el():$q(s.el)}))
    .filter(s=>s.node&&s.node.getClientRects().length);
}
function runTour(key,force){
  CUR_TOUR=key;helpBtn();
  if(!force&&(tourDone[key]||tourShown.has(key)))return;
  setTimeout(()=>{
    if(parentHere())return;
    if(CUR_TOUR!==key)return;
    const steps=tourSteps(key);if(!steps.length)return;
    tourShown.add(key);endTour();
    tourState={key,steps,i:0};drawTour();
  },350);
}
function endTour(){
  if(!tourState)return;
  const chk=document.getElementById('tour-skip');
  if(chk&&chk.checked){tourDone[tourState.key]=true;store.set('tour-done',tourDone)}
  ['tour-block','tour-hole','tour-tip'].forEach(id=>{const e=document.getElementById(id);if(e)e.remove()});
  if(tourState.keys)tourState.keys();
  window.removeEventListener('resize',placeTour);window.removeEventListener('scroll',placeTour,true);
  tourState=null;
}
function drawTour(){
  const {steps,i,key}=tourState,s=steps[i];
  let block=document.getElementById('tour-block'),hole=document.getElementById('tour-hole'),tip=document.getElementById('tour-tip');
  const wasChecked=tip?document.getElementById('tour-skip').checked:!!tourDone[key];
  if(!block){
    block=document.createElement('div');block.id='tour-block';block.className='tour-block';
    hole=document.createElement('div');hole.id='tour-hole';hole.className='tour-hole';
    tip=document.createElement('div');tip.id='tour-tip';tip.className='tour-tip';tip.setAttribute('role','dialog');tip.setAttribute('aria-modal','true');tip.setAttribute('aria-label','使用說明');
    document.body.append(block,hole,tip);
    tourState.keys=modalKeys(tip,endTour);
    window.addEventListener('resize',placeTour);window.addEventListener('scroll',placeTour,true);
  }
  tip.innerHTML=`<p class="tour-step">${i+1} / ${steps.length}</p><p class="tour-title">${esc(s.title)}</p><p class="tour-text">${esc(s.text)}</p>
    <label class="tour-chk"><input type="checkbox" id="tour-skip" ${wasChecked?'checked':''}> 不再顯示這個介紹</label>
    <div class="tour-btns"><button class="iconbtn" id="tour-close">略過</button><span style="flex:1"></span>
      ${i?'<button class="iconbtn" id="tour-prev">上一步</button>':''}<button class="iconbtn tour-next" id="tour-next">${i===steps.length-1?'完成':'下一步'}</button></div>`;
  document.getElementById('tour-close').onclick=endTour;
  document.getElementById('tour-next').onclick=()=>{if(tourState.i>=steps.length-1)return endTour();tourState.i++;drawTour()};
  const pv=document.getElementById('tour-prev');if(pv)pv.onclick=()=>{tourState.i--;drawTour()};
  block.onclick=()=>document.getElementById('tour-next').focus();
  if(s.node.scrollIntoView)s.node.scrollIntoView({block:'center',behavior:'smooth'});
  placeTour();setTimeout(placeTour,350);
  document.getElementById('tour-next').focus();
}
function placeTour(){
  if(!tourState)return;
  const s=tourState.steps[tourState.i],hole=document.getElementById('tour-hole'),tip=document.getElementById('tour-tip');
  if(!s||!hole||!s.node.isConnected){endTour();return}
  const r=s.node.getBoundingClientRect(),pad=6,vw=window.innerWidth,vh=window.innerHeight;
  Object.assign(hole.style,{left:r.left-pad+'px',top:r.top-pad+'px',width:r.width+pad*2+'px',height:r.height+pad*2+'px'});
  const tw=Math.min(360,vw-24);tip.style.width=tw+'px';
  const th=tip.offsetHeight;
  let top=r.bottom+pad+12;
  if(top+th>vh-12)top=r.top-pad-12-th;
  if(top<12)top=Math.min(vh-th-12,Math.max(12,r.bottom+pad+12));
  const left=Math.min(vw-tw-12,Math.max(12,r.left+r.width/2-tw/2));
  Object.assign(tip.style,{top:top+'px',left:left+'px'});
}

/* ===== 家長端：憑證只留記憶體，世代號隔離上鎖前的回應 ===== */
let PARENT_SESSION=null;
const PARENT_IDLE_MS=180000;
let parentEpoch=0,parentTimer=null;
const parentHere=()=>location.hash==='#parent';
function parentActivity(){clearTimeout(parentTimer);if(parentHere())parentTimer=setTimeout(parentLock,PARENT_IDLE_MS)}
function parentLock(){
  const session=PARENT_SESSION;PARENT_SESSION=null;parentEpoch++;clearTimeout(parentTimer);
  document.getElementById('parent-page')?.replaceChildren();
  if(session)api('parentLogout',{session}).catch(()=>{});
  if(parentHere())parentPage();
}
document.addEventListener('visibilitychange',()=>{if(parentHere()&&document.visibilityState==='hidden')parentLock()});
for(const event of ['pointerdown','pointermove','keydown'])document.addEventListener(event,()=>{if(parentHere())parentActivity()},{passive:true});
window.addEventListener('hashchange',()=>{closeChildOverlays();parentLock();if(!parentHere())libHome()});
async function parentCall(action,data={}){
  const session=PARENT_SESSION;
  try{try{return await api(action,{...data,session})}catch(e){if(e.code==='busy'&&session===PARENT_SESSION)return await api(action,{...data,session});throw e}}
  catch(e){if(e.code==='no_session'&&session&&session===PARENT_SESSION)parentLock();throw e}
}
function parentError(root,message,retry){root.innerHTML='<p role="status">'+esc(message)+'</p><button class="ghost">再試一次</button>';root.querySelector('button').onclick=retry}
async function parentPage(){
  closeChildOverlays();
  const epoch=++parentEpoch;parentActivity();
  app.innerHTML=rewardMedals+'<section id="parent-page" class="parent-page"><header class="parent-bar"><strong>家長</strong><button id="parent-lock">上鎖</button><button id="parent-exit">回首頁</button></header><div id="parent-content" class="parent-body"></div></section>';
  document.getElementById('parent-lock').onclick=parentLock;
  document.getElementById('parent-exit').onclick=()=>{parentLock();location.hash=''};
  const root=document.getElementById('parent-content'),alive=()=>parentHere()&&epoch===parentEpoch&&root.isConnected;
  if(!FAMILY.code||READER.code){root.innerHTML='<p>這台裝置還沒有輸入家庭邀請碼，請先到首頁輸入。</p>';return}
  if(PARENT_SESSION)return parentMain();
  root.textContent='讀取中……';
  try{const status=await parentCall('parentStatus');if(alive())parentAuth(root,status,alive)}catch(e){if(alive())parentError(root,'連不到雲端，請稍後再試',parentPage)}
}
function pinKeyAction(e){
  if(e.ctrlKey||e.altKey||e.metaKey||e.isComposing)return null;
  const target=e.target;
  if(target&&typeof target.closest==='function'&&target.closest('input,textarea,select,[contenteditable]:not([contenteditable="false"])'))return null;
  if(/^[0-9]$/.test(e.key))return e.repeat?null:'digit';
  if(e.key==='Backspace')return 'back';
  if(e.key==='Enter'){
    if(e.repeat)return null;
    const button=target&&typeof target.closest==='function'&&target.closest('button');
    return button&&!button.hasAttribute('data-pin-key')?null:'enter';
  }
  return null;
}
let parentAuthKeys=null;
document.addEventListener('keydown',e=>{if(parentAuthKeys)parentAuthKeys(e)});
function parentAuth(root,status,alive){
  let pin='',sending=false,locked=!!status.locked,weakAccepted='';const setup=!status.hasPin;
  root.innerHTML='<h1 class="pg">'+(setup?'第一次設定家長 PIN':'輸入家長 PIN')+'</h1><p id="parent-auth-message" role="status"></p>'+(setup?'<p>設定碼由管理者提供。PIN 用 4～6 位數字，建議 6 位。</p><form id="parent-setup"><label>設定碼<input id="parent-code" autocapitalize="characters" autocomplete="off"></label><label>新 PIN<input id="parent-new-pin" type="password" inputmode="numeric" autocomplete="off"></label><label>再輸入一次<input id="parent-repeat-pin" type="password" inputmode="numeric" autocomplete="off"></label><button class="big">設定 PIN</button></form>':'<div class="parent-dots" aria-label="已輸入 0 位"></div><div class="parent-pad">'+['1','2','3','4','5','6','7','8','9','刪除','0','確定'].map(k=>'<button type="button" data-pin-key="'+k+'">'+k+'</button>').join('')+'</div><p>忘記 PIN 了？請管理者重設，並取得新的設定碼。</p>'+(window.self===window.top?'<button class="ghost" disabled>使用 Face ID（之後才有）</button>':''))+'<button class="ghost" id="parent-auth-retry">再試一次</button>';
  const msg=root.querySelector('#parent-auth-message');
  function draw(){
    if(!alive())return;
    if(!setup){const dots=root.querySelector('.parent-dots');dots.innerHTML=Array.from({length:6},(_,i)=>'<i class="'+(i<pin.length?'filled':'')+'"></i>').join('');dots.setAttribute('aria-label','已輸入 '+pin.length+' 位')}
    root.querySelectorAll('input,button').forEach(b=>{if(!b.textContent.includes('Face ID'))b.disabled=sending||locked});
    if(!setup)root.querySelector('[data-pin-key="確定"]').disabled=sending||locked||pin.length<4;
    if(locked)root.querySelector('#parent-auth-retry').disabled=false;
  }
  function lockMessage(minutes){locked=true;msg.textContent='輸入錯太多次，請 '+minutes+' 分鐘後再試'}
  if(locked)lockMessage(status.minutes);root.querySelector('#parent-auth-retry').onclick=parentPage;
  async function send(){
    if(sending||locked||!alive())return;let data;
    if(setup){
      const a=root.querySelector('#parent-new-pin').value,b=root.querySelector('#parent-repeat-pin').value;
      if(a!==b){msg.textContent='兩次輸入的 PIN 不一樣';return}
      if(!/^\d{4,6}$/.test(a)){msg.textContent='PIN 要 4～6 位數字';return}
      if((/^(\d)\1+$/.test(a)||'0123456789'.includes(a)||'9876543210'.includes(a))&&weakAccepted!==a){weakAccepted=a;msg.textContent='這組 PIN 很容易被猜到，建議換一組';return}
      data={pin:a,setupCode:root.querySelector('#parent-code').value.trim().toUpperCase()};
    }else{if(pin.length<4)return;data={pin};pin=''}
    sending=true;draw();
    try{
      const j=await parentCall(setup?'parentSetPin':'parentLogin',data);
      if(!alive()||document.visibilityState==='hidden'){if(j.session)api('parentLogout',{session:j.session}).catch(()=>{});return}
      PARENT_SESSION=j.session;root.querySelectorAll('input').forEach(i=>i.value='');await parentMain();
    }catch(e){
      if(!alive())return;
      if(e.code==='pin_exists'||e.code==='no_pin'){parentPage();return}
      if(e.code==='locked'||e.left===0)lockMessage(e.minutes||15);
      else msg.textContent=e.code==='bad_pin'?'PIN 不對，還可以再試 '+e.left+' 次':e.code==='bad_setup_code'?'設定碼不對，還可以再試 '+e.left+' 次':'連不到雲端，請稍後再試';
    }finally{sending=false;draw()}
  }
  function act(action,digit){
    if(sending||locked)return;
    if(action==='enter')return send();
    if(setup){
      const a=root.querySelector('#parent-new-pin'),b=root.querySelector('#parent-repeat-pin');
      const field=b.value||a.value.length>=6?b:a;
      if(action==='back'){const last=b.value?b:a;last.value=last.value.slice(0,-1)}
      else if(field.value.length<6)field.value+=digit;
      return;
    }
    pin=action==='back'?pin.slice(0,-1):(pin+digit).slice(0,6);
    draw();if(pin.length===6)return send();
  }
  if(setup)root.querySelector('form').onsubmit=e=>{e.preventDefault();return send()};
  else root.querySelectorAll('[data-pin-key]').forEach(b=>b.onclick=()=>{const k=b.dataset.pinKey;return act(k==='確定'?'enter':k==='刪除'?'back':'digit',k)});
  parentAuthKeys=e=>{
    if(!alive()){parentAuthKeys=null;return}
    if(MODALS.length)return;
    const action=pinKeyAction(e);if(action===null)return;
    e.preventDefault();if(sending||locked)return;
    return act(action,e.key);
  };
  draw();
}
function parentCacheKey(){return 'parent-cache:'+FAMILY.code}
function parentCacheGet(){try{return JSON.parse(localStorage.getItem(parentCacheKey()))||{}}catch(e){return {}}}

async function parentMain(tab='pending',notice=''){

  root.querySelector('form').onsubmit=e=>{e.preventDefault();return submit()};retry.onclick=submit;draw();
}

/* ===== 家庭玩家 ===== */
let PLAYERS=store.get('players-cache',[]);
const PLAYER_ICONS=['🌱','🦊','🐢','🐳','🦄','🚀','🐼','🐰','🦖','🐝','🌈','⭐'];
let switchingPlayer=false;
function playerButton(){
  const row=app.querySelector('.toprow');
  if(!row||!FAMILY.code||READER.code||document.getElementById('player-button'))return;
  const p=PLAYERS.find(p=>p.id===ACTIVE_PLAYER);
  const b=document.createElement('button');b.id='player-button';b.className='iconbtn';b.textContent=p?.icon||'🌱';
  b.setAttribute('aria-label','切換玩家：'+(p?.name||'玩家 1'));b.style.cssText='width:48px;height:48px;border-radius:50%;padding:0;flex-shrink:0';
  b.onclick=playerSheet;row.append(b);
}
async function refreshPlayers(withBalance=false){
  if(!FAMILY.code||READER.code)return;
  try{
    const j=await api('playerList',withBalance?{withBalance:true}:{});
    PLAYERS=j.players||[];
    // Cache identities only: balances must always come from the backend.
    store.set('players-cache',PLAYERS.map(({balance,...p})=>p));
    const ids=new Set(PLAYERS.map(p=>p.id));
    for(const k of Object.keys(localStorage)){const m=/^(p[a-z0-9]{1,12}):/.exec(k);if(m&&!ids.has(m[1]))localStorage.removeItem(k)}
    const p=PLAYERS.find(p=>p.id===ACTIVE_PLAYER);
    if(!p||p.status!=='啟用'){fallbackPlayer();return}
    document.getElementById('player-button')?.remove();playerButton();return PLAYERS;
  }catch(e){return null}
}
async function flushPlayerSaves(){
  for(const id of Object.keys(recTimers)){
    clearTimeout(recTimers[id]);delete recTimers[id];
    const b=BANKS.find(b=>b.id===id);if(b)bsSave(b);
  }
  await Promise.all(Object.values(saving).map(s=>s.busy).filter(Boolean));
  if(badgeSyncing)await badgeSyncing;
}
async function switchPlayer(pid){
  if(switchingPlayer)return;
  switchingPlayer=true;
  try{await flushPlayerSaves();store.set('player',pid);location.reload()}finally{switchingPlayer=false}
}
function fallbackPlayer(){
  if(ACTIVE_PLAYER==='p1'||switchingPlayer)return;
  const p=PLAYERS.find(p=>p.id==='p1');
  // The server has refused this player: keep local backups, never retry them as p1.
  switchingPlayer=true;store.set('player','p1');store.set('resume',null);
  store.set('player-notice','這位玩家已被家長停用，先切回 '+(p?.name||'玩家 1'));location.reload();
}
async function playerSheet(){
  document.getElementById('player-sheet')?.remove();
  const overlay=document.createElement('div');overlay.id='player-sheet';overlay.className='player-overlay';
  overlay.innerHTML='<section class="player-panel" role="dialog" aria-modal="true" aria-labelledby="player-title"><div class="toprow"><h2 id="player-title">選一位玩家</h2><button class="iconbtn" id="player-close" aria-label="關閉">✕</button></div><p id="player-message" role="status">讀取中……</p><div id="player-list"></div><div id="player-form"></div></section>';
  document.body.append(overlay);
  const close=()=>{overlay.remove();document.getElementById('player-button')?.focus()};
  document.getElementById('player-close').onclick=close;
  overlay.onclick=e=>{if(e.target===overlay)close()};
  overlay.onkeydown=e=>{
    if(e.key==='Escape')close();
    if(e.key==='Tab'){const items=[...overlay.querySelectorAll('button:not(:disabled),input')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
  };
  document.getElementById('player-close').focus();
  const players=await refreshPlayers(true);if(!overlay.isConnected)return;
  const msg=document.getElementById('player-message');
  if(!players){msg.textContent='連不到雲端，請稍後再試。';const retry=document.createElement('button');retry.className='ghost';retry.textContent='再試一次';retry.onclick=playerSheet;msg.after(retry);return}
  msg.textContent='';
  const render=()=>{
    const list=document.getElementById('player-list');
    list.innerHTML=PLAYERS.filter(p=>p.status==='啟用').sort((a,b)=>a.order-b.order).map(p=>{
      const bal=p.balance;
      return `<div class="player-row"><button class="player-pick iconbtn" data-player="${esc(p.id)}"><span class="player-avatar">${esc(p.icon)}</span><span>${esc(p.name)}<small>銀 ${bal?.silver.available??'—'}・金 ${bal?.gold.available??'—'}</small></span><span>${p.id===ACTIVE_PLAYER?'使用中':''}</span></button><button class="iconbtn" data-edit-player="${esc(p.id)}" aria-label="修改${esc(p.name)}">修改</button></div>`;
    }).join('');
    list.querySelectorAll('[data-player]').forEach(b=>b.onclick=async()=>{b.disabled=true;msg.textContent='儲存中……';await switchPlayer(b.dataset.player)});
    list.querySelectorAll('[data-edit-player]').forEach(b=>b.onclick=()=>form(PLAYERS.find(p=>p.id===b.dataset.editPlayer)));
  };
  function form(p){
    let icon=p?.icon||'🌱';
    const root=document.getElementById('player-form');
    root.innerHTML=`<form class="form"><h3>${p?'修改玩家':'新增玩家'}</h3><label>暱稱<input id="player-name" maxlength="24" placeholder="不要填真名" value="${esc(p?.name||'')}" required></label><div class="player-icons" role="group" aria-label="選一個圖示">${PLAYER_ICONS.map(i=>`<button type="button" class="iconbtn" data-player-icon="${i}" aria-pressed="${i===icon}">${i}</button>`).join('')}</div><button class="big" id="player-submit">${p?'儲存修改':'新增玩家'}</button>${p?'<button type="button" class="ghost" id="player-new">改為新增玩家</button>':''}</form>`;
    root.querySelectorAll('[data-player-icon]').forEach(b=>b.onclick=()=>{icon=b.dataset.playerIcon;root.querySelectorAll('[data-player-icon]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
    document.getElementById('player-new')?.addEventListener('click',()=>form());
    root.querySelector('form').onsubmit=async e=>{
      e.preventDefault();const name=document.getElementById('player-name').value.trim();
      if(!name||Array.from(name).length>12){msg.textContent='暱稱請填 1～12 個字';return}
      const button=document.getElementById('player-submit');button.disabled=true;msg.textContent='儲存中……';
      try{await api('playerSave',{name,icon,...(p?{playerId:p.id}:{})});if(!await refreshPlayers(true))throw {code:'network'};render();form();msg.textContent='已儲存'}
      catch(e){msg.textContent=e.code==='player_limit'?'最多可以有 12 位玩家':'儲存失敗，請再試一次。'}finally{button.disabled=false}
    };
  }
  render();form();
}

// 每個頁面畫完後自動檢查是否要顯示導覽
(function hookTours(){
  const wrap=(name,key)=>{const f=window[name];if(typeof f!=='function')return;
    window[name]=function(...a){CUR_TOUR=null;helpBtn();const r=f.apply(this,a);
      const go=()=>{if(['libHome','home','betaHome'].includes(name)){playerButton();if(ACTIVE_PLAYER!=='p1'&&!parentHere())refreshPlayers()}const k=typeof key==='function'?key(...a):key;if(k)runTour(k)};
      if(r&&typeof r.then==='function')r.then(go);else go();return r}};
  wrap('libHome','lib');wrap('home','plant');wrap('betaHome',()=>FAMILY.code?'mine':null);wrap('bankHome','bank');
  wrap('uploadPage','upload');wrap('reviewPage',()=>tourStepsReady('review'));wrap('libBankHome','libBank');
  wrap('ask','practice');wrap('analysisPage','analysis');
  const ans=window.answer;window.answer=function(...a){const r=ans.apply(this,a);runTour('feedback');return r};
})();
function tourStepsReady(k){return k}

/* --- 重新整理後回到原本的頁面 --- */
(async()=>{
  if(parentHere()){parentPage();return}
  const r=store.get('resume',null); store.set('resume',null);
  if(r&&Date.now()-r.t<120000){
    if(r.p==='plantai'){aiState.phase='idle';aiPage();return}
    if(r.b){
      app.innerHTML='<p class="lead">載入中……</p>';
      await bsLoad();
      if(parentHere())return;
      const b=BANKS.find(x=>x.id===r.b);
      if(b){(r.p==='gen'?genPage:uploadPage)(b);return}
    }
  }
  libHome();
  if(ACTIVE_PLAYER==='p1')refreshPlayers();
  const notice=store.get('player-notice','');if(notice){store.set('player-notice','');toast(notice)}
  setTimeout(badgeSync,3000);   // 開站後在背景把徽章和雲端對一次
})();
</script>
